<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Availability — Paddle Tennis League</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand"><img src="wbp-logo.png" alt="WBP"><span>WBP</span> League</a>
  <ul class="nav-links">
    <li><a href="standings.html"    data-page="standings">Standings</a></li>
    <li><a href="results.html"      data-page="results">Results</a></li>
    <li><a href="player.html"       data-page="player">Players</a></li>
    <li><a href="matchups.html"     data-page="matchups">Matchups</a></li>
    <li><a href="availability.html" data-page="availability">Availability</a></li>
    <li><a href="suggestions.html"  data-page="suggestions">Suggestions</a></li>
    <li><a href="photos.html"       data-page="photos">Photos</a></li>
    <li><a href="golf.html?v=2"         data-page="golf">Golf</a></li>
  </ul>
  <button id="nav-hamburger" aria-label="Open menu" aria-expanded="false">&#9776;</button>
  <button id="nav-auth-btn">Sign In</button>
</nav>
<script>
  (function () {
    var btn = document.getElementById('nav-hamburger')
    btn.addEventListener('click', function () {
      var open = btn.closest('nav').classList.toggle('nav-open')
      btn.textContent = open ? '\u2715' : '\u2630'
      btn.setAttribute('aria-expanded', open)
    })
    document.querySelectorAll('.nav-links a').forEach(function (a) {
      a.addEventListener('click', function () {
        btn.closest('nav').classList.remove('nav-open')
        btn.textContent = '\u2630'
        btn.setAttribute('aria-expanded', 'false')
      })
    })
  })()
</script>

<main>
  <h1 class="page-title">Availability</h1>
  <p class="page-subtitle" id="avail-subtitle">Loading…</p>

  <div style="max-width:560px;margin:0 auto;">
    <div id="availability-container">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading…</p>
      </div>
    </div>
  </div>
</main>

<footer>WBP League &copy; <span id="footer-year"></span></footer>

<script>
  document.getElementById('footer-year').textContent = new Date().getFullYear()
</script>

<script type="module">
  import { requireLogin, getCurrentMember, initNav } from './js/auth.js'
  import { loadAvailability } from './js/availability.js'

  ;(async () => {
    initNav('availability')

    const session = await requireLogin()
    if (!session) return // redirect handled inside requireLogin

    const member = await getCurrentMember()
    if (!member) {
      document.getElementById('availability-container').innerHTML =
        '<div class="alert alert-error">Could not load your member profile. Please try signing out and back in.</div>'
      return
    }

    const firstName = member.full_name.split(',')[0].trim()
    document.getElementById('avail-subtitle').textContent =
      `Hi, ${firstName}! Mark your availability for upcoming match weeks.`

    await loadAvailability(member.id)
  })()
</script>
</body>
</html>
