<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matchups — Paddle Tennis League</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ---- Match-detail modal ---- */
    .mu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .mu-overlay.open { display: flex; }

    .mu-modal {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      animation: muSlide 0.18s ease;
    }
    @keyframes muSlide {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .mu-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 2px solid var(--green-pale);
      flex-shrink: 0;
    }
    .mu-modal-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--green-dark);
      line-height: 1.3;
    }
    .mu-modal-subtitle {
      font-size: 0.75rem;
      color: var(--gray-600);
      margin-top: 0.1rem;
    }
    .mu-modal-close {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--gray-600);
      line-height: 1;
      padding: 0.2rem 0.4rem;
      flex-shrink: 0;
    }
    .mu-modal-close:hover { color: var(--green-dark); }

    .mu-modal-body {
      overflow-y: auto;
      padding: 0.75rem 1.25rem 1.25rem;
      flex: 1;
    }

    /* Individual match row inside modal */
    .mu-match-row {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--gray-200);
    }
    .mu-match-row:last-child { border-bottom: none; }

    .mu-result-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 800;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }
    .mu-win  { background: #2b7a3d; color: #fff; }
    .mu-loss { background: #dc3545; color: #fff; }

    .mu-match-detail { flex: 1; }
    .mu-match-meta {
      font-size: 0.75rem;
      color: var(--gray-600);
      font-weight: 600;
      margin-bottom: 0.2rem;
    }
    .mu-match-teams {
      font-size: 0.88rem;
      color: var(--gray-800);
      line-height: 1.4;
    }
    .mu-match-teams strong { color: var(--green-dark); }
    .mu-match-sets {
      font-size: 0.82rem;
      color: var(--gray-600);
      margin-top: 0.15rem;
      font-weight: 600;
    }

    /* Make player name cells in table look clickable */
    .mu-name-btn {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      font-weight: 600;
      color: inherit;
      cursor: pointer;
      border-bottom: 1px dotted var(--accent);
      text-align: left;
      transition: color 0.15s;
    }
    .mu-name-btn:hover { color: var(--accent); }

    .mu-empty {
      text-align: center;
      color: var(--gray-600);
      font-size: 0.9rem;
      padding: 1.5rem 0;
    }
  </style>

<body>

<!-- Match-detail modal -->
<div class="mu-overlay" id="mu-overlay" role="dialog" aria-modal="true">
  <div class="mu-modal" id="mu-modal">
    <div class="mu-modal-header">
      <div>
        <div class="mu-modal-title"  id="mu-title">—</div>
        <div class="mu-modal-subtitle" id="mu-subtitle">—</div>
      </div>
      <button class="mu-modal-close" id="mu-close" aria-label="Close">&times;</button>
    </div>
    <div class="mu-modal-body" id="mu-body"></div>
  </div>
</div>

<main>
  <h1 class="page-title">Matchups</h1>
  <p class="page-subtitle">Select a player to see their record with partners and against opponents.</p>

  <div class="season-bar">
    <label for="season-select">Season:</label>
    <select id="season-select"></select>
  </div>

  <div class="card">
    <div class="form-group" style="margin-bottom:0;">
      <label for="player-select">Select Player</label>
      <select id="player-select">
        <option value="">— Choose a player —</option>
      </select>
    </div>
  </div>

  <div id="matchups-container"></div>
</main>

<footer>WBP League &copy; <span id="footer-year"></span></footer>

<script type="module">
  import { initNav } from './js/auth.js'
  import { supabase, connectionErrorHtml } from './js/supabase-client.js'
  import { CURRENT_SEASON } from './js/config.js'
  import { isWinner, matchScore, fmt } from './js/scoring.js'
  initNav('matchups')

  // ── Modal wiring ───────────────────────────────────────────────────────
  const overlay = document.getElementById('mu-overlay')
  const muClose = document.getElementById('mu-close')
  function closeModal() { overlay.classList.remove('open') }
  muClose.addEventListener('click', closeModal)
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal() })
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal() })

  // ── Season state ───────────────────────────────────────────────────────
  const seasonSelect   = document.getElementById('season-select')
  let _activeSeason    = localStorage.getItem('activeSeason') || CURRENT_SEASON

  // ── Data ───────────────────────────────────────────────────────────────
  let allMembers       = []
  let allMatchesData   = []   // full match list, fetched once at init
  let allMatches       = []   // season-filtered view of allMatchesData
  let memberMap        = {}
  let allMemberSeasons = []   // [{ member_id, season }]

  // ── Populate season dropdown (derived from the matches fetched at init) ─
  function populateSeasonDropdown() {
    const seasons = [...new Set(allMatchesData.map(m => m.season))].sort().reverse()
    const options = [seasons[0], 'all', ...seasons.slice(1)]
    seasonSelect.innerHTML = options.map(s => {
      if (s === 'all') return `<option value="all"${_activeSeason === 'all' ? ' selected' : ''}>Entire History</option>`
      return `<option value="${s}"${s === _activeSeason ? ' selected' : ''}>${s}${s === CURRENT_SEASON ? ' (Current)' : ''}</option>`
    }).join('')
    if (!seasons.includes(_activeSeason) && _activeSeason !== 'all') {
      _activeSeason = seasons[0] || CURRENT_SEASON
      seasonSelect.value = _activeSeason
    }
  }

  seasonSelect.addEventListener('change', () => {
    _activeSeason = seasonSelect.value
    localStorage.setItem('activeSeason', _activeSeason)
    document.getElementById('matchups-container').innerHTML = ''
    loadSeasonData()
  })

  // ── Filter cached matches for the season + rebuild player dropdown ─────
  function loadSeasonData() {
    allMatches = _activeSeason === 'all'
      ? allMatchesData
      : allMatchesData.filter(m => m.season === _activeSeason)
    memberMap  = Object.fromEntries(
      allMembers.filter(m => m.full_name !== 'Forfeit').map(m => [m.id, m.full_name])
    )

    // Determine membership reference season
    const refSeason = _activeSeason === 'all' ? CURRENT_SEASON : _activeSeason
    const activeMemberIds = new Set(
      allMemberSeasons.filter(ms => ms.season === refSeason).map(ms => ms.member_id)
    )
    const everMemberIds = new Set(allMemberSeasons.map(ms => ms.member_id))

    function playedInMatches(m) {
      return allMatches.some(
        mx => mx.team1_player1 === m.id || mx.team1_player2 === m.id ||
              mx.team2_player1 === m.id || mx.team2_player2 === m.id
      )
    }

    // Rebuild player dropdown — only show players who appear in match data this season
    const select = document.getElementById('player-select')
    const prevVal = select.value
    select.innerHTML = '<option value="">— Choose a player —</option>'

    const activeMembers = allMembers.filter(m =>
      !m.is_guest && activeMemberIds.has(m.id) && playedInMatches(m))
    const formerMembers = allMembers.filter(m =>
      !m.is_guest && !activeMemberIds.has(m.id) && everMemberIds.has(m.id) && playedInMatches(m))
    const guests = allMembers.filter(m =>
      m.is_guest && m.full_name !== 'Forfeit' && playedInMatches(m))

    const addGroup = (label, list) => {
      if (list.length === 0) return
      const grp = document.createElement('optgroup')
      grp.label = label
      list.forEach(m => {
        const opt = document.createElement('option')
        opt.value = m.id; opt.textContent = m.full_name
        grp.appendChild(opt)
      })
      select.appendChild(grp)
    }

    addGroup('Members', activeMembers)
    addGroup('Former Members', formerMembers)
    addGroup('Guests', guests)

    // Restore previously selected player if still present in this season
    if (prevVal && [...select.options].some(o => o.value === prevVal)) {
      select.value = prevVal
      showMatchups(prevVal)
    } else {
      // Check URL param (e.g. matchups.html?id=UUID) — e.g. from the Players tab
      const preselect = new URLSearchParams(window.location.search).get('id')
      if (preselect && [...select.options].some(o => o.value === preselect)) {
        select.value = preselect
        showMatchups(preselect)
      } else {
        document.getElementById('matchups-container').innerHTML = ''
      }
    }
  }

  // ── Load ───────────────────────────────────────────────────────────────
  async function init() {
    let membersRes, seasonsRes, matchesRes
    try {
      [membersRes, seasonsRes, matchesRes] = await Promise.all([
        supabase.from('members').select('id, full_name, is_guest').order('full_name'),
        supabase.from('member_seasons').select('member_id, season'),
        supabase.from('matches').select('*').order('played_on', { ascending: false })
      ])
    } catch (err) {
      document.getElementById('matchups-container').innerHTML = connectionErrorHtml()
      return
    }

    if (membersRes.error || matchesRes.error) {
      document.getElementById('matchups-container').innerHTML =
        '<div class="alert alert-error">Failed to load data. Please try again.</div>'
      return
    }

    allMembers       = membersRes.data
    allMemberSeasons = seasonsRes.data || []
    allMatchesData   = matchesRes.data

    const select = document.getElementById('player-select')
    select.addEventListener('change', () => {
      if (select.value) showMatchups(select.value)
      else document.getElementById('matchups-container').innerHTML = ''
    })

    populateSeasonDropdown()
    loadSeasonData()
  }

  // ── Aggregate records ──────────────────────────────────────────────────
  function withPartners(memberId, matches) {
    const rec = {}
    for (const m of matches) {
      const onTeam1 = m.team1_player1 === memberId || m.team1_player2 === memberId
      const onTeam2 = m.team2_player1 === memberId || m.team2_player2 === memberId
      if (!onTeam1 && !onTeam2) continue
      const partnerId = onTeam1
        ? (m.team1_player1 === memberId ? m.team1_player2 : m.team1_player1)
        : (m.team2_player1 === memberId ? m.team2_player2 : m.team2_player1)
      if (!partnerId) continue
      const won   = onTeam1
        ? isWinner(m.team1_set1, m.team1_set2, m.team1_set3, m.team2_set1, m.team2_set2, m.team2_set3)
        : isWinner(m.team2_set1, m.team2_set2, m.team2_set3, m.team1_set1, m.team1_set2, m.team1_set3)
      const score = onTeam1
        ? matchScore(m.team1_set1, m.team1_set2, m.team1_set3, m.team2_set1, m.team2_set2, m.team2_set3)
        : matchScore(m.team2_set1, m.team2_set2, m.team2_set3, m.team1_set1, m.team1_set2, m.team1_set3)
      if (!rec[partnerId]) rec[partnerId] = { wins: 0, losses: 0, winScoreSum: 0, lossScoreSum: 0 }
      if (won) { rec[partnerId].wins++; rec[partnerId].winScoreSum += score }
      else     { rec[partnerId].losses++; rec[partnerId].lossScoreSum += score }
    }
    return rec
  }

  function vsOpponents(memberId, matches) {
    const rec = {}
    for (const m of matches) {
      const onTeam1 = m.team1_player1 === memberId || m.team1_player2 === memberId
      const onTeam2 = m.team2_player1 === memberId || m.team2_player2 === memberId
      if (!onTeam1 && !onTeam2) continue
      const won   = onTeam1
        ? isWinner(m.team1_set1, m.team1_set2, m.team1_set3, m.team2_set1, m.team2_set2, m.team2_set3)
        : isWinner(m.team2_set1, m.team2_set2, m.team2_set3, m.team1_set1, m.team1_set2, m.team1_set3)
      const score = onTeam1
        ? matchScore(m.team1_set1, m.team1_set2, m.team1_set3, m.team2_set1, m.team2_set2, m.team2_set3)
        : matchScore(m.team2_set1, m.team2_set2, m.team2_set3, m.team1_set1, m.team1_set2, m.team1_set3)
      const opps  = onTeam1 ? [m.team2_player1, m.team2_player2] : [m.team1_player1, m.team1_player2]
      for (const id of opps) {
        if (!id) continue
        if (!rec[id]) rec[id] = { wins: 0, losses: 0, winScoreSum: 0, lossScoreSum: 0 }
        if (won) { rec[id].wins++; rec[id].winScoreSum += score }
        else     { rec[id].losses++; rec[id].lossScoreSum += score }
      }
    }
    return rec
  }

  // ── Get match list for a specific pairing ─────────────────────────────
  function getPartnerMatches(memberId, partnerId) {
    return allMatches.filter(m => {
      const onTeam1 = m.team1_player1 === memberId || m.team1_player2 === memberId
      const onTeam2 = m.team2_player1 === memberId || m.team2_player2 === memberId
      if (!onTeam1 && !onTeam2) return false
      const pid = onTeam1
        ? (m.team1_player1 === memberId ? m.team1_player2 : m.team1_player1)
        : (m.team2_player1 === memberId ? m.team2_player2 : m.team2_player1)
      return pid === partnerId
    })
  }

  function getOpponentMatches(memberId, oppId) {
    return allMatches.filter(m => {
      const onTeam1 = m.team1_player1 === memberId || m.team1_player2 === memberId
      const onTeam2 = m.team2_player1 === memberId || m.team2_player2 === memberId
      if (!onTeam1 && !onTeam2) return false
      const opps = onTeam1 ? [m.team2_player1, m.team2_player2] : [m.team1_player1, m.team1_player2]
      return opps.includes(oppId)
    })
  }

  // ── Render match list inside modal ────────────────────────────────────
  function renderMatchList(matches, memberId) {
    if (matches.length === 0) return '<div class="mu-empty">No matches found.</div>'

    return matches.map(m => {
      const onTeam1 = m.team1_player1 === memberId || m.team1_player2 === memberId
      const won = onTeam1
        ? isWinner(m.team1_set1, m.team1_set2, m.team1_set3, m.team2_set1, m.team2_set2, m.team2_set3)
        : isWinner(m.team2_set1, m.team2_set2, m.team2_set3, m.team1_set1, m.team1_set2, m.team1_set3)

      const myTeam  = onTeam1 ? [m.team1_player1, m.team1_player2] : [m.team2_player1, m.team2_player2]
      const oppTeam = onTeam1 ? [m.team2_player1, m.team2_player2] : [m.team1_player1, m.team1_player2]

      const myNames  = myTeam.map(id  => memberMap[id] || '?').join(' &amp; ')
      const oppNames = oppTeam.map(id => memberMap[id] || '?').join(' &amp; ')

      const sets = []
      if (m.team1_set1 != null) {
        const s1 = onTeam1 ? [m.team1_set1, m.team2_set1] : [m.team2_set1, m.team1_set1]
        const s2 = onTeam1 ? [m.team1_set2, m.team2_set2] : [m.team2_set2, m.team1_set2]
        sets.push(`${s1[0]}–${s1[1]}`, `${s2[0]}–${s2[1]}`)
        if (m.team1_set3 != null) {
          const s3 = onTeam1 ? [m.team1_set3, m.team2_set3] : [m.team2_set3, m.team1_set3]
          sets.push(`${s3[0]}–${s3[1]}`)
        }
      }

      const date = m.played_on
        ? new Date(m.played_on + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        : ''

      return `
        <div class="mu-match-row">
          <div class="mu-result-badge ${won ? 'mu-win' : 'mu-loss'}">${won ? 'W' : 'L'}</div>
          <div class="mu-match-detail">
            <div class="mu-match-meta">${m.week_label || ''}${date ? ' &nbsp;·&nbsp; ' + date : ''}</div>
            <div class="mu-match-teams"><strong>${myNames}</strong> vs ${oppNames}</div>
            <div class="mu-match-sets">${sets.join(', ')}</div>
          </div>
        </div>`
    }).join('')
  }

  // ── Open modal ─────────────────────────────────────────────────────────
  function openMatchModal(title, subtitle, matches, memberId) {
    document.getElementById('mu-title').textContent    = title
    document.getElementById('mu-subtitle').textContent = subtitle
    document.getElementById('mu-body').innerHTML = renderMatchList(matches, memberId)
    overlay.classList.add('open')
  }

  // ── Build summary table ────────────────────────────────────────────────
  function buildRecordTable(rec, memberId, type) {
    const rows = Object.entries(rec)
      .filter(([id]) => memberMap[id])
      .map(([id, r]) => ({ id, name: memberMap[id], wins: r.wins, losses: r.losses, played: r.wins + r.losses, winScoreSum: r.winScoreSum, lossScoreSum: r.lossScoreSum }))
      .sort((a, b) => {
        const pctA = a.played > 0 ? a.wins / a.played : 0
        const pctB = b.played > 0 ? b.wins / b.played : 0
        return pctB - pctA || b.played - a.played
      })

    if (rows.length === 0) return '<p style="color:var(--gray-600);padding:0.5rem 0;">No data.</p>'

    let html = `<table class="standings-table">
      <thead><tr>
        <th>Player</th><th>W</th><th>L</th><th>Played</th><th>Win %</th><th>Avg (W)</th><th>Avg (L)</th>
      </tr></thead><tbody>`

    for (const r of rows) {
      const pct     = r.played > 0 ? Math.round(r.wins / r.played * 100) + '%' : '—'
      const avgWin  = r.wins   > 0 ? fmt(r.winScoreSum  / r.wins)   : '—'
      const avgLoss = r.losses > 0 ? fmt(r.lossScoreSum / r.losses) : '—'

      html += `<tr>
        <td class="player-name">
          <button class="mu-name-btn" data-pair-id="${r.id}" data-type="${type}" data-name="${r.name}">${r.name}</button>
        </td>
        <td>${r.wins}</td>
        <td>${r.losses}</td>
        <td>${r.played}</td>
        <td>${pct}</td>
        <td class="avg-score">${avgWin}</td>
        <td class="avg-score">${avgLoss}</td>
      </tr>`
    }

    html += '</tbody></table>'
    return html
  }

  // ── Show matchups for selected player ─────────────────────────────────
  function showMatchups(memberId) {
    const container    = document.getElementById('matchups-container')
    const playerName   = memberMap[memberId] || 'Player'
    const playerMatches = allMatches.filter(m =>
      m.team1_player1 === memberId || m.team1_player2 === memberId ||
      m.team2_player1 === memberId || m.team2_player2 === memberId
    )

    if (playerMatches.length === 0) {
      container.innerHTML = '<p style="color:var(--gray-600);text-align:center;padding:2rem;">No matches found.</p>'
      return
    }

    const partnerRec = withPartners(memberId, playerMatches)
    const oppRec     = vsOpponents(memberId, playerMatches)

    // Partners first, then opponents
    container.innerHTML = `
      <h2 class="section-title">With Partners</h2>
      <div class="card">${buildRecordTable(partnerRec, memberId, 'partner')}</div>
      <h2 class="section-title" style="margin-top:2rem;">vs. Opponents</h2>
      <div class="card">${buildRecordTable(oppRec, memberId, 'opponent')}</div>
    `

    // Wire up name click buttons
    container.querySelectorAll('.mu-name-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const pairId = btn.dataset.pairId
        const type   = btn.dataset.type
        const name   = btn.dataset.name

        if (type === 'partner') {
          const matches = getPartnerMatches(memberId, pairId)
          openMatchModal(
            `With ${name}`,
            `${playerName}'s matches partnered with ${name}`,
            matches, memberId
          )
        } else {
          const matches = getOpponentMatches(memberId, pairId)
          openMatchModal(
            `vs. ${name}`,
            `${playerName}'s matches against ${name}`,
            matches, memberId
          )
        }
      })
    })
  }

  init()
</script>
</body>
</html>
