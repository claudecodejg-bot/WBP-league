# =====================================================================
#  INSTALL THIS FILE AS .github/workflows/availability-reminders.yml
#
#  It is parked here because the token Claude pushes with is not allowed
#  to create workflow files. Copy it into place yourself, either through
#  GitHub (Add file -> Create new file, path
#  .github/workflows/availability-reminders.yml) or with:
#
#      git mv availability-reminders.workflow.yml \
#             .github/workflows/availability-reminders.yml
#      git commit -m "Add the availability reminder workflow" && git push
#
#  Needs two repository secrets first — Settings -> Secrets and variables
#  -> Actions -> New repository secret:
#      SUPABASE_SECRET_KEY   Supabase -> Project Settings -> API (secret)
#      RESEND_API_KEY        Resend -> API Keys
# =====================================================================

name: Availability reminders

# Hourly across Thursday and Friday rather than at four exact times.
# GitHub ran this up to 3h36m behind its cron time, which made precise
# scheduling useless. The script accepts any run inside its window
# (Thu 15:00-19:59 ET, Fri 09:00-11:59 ET) and the reminder_log table
# makes sure only the first one in each window actually sends.
on:
  schedule:
    - cron: '0 9-23 * * 4,5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send now regardless of the time: thursday or friday'
        required: false
        default: ''
      dry_run:
        description: 'Work out who would be chased, send nothing'
        type: boolean
        default: true

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send reminders
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REMINDER_FORCE: ${{ github.event.inputs.force }}
        run: |
          python3 scripts/send-availability-reminders.py \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
