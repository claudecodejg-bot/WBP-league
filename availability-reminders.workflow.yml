# =====================================================================
#  Availability reminders
#
#  PARKED COPY. The file GitHub actually runs is
#  .github/workflows/availability-reminders.yml — keep the two identical.
#  Claude's token has no `workflow` scope and cannot push that path, so
#  changes are made here and pasted into GitHub's web editor by hand.
#
#  ── Why the cron looks like this ───────────────────────────────────
#  GitHub's scheduler is best-effort: it drops scheduled runs under load
#  and delivers the survivors late. So the script does not trust the cron
#  time. It accepts ANY run landing inside a window (Wed 8:00am-7:59pm ET,
#  Fri 6:00am-1:59pm ET) and the first one in claims the slot in
#  `reminder_log` so the rest stand down.
#
#  The obvious response to a dropped run is to try more often. That was
#  the 17 Nov 2026 change, and it backfired. Measured over the two
#  Wednesdays that followed:
#
#    '9,29,49 12-16 * * 3'  3 attempts/hour, 15 total  ->  0 runs, twice
#    '23 17-23 * * 3'       1 attempt/hour,  7 total   ->  1 run, both weeks
#
#  Zero out of thirty for the dense block while the sparse block beside
#  it landed every week. Friday told the same story: '9,39 10-18 * * 5'
#  is 18 attempts and delivered exactly one run on 20 Nov, at 1:33pm.
#
#  The read is that GitHub throttles per-repo schedule density rather
#  than per-entry, so packing attempts together makes the whole block
#  likelier to be dropped, not likelier to land. Hence: ONE attempt an
#  hour, everywhere. It is a hypothesis drawn from two weeks of data, not
#  a documented rule -- if the morning still comes up empty after a few
#  Wednesdays, the density was not the cause and the next thing to try is
#  a different trigger entirely (an external pinger hitting
#  workflow_dispatch, which is not best-effort).
#
#  Still NOT on the hour: ':00' is the most contended minute on GitHub's
#  scheduler by a wide margin. Minute 23 is the one that has actually
#  been delivering here, so everything now sits on it.
#
#  Wednesday's window stays open until 7:59pm. If GitHub drops the
#  morning, an evening nudge still beats no nudge, and nothing in the
#  Wednesday copy names a time.
#
#  Friday opens at 6am so the last call is sitting there when people wake
#  up, and closes at 2pm, comfortably before pairings go out. It used to
#  close at noon because the copy named noon -- and on 20 Nov GitHub
#  delivered exactly one Friday run, at 1:33pm, so nothing was sent at
#  all. The copy now ties the cutoff to the pairings rather than a clock,
#  so the window can be eight hours wide instead of three.
#
#  ── UTC, and the DST handover ──────────────────────────────────────
#  GitHub cron is UTC and has no notion of a timezone, so each window is
#  covered across BOTH its EST and EDT positions and the script discards
#  the wrong local time. The season spans the changeover (EDT to 1 Nov,
#  EST to 14 Mar), so both halves are live in a single season.
#
#    Wed 8:00am-7:59pm ET = 12:00-23:59 UTC Wed   (EDT)
#                         = 13:00-00:59 UTC Wed/THU (EST)  <- crosses midnight
#    Fri 6:00am-1:59pm ET = 10:00-17:59 UTC Fri   (EDT)
#                         = 11:00-18:59 UTC Fri   (EST)
#
#  Hence the lone `* * 4` entry at hour 0: that is Wednesday EVENING in
#  New York, not Thursday. Runs outside a window cost a few seconds and
#  exit 0.
# =====================================================================

name: Availability reminders

on:
  schedule:
    # Wednesday nudge, one attempt an hour. 12:00-23:59 UTC Wed is
    # 8:23am-7:23pm ET on EDT and 7:23am-6:23pm ET on EST; the early EST
    # ones fall outside the window and exit without sending.
    - cron: '23 12-23 * * 3'
    # ...and the EST tail: Thu 00:23 UTC is Wed 7:23pm in New York
    - cron: '23 0 * * 4'
    # Friday last call, one attempt an hour. 10:00-18:59 UTC covers
    # 6am-1:59pm ET on both clocks.
    - cron: '23 10-18 * * 5'

  workflow_dispatch:
    inputs:
      force:
        description: 'Send now regardless of the time: wednesday or friday'
        required: false
        default: ''
      dry_run:
        description: 'Work out who would be chased, send nothing'
        type: boolean
        default: true

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send reminders
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REMINDER_FORCE: ${{ github.event.inputs.force }}
        run: |
          python3 scripts/send-availability-reminders.py \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
