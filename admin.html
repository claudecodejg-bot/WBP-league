<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Paddle Tennis League</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="wbp-logo.png">
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="preconnect" href="https://htmrvfkaudpevmzgteyh.supabase.co" crossorigin>
  <script src="js/nav.js" defer></script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WBP League">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="js/install.js" defer></script>
</head>
<body>

<nav>
  <div class="nav-brand"><img src="wbp-logo.png" alt="WBP" ><span>WBP</span> League</div>
  <ul class="nav-links">
    <li><a href="championship.html" data-page="championship">Championship</a></li>
    <li><a href="standings.html"    data-page="standings">Standings</a></li>
    <li><a href="results.html"      data-page="results">Results</a></li>
    <li><a href="availability.html" data-page="availability">Availability</a></li>
    <li><a href="photos.html"       data-page="photos">Photos</a></li>
    <li><a href="admin.html"        data-page="admin">Admin</a></li>
  </ul>
  <button id="nav-auth-btn">Sign In</button>
</nav>

<main>
  <h1 class="page-title">Admin Panel</h1>
  <p class="page-subtitle">Enter match results and review member availability.</p>

  <!-- Member availability overview -->
  <div class="card">
    <div class="card-title">Member Availability — Upcoming Weeks</div>
    <div id="admin-avail-container">
      <div class="loading-state"><div class="spinner"></div> Loading…</div>
    </div>
  </div>

  <!-- Enter new match result -->
  <div class="card">
    <div class="card-title">Enter Match Result</div>
    <div id="match-form-container">
      <div class="loading-state"><div class="spinner"></div> Loading…</div>
    </div>
  </div>

  <!-- Recent matches -->
  <div class="card">
    <div class="card-title">Recent Matches (last 10)</div>
    <div id="recent-matches-container">
      <div class="loading-state"><div class="spinner"></div> Loading…</div>
    </div>
  </div>

</main>

<footer>WBP League &copy; <span id="footer-year"></span></footer>

<script type="module">
  import { requireAdmin, initNav } from './js/auth.js'
  import { initAdmin } from './js/admin.js'

  async function init() {
    const member = await requireAdmin()
    if (!member) return  // redirected

    initNav('admin')
    initAdmin()
  }

  init()
</script>
</body>
</html>
