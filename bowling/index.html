<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Best Frame Bowling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: sticky nav, then one view at a time (standings / match scorecard with a keypad dock / team setup). */
:root {
  --paper: #f3f5fa;
  --card: #ffffff;
  --ink: #14213d;
  --muted: #5b6785;
  --line: #cfd7e8;
  --accent: #d62839;
  --accent-ink: #ffffff;
  --lane: #e9a72e;
  --won: rgba(233, 167, 46, .22);
  --key: #e7ebf4;
  --key-ink: #14213d;
  --good: #1f8a5b;
  --font-display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0c1322; --card: #151f35; --ink: #e8ecf6; --muted: #93a0bf; --line: #2b3858;
  --accent: #ff5468; --accent-ink: #1a0508; --lane: #f2c35b; --won: rgba(242, 195, 91, .18);
  --key: #22304f; --key-ink: #e8ecf6; --good: #4cc690; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0c1322; --card: #151f35; --ink: #e8ecf6; --muted: #93a0bf; --line: #2b3858;
  --accent: #ff5468; --accent-ink: #1a0508; --lane: #f2c35b; --won: rgba(242, 195, 91, .18);
  --key: #22304f; --key-ink: #e8ecf6; --good: #4cc690; color-scheme: dark }

* { box-sizing: border-box }
html { padding-top: env(safe-area-inset-top, 0px) }
body { margin: 0; background: var(--paper); color: var(--ink); font: 500 17px/1.4 var(--font-body); -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink) }
a { color: inherit }
button { font: inherit; color: inherit }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--lane); outline-offset: 2px }

.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); color: var(--paper);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.nav-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap }
.brand { font-family: var(--font-display); font-size: 22px; letter-spacing: .02em; text-decoration: none; display: flex; align-items: center; gap: 10px }
.brand .pin { width: 14px; height: 26px; border-radius: 7px 7px 5px 5px; background: var(--paper); position: relative }
.brand .pin::after { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 3px; background: var(--accent); box-shadow: 0 5px 0 var(--accent) }
.nav-links { display: flex; gap: 6px; margin-left: auto }
.nav-links a { text-decoration: none; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 16px; opacity: .8 }
.nav-links a.on { background: var(--paper); color: var(--ink); opacity: 1 }
@media (max-width: 480px) { .nav-in { flex-wrap: nowrap; gap: 8px } .brand { font-size: 18px; gap: 8px } .nav-links { gap: 2px } .nav-links a { padding: 6px 10px; font-size: 15px } }
@media (max-width: 400px) { .brand { font-size: 16px; white-space: nowrap } .brand .pin { display: none } .nav-links a { padding: 6px 8px; font-size: 14px } }
/* Stats: keep all columns on screen on a phone */
@media (max-width: 600px) {
  table.stand.stats { min-width: 0 }
  table.stand.stats td, table.stand.stats th { padding: 10px 4px }
  table.stand.stats td:first-child, table.stand.stats th:first-child, table.stand.stats td:last-child, table.stand.stats th:last-child { display: none }
  table.stand.stats td:nth-child(2), table.stand.stats th:nth-child(2) { padding-left: 12px }
  table.stand.stats th { font-size: 11px; letter-spacing: 0 }
  table.stand.stats td:nth-last-child(2), table.stand.stats th:nth-last-child(2) { padding-right: 12px }
  table.stand.stats td.num { font-size: 18px }
  table.stand.stats .tname { font-size: 15px }
  table.stand.stats .tplayers { font-size: 12px }
}

main { max-width: 1180px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.match-main { padding-bottom: 210px }
h1, h2 { text-wrap: balance; margin: 0 }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4vw, 38px); line-height: 1.1 }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700 }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 65ch }
.lede.past a { color: var(--accent); font-weight: 600 }
.note { margin: 12px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); color: var(--muted); font-size: 15px }
.note:empty { display: none }
.stack { display: flex; flex-direction: column; gap: 24px }

/* Standings */
.table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px }
table.frames { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums }
.frames th { text-align: right; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 8px; border-bottom: 1px solid var(--line); font-weight: 700 }
.frames td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--line); font-family: var(--font-num); font-size: 19px; font-weight: 600 }
.frames th.name, .frames td.name { text-align: left; font-family: var(--font-body) }
.frames td.name { font-size: 16px }
.frames td.name small { display: block; color: var(--muted); font-size: 12px; font-weight: 400 }
.frames tr.team td { font-weight: 800; border-top: 2px solid var(--line) }
.frames tr.team td.name { font-weight: 700 }
.frames tr.bowler td { color: var(--muted); font-weight: 500 }
.frames tr.bowler td.name { padding-left: 22px }
.frames tr:last-child td { border-bottom: 0 }
.frames tr.bowler td.cnt { color: var(--accent); font-weight: 700 }
.frames tr td.tot { color: var(--ink); font-weight: 800 }
.frames td.top { color: var(--accent) }
.frames .dash { color: var(--muted); font-weight: 400 }
@media (max-width: 600px) {
  .frames th { padding: 8px 3px; font-size: 11px; letter-spacing: 0 }
  .frames td { padding: 8px 3px; font-size: 16px }
  .frames th.name, .frames td.name { padding-left: 10px }
  .frames th:last-child, .frames td:last-child { padding-right: 10px }
  .frames td.name { font-size: 14px }
  .frames tr.bowler td.name { padding-left: 18px }
}
table.stand { width: 100%; border-collapse: collapse; min-width: 640px; font-variant-numeric: tabular-nums }
.stand th { text-align: left; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 700 }
.stand td { padding: 14px; border-bottom: 1px solid var(--line); vertical-align: middle }
.stand tr:last-child td { border-bottom: 0 }
.stand .num { text-align: right; font-family: var(--font-num); font-size: 24px; font-weight: 600 }
.stand th.num { font-family: var(--font-body); font-size: 13px }
.rank { font-family: var(--font-display); font-size: 22px; width: 44px; color: var(--muted) }
.stand tr.lead .rank { color: var(--accent) }
.tname { font-weight: 700; font-size: 19px }
.tplayers { color: var(--muted); font-size: 14px }
.rcell { display: flex; flex-direction: column; align-items: flex-end; gap: 2px }
.chip { font: 700 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted) }
.chip.w { background: var(--good); border-color: var(--good); color: var(--card) }
.chip.l { color: var(--muted) }
.chip.live { border-color: var(--accent); color: var(--accent); white-space: nowrap }
.rcell .vs { color: var(--muted); font-size: 12px; text-align: right }
.total { color: var(--accent) }
.dash { color: var(--muted); opacity: .6 }

.rounds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px }
@media (max-width: 820px) { .rounds { grid-template-columns: minmax(0, 1fr) } }
.round { display: flex; flex-direction: column; gap: 10px }
.mcard { display: block; text-decoration: none; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; transition: border-color .15s }
.mcard:hover { border-color: var(--accent) }
.mrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px }
.mrow + .mrow { margin-top: 4px }
.mrow .n { font-weight: 600; min-width: 0; overflow-wrap: anywhere }
.mrow .s { font-family: var(--font-num); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums }
.mrow.win .n, .mrow.win .s { color: var(--accent) }
.livef { color: var(--accent); font-weight: 700 }
.mfoot { margin-top: 8px; display: flex; justify-content: space-between; color: var(--muted); font-size: 14px }

/* Match view */
.mhead { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; justify-content: space-between }
.back { text-decoration: none; font-weight: 600; color: var(--muted) }
.versus { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; background: var(--ink); color: var(--paper); border-radius: 16px; padding: 16px 20px }
.versus .side { min-width: 0 }
.versus .side.b { text-align: right }
.versus .vn { font-weight: 700; font-size: 18px; overflow-wrap: anywhere }
.versus .vs { font-family: var(--font-display); font-size: clamp(40px, 7vw, 64px); line-height: 1; font-variant-numeric: tabular-nums }
.versus .side.lead .vs { color: var(--lane) }
.versus .mid { text-align: center; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; opacity: .75 }

.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
.sheet-h { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--line); gap: 10px }
.sheet-h .tn { font-weight: 700; font-size: 18px }
.sheet-h .tt { font-family: var(--font-num); font-weight: 700; font-size: 24px; color: var(--accent) }
.grid-wrap { overflow-x: auto }
table.card { border-collapse: collapse; width: 100%; min-width: 780px; table-layout: fixed; font-variant-numeric: tabular-nums }
.card th { font: 600 12px var(--font-body); color: var(--muted); padding: 6px 0; border-bottom: 1px solid var(--line); text-align: center }
.card th.who, .card td.who { width: 150px; text-align: left; padding-left: 14px }
.card th.tot, .card td.tot { width: 76px }
.card th.f10, .card td.f10 { width: 96px }
.card td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; text-align: center; height: 62px }
.card td:last-child { border-right: 0 }
.card tr.p { cursor: pointer }
.card tr.p.act td { background: color-mix(in srgb, var(--accent) 9%, transparent) }
.card tr.p.act td.who { box-shadow: inset 4px 0 0 var(--accent) }
.card td.who { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.card td.who small { display: block; font-weight: 500; font-size: 12px; color: var(--muted) }
.balls { display: flex; justify-content: flex-end; height: 28px }
.ball { width: 28px; height: 28px; display: grid; place-items: center; font: 700 18px var(--font-num); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line) }
.ball.x { color: var(--accent) }
.cum { font: 600 20px/32px var(--font-num) }
.card td.won { background: var(--won) }
.card tr.p.act td.won { background: var(--won) }
.card tr.best td { background: color-mix(in srgb, var(--ink) 5%, transparent); border-bottom: 0 }
.card tr.best td.who { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; color: var(--muted) }
.bv { font: 700 24px/1 var(--font-num); padding-top: 8px }
.bc { font: 600 13px/18px var(--font-num); color: var(--muted) }
.card td.tot .cum, .card tr.best td.tot .bv { font-size: 26px; color: var(--accent) }
/* Names stay pinned on the left while the frames scroll */
.card th.who, .card td.who { position: sticky; left: 0; z-index: 1; background: var(--card); box-shadow: 1px 0 0 var(--line), 6px 0 8px -6px rgba(0, 0, 0, .3) }
.card tr.p.act td.who { background: linear-gradient(color-mix(in srgb, var(--accent) 9%, transparent), color-mix(in srgb, var(--accent) 9%, transparent)), var(--card);
  box-shadow: inset 4px 0 0 var(--accent), 1px 0 0 var(--line), 6px 0 8px -6px rgba(0, 0, 0, .3) }
.card tr.best td.who { background: linear-gradient(color-mix(in srgb, var(--ink) 5%, transparent), color-mix(in srgb, var(--ink) 5%, transparent)), var(--card) }
@media (max-width: 600px) { .card th.who, .card td.who { width: 108px; padding-left: 10px } .card td.who { font-size: 15px } }
/* The box the next ball goes into */
.card td.cur { outline: 3px solid var(--accent); outline-offset: -3px }
.card td.fixing { outline-style: dashed; background: color-mix(in srgb, var(--lane) 25%, var(--card)) }
.card td.fixing .cum { font: 700 12px/32px var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--accent) }
.dock.fixing { border-top: 3px dashed var(--accent) }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 14px; align-items: center }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; background: var(--won); border: 1px solid var(--lane) }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line);
  box-shadow: 0 -8px 24px rgba(0,0,0,.08);
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.dock-in { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px }
.now { display: flex; gap: 8px 16px; align-items: baseline; flex-wrap: wrap; justify-content: space-between }
.now b { font-size: 20px }
.now span { color: var(--muted) }
.keys { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 8px }
@media (max-width: 760px) { .keys { grid-template-columns: repeat(7, minmax(0, 1fr)) } }
.key { height: 60px; border: 0; border-radius: 12px; background: var(--key); color: var(--key-ink); font: 700 26px var(--font-num); cursor: pointer; touch-action: manipulation }
.key:active:not(:disabled) { transform: translateY(1px); filter: brightness(.95) }
.key:disabled { opacity: .3; cursor: default }
.key.big { background: var(--accent); color: var(--accent-ink) }
.key.undo { font: 700 15px var(--font-body); background: transparent; border: 2px solid var(--line) }

.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.btn { border: 2px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 14px; font-weight: 600; cursor: pointer }
.btn.danger { border-color: var(--accent); color: var(--accent) }
.btn.solid { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }

/* Teams */
.teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
@media (max-width: 700px) { .teams { grid-template-columns: minmax(0, 1fr) } }
.tcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px }
.tcard label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700 }
.tcard input { width: 100%; font: 600 18px var(--font-body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink) }
.tcard .slot { font-family: var(--font-display); color: var(--accent); font-size: 18px }
.saved { color: var(--good); font-size: 14px; font-weight: 600 }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
</head>

<nav class="nav"><div class="nav-in">
  <a class="brand" href="#"><span class="pin" aria-hidden="true"></span>Best Frame</a>
  <div class="nav-links" id="navlinks">
    <a href="#" data-v="home">Standings</a>

    <a href="#teams" data-v="teams">Teams</a>

</div></nav>
<main id="app"></main>

<script>
// ---------- Saved results ----------
// A results page sets window.FROZEN to a copy of the final scores before this script runs.
// The page then shows them read-only: no keypad, no syncing, no editing.
const FROZEN = window.FROZEN || null;
const PAST = [{ date: "November 14, 2026", href: "results/2026-11-14.html" }];

// ---------- Tournament shape ----------
// 4 teams, round robin: each team bowls each other team once, across 3 rounds of 2 matches.
const SCHEDULE = [
  { id: 1, round: 1, a: 0, b: 1 }, { id: 2, round: 1, a: 2, b: 3 },
  { id: 3, round: 2, a: 0, b: 2 }, { id: 4, round: 2, a: 1, b: 3 },
  { id: 5, round: 3, a: 0, b: 3 }, { id: 6, round: 3, a: 1, b: 2 },
];
const ORDER = ["a0", "a1", "b0", "b1"]; // bowling order: both partners on one team, then the other team
// Round 2 flips each team's partners, so the second bowler from Rounds 1 and 3 leads off.
const flipped = id => SCHEDULE.find(s => s.id === id).round === 2;
const orderFor = id => flipped(id) ? ["a1", "a0", "b1", "b0"] : ORDER;
const DEFAULT_TEAMS = [["Grills", "Umbdenstock"], ["Schoenholtz", "Durkin"], ["Edgar", "Maechling"], ["McCarthy", "Walsh"]]
  .map(p => ({ name: p[0] + " / " + p[1], p }));
const emptyMatch = () => ({ rolls: { a0: [], a1: [], b0: [], b1: [] } });

let teams = JSON.parse(JSON.stringify(DEFAULT_TEAMS));
const matches = {}; SCHEDULE.forEach(m => matches[m.id] = emptyMatch());
const active = {};   // match id -> player key being entered
const history = {};  // match id -> stack of player keys, for Undo
const edits = {};    // match id -> { key, f, rolls } while a bowled frame is being re-entered
let confirmClear = null;
let statusNote = "Connecting to the scoreboard…";

// ---------- Bowling scoring ----------
// Short games: NF frames, and the last one plays like a normal 10th frame (up to 3 balls).
const NF = 6, LAST = NF - 1;
function parse(rolls) {
  const fr = []; let i = 0;
  for (let f = 0; f < NF; f++) {
    if (f < LAST) {
      if (rolls[i] === 10) { fr.push({ r: [10], s: i }); i += 1; }
      else { fr.push({ r: rolls.slice(i, i + 2), s: i }); i += 2; }
    } else fr.push({ r: rolls.slice(i, i + 3), s: i });
  }
  return fr;
}
function frameDone(f, r) {
  if (f < LAST) return r[0] === 10 || r.length === 2;
  return r.length === 3 || (r.length === 2 && r[0] + r[1] < 10);
}
function frameScore(rolls, fr, f) {
  const { r, s } = fr[f];
  if (f === LAST) return frameDone(LAST, r) ? r.reduce((a, b) => a + b, 0) : null;
  if (r[0] === 10) return rolls[s + 2] !== undefined ? 10 + rolls[s + 1] + rolls[s + 2] : null;
  if (r.length < 2) return null;
  if (r[0] + r[1] === 10) return rolls[s + 2] !== undefined ? 10 + rolls[s + 2] : null;
  return r[0] + r[1];
}
function game(rolls) {
  const fr = parse(rolls);
  const scores = fr.map((_, f) => frameScore(rolls, fr, f));
  let cum = [], run = 0, ok = true;
  scores.forEach(v => { if (v === null) ok = false; if (ok) { run += v; cum.push(run); } else cum.push(null); });
  return { fr, scores, cum, st: nextState(fr) };
}
// What the next ball can be: which frame, which ball, how many pins are standing.
function frameState(f, r) {
  if (frameDone(f, r)) return null;
  const b = r.length;
  if (b === 0) return { f, b, max: 10, fresh: true };
  if (f < LAST) return { f, b, max: 10 - r[0], fresh: false };
  if (b === 1) return r[0] === 10 ? { f, b, max: 10, fresh: true } : { f, b, max: 10 - r[0], fresh: false };
  if (r[0] === 10 && r[1] < 10) return { f, b, max: 10 - r[1], fresh: false };
  return { f, b, max: 10, fresh: true };
}
function nextState(fr) {
  for (let f = 0; f < NF; f++) { const st = frameState(f, fr[f].r); if (st) return st; }
  return { done: true, f: NF };
}
function marks(f, r) {
  const sym = v => v === 10 ? "X" : v === 0 ? "–" : String(v);
  if (f < LAST) {
    if (r[0] === 10) return ["", "X"];
    return [r[0] === undefined ? "" : sym(r[0]) === "X" ? "X" : (r[0] === 0 ? "–" : String(r[0])),
            r[1] === undefined ? "" : r[0] + r[1] === 10 ? "/" : (r[1] === 0 ? "–" : String(r[1]))];
  }
  const out = ["", "", ""];
  if (r[0] !== undefined) out[0] = sym(r[0]);
  if (r[1] !== undefined) out[1] = r[0] === 10 ? sym(r[1]) : (r[0] + r[1] === 10 ? "/" : sym(r[1]));
  if (r[2] !== undefined) {
    const freshThird = (r[0] === 10 && r[1] === 10) || (r[0] !== 10 && r[0] + r[1] === 10);

function markCount(rolls) {

    if (f < LAST) { if (r[0] === 10) x++; else if (r.length === 2 && r[0] + r[1] === 10) sp++; return; }
    let fresh = true, first = 0;
    (r[0] === 10 || r[0] + r[1] === 10 ? r : r.slice(0, 2)).forEach(v => {
      if (fresh) { if (v === 10) x++; else { fresh = false; first = v; } }

}

    [["a", x.a, res.A], ["b", x.b, res.B]].forEach(([side, ti, card]) => {

    <div><h2>Frame scores</h2>
      <p class="lede">Every frame of every round. The team row is its best-frame score for that frame; a red bowler score is the frame that counted for the team.</p></div>
    ${[1, 2, 3].map(n => `<div>${frameTable(n)}</div>`).join("")}
  </div>`;
}

function sheet(id, side, card, teamIdx) {
  const t = teams[teamIdx], act = active[id];
  const head = `<tr><th class="who">${esc(t.name)}</th>${[...Array(NF)].map((_, f) => `<th class="${f === LAST ? "f10" : ""}">${f + 1}</th>`).join("")}<th class="tot">Total</th></tr>`;
  const prow = pi => {
    const g = card.g[pi], key = side + pi;
    const last = g.cum.filter(v => v !== null).pop();
    return `<tr class="p ${act === key && !FROZEN ? "act" : ""}" data-pick="${key}">
      <td class="who">${esc(t.p[pi])}<small>${g.st.done ? "Game complete" : g.fr.some(x => x.r.length) ? "Frame " + (g.st.f + 1) : "Tap to bowl"}</small></td>
      ${g.fr.map((fr, f) => {
        const ed = edits[id], fixing = ed && ed.key === key && ed.f === f;
        const mk = marks(f, fixing ? ed.rolls : fr.r);
        const won = !fixing && card.best[f] && (card.best[f].who === pi || card.best[f].who === "both");
        const cur = !FROZEN && (fixing || (!ed && act === key && !g.st.done && f === g.st.f));
        return `<td class="${f === LAST ? "f10" : ""} ${won ? "won" : ""} ${cur ? "cur" : ""} ${fixing ? "fixing" : ""}" ${fr.r.length ? `data-f="${f}"` : ""}><div class="balls">${mk.map(v => `<span class="ball ${v === "X" ? "x" : ""}">${v}</span>`).join("")}</div>
          <div class="cum">${fixing ? "fix" : g.cum[f] ?? ""}</div></td>`;
      }).join("")}
      <td class="tot"><div class="cum">${g.st.done ? g.cum[LAST] : (last ?? "")}</div></td></tr>`;
  };
  const brow = `<tr class="best"><td class="who">Best frame</td>${card.best.map((b, f) => `<td class="${f === LAST ? "f10" : ""}">
      <div class="bv">${card.cum[f] ?? ""}</div><div class="bc">${b && b.v !== null ? b.v : ""}</div></td>`).join("")}
      <td class="tot"><div class="bv">${card.total}</div><div class="bc">${card.done ? "final" : ""}</div></td></tr>`;
  return `<section class="sheet"><div class="sheet-h"><span class="tn">${esc(t.name)}</span><span class="tt">${card.total}</span></div>
    <div class="grid-wrap"><table class="card"><thead>${head}</thead><tbody>${flipped(id) ? prow(1) + prow(0) : prow(0) + prow(1)}${brow}</tbody></table></div></section>`;
}
function pickNext(id) {
  const m = matches[id];
  const live = orderFor(id).map((k, i) => ({ k, i, st: game(m.rolls[k]).st })).filter(x => !x.st.done);
  if (!live.length) return active[id] || orderFor(id)[0]; // finished: keep the selection, or start at the leadoff bowler
  live.sort((x, y) => x.st.f - y.st.f || x.i - y.i);
  return live[0].k;
}
function playerName(id, key) { const x = SCHEDULE.find(s => s.id === id); const ti = key[0] === "a" ? x.a : x.b; return { p: teams[ti].p[+key[1]], t: teams[ti].name }; }
function matchView(id) {
  const x = SCHEDULE.find(s => s.id === id), res = matchResult(id);
  if (!active[id]) active[id] = pickNext(id);
  const ed = edits[id];
  if (ed) active[id] = ed.key;
  const key = active[id], st = ed ? frameState(ed.f, ed.rolls) : game(matches[id].rolls[key]).st, who = playerName(id, key);
  const lead = res.A.total === res.B.total ? "" : res.A.total > res.B.total ? "a" : "b";
  const status = res.final ? (res.winner === "tie" ? "Final · Tie" : "Final · " + esc(teams[res.winner === "a" ? x.a : x.b].name) + " win") : res.any ? "Live" : "Not started";
  const ball = st.done ? "" : (ed ? "Fixing frame " : "Frame ") + (st.f + 1) + ", ball " + (st.b + 1);
  const keys = [];
  for (let n = 0; n <= 9; n++) keys.push(`<button class="key" data-k="${n}" ${st.done || n > st.max || (n === st.max && !st.fresh) ? "disabled" : ""} aria-label="${n} pins">${n === 0 ? "–" : n}</button>`);
  keys.push(`<button class="key big" data-k="/" ${st.done || st.fresh ? "disabled" : ""} aria-label="Spare">/</button>`);
  keys.push(`<button class="key big" data-k="X" ${st.done || !st.fresh ? "disabled" : ""} aria-label="Strike">X</button>`);
  keys.push(ed
    ? `<button class="key undo" data-k="undo">${ed.rolls.length ? "Back" : "Cancel"}</button>`
    : `<button class="key undo" data-k="undo" ${ORDER.some(k => matches[id].rolls[k].length) ? "" : "disabled"}>Undo</button>`);
  return `<div class="stack">
    <div class="mhead"><a class="back" href="#">← Standings</a><h2>Round ${x.round} · Match ${id}</h2></div>
    <div class="versus">
      <div class="side a ${lead === "a" ? "lead" : ""}"><div class="vn">${esc(teams[x.a].name)}</div><div class="vs">${res.A.total}</div></div>
      <div class="mid">${status}</div>
      <div class="side b ${lead === "b" ? "lead" : ""}"><div class="vn">${esc(teams[x.b].name)}</div><div class="vs">${res.B.total}</div></div>
    </div>
    ${noteHtml()}
    ${sheet(id, "a", res.A, x.a)}
    ${sheet(id, "b", res.B, x.b)}
    ${FROZEN ? `<div class="tools"><span class="legend"><span><span class="sw"></span>Frame that counts for the team</span></span></div>` : `<div class="tools">
      <span class="legend"><span><span class="sw"></span>Frame that counts for the team</span><span>Tap a bowler's name to bowl for them. Tap a bowled frame to fix it.</span></span>
      <span style="margin-left:auto"></span>
      ${confirmClear === id
        ? `<span>Erase every ball in this match?</span><button class="btn danger" data-clear="yes">Erase match</button><button class="btn" data-clear="no">Keep</button>`
        : `<button class="btn" data-clear="ask" ${res.any ? "" : "disabled"}>Clear match…</button>`}
    </div>`}
  </div>
  ${FROZEN ? "" : `<div class="dock ${ed ? "fixing" : ""}"><div class="dock-in">
    <div class="now"><div><b>${esc(who.p)}</b> <span>${esc(who.t)}</span></div><span>${st.done ? "Game complete. Tap another bowler." : ball + " · " + st.max + " pins standing"}</span></div>
    <div class="keys">${keys.join("")}</div>
  </div></div>`}`;
}
function enter(id, k) {
  const m = matches[id], ed = edits[id];
  if (ed) {
    if (k === "undo") { if (ed.rolls.length) ed.rolls.pop(); else delete edits[id]; render(true); return; }
    const st = frameState(ed.f, ed.rolls);
    const v = k === "X" ? 10 : k === "/" ? st.max : +k;
    if (v > st.max || (k === "X" && !st.fresh) || (k === "/" && st.fresh)) return;
    ed.rolls.push(v);
    if (!frameDone(ed.f, ed.rolls)) { render(true); return; }
    // Swap in the corrected frame; every other frame keeps its own balls.
    const frames = parse(m.rolls[ed.key]).map(x => x.r);
    frames[ed.f] = ed.rolls;
    m.rolls[ed.key] = frames.flat();
    history[id] = [];
    delete edits[id];
    active[id] = pickNext(id);
    save("match/" + id, m); render(true);
    return;
  }
  if (k === "undo") {
    const hs = history[id] || [];
    let key = hs.pop();
    if (!key || !m.rolls[key].length) key = m.rolls[active[id]].length ? active[id] : ORDER.find(o => m.rolls[o].length);
    if (!key) return;
    m.rolls[key].pop(); active[id] = key;
  } else {
    const key = active[id], st = game(m.rolls[key]).st;
    if (st.done) return;
    const v = k === "X" ? 10 : k === "/" ? st.max : +k;
    if (v > st.max || (k === "X" && !st.fresh) || (k === "/" && st.fresh)) return;
    m.rolls[key].push(v);
    (history[id] = history[id] || []).push(key);
    const after = game(m.rolls[key]).st;
    if (after.done || after.f !== st.f) active[id] = pickNext(id);
  }
  save("match/" + id, m); render(true);
}

function teamsView() {
  return `<div class="stack">
    <div><h1>Teams</h1><p class="lede">Enter the four teams and their two bowlers. Changes save as you type and show up on every device that has this page open.</p>${noteHtml()}</div>
    <div class="teams">${teams.map((t, i) => `
      <div class="tcard"><span class="slot">Team ${i + 1}</span>
        <label for="tn${i}">Team name</label><input id="tn${i}" data-t="${i}" data-f="name" value="${esc(t.name)}" maxlength="40" autocomplete="off">
        <label for="tp${i}a">Bowler 1</label><input id="tp${i}a" data-t="${i}" data-f="0" value="${esc(t.p[0])}" maxlength="40" autocomplete="off">
        <label for="tp${i}b">Bowler 2</label><input id="tp${i}b" data-t="${i}" data-f="1" value="${esc(t.p[1])}" maxlength="40" autocomplete="off">
      </div>`).join("")}</div>
    <div><h2>Schedule</h2><p class="lede">${[1, 2, 3].map(n => `<b>Round ${n}:</b> ` + SCHEDULE.filter(x => x.round === n).map(x => `Team ${x.a + 1} vs Team ${x.b + 1}`).join(", ")).join("<br>")}</p></div>
  </div>`;
}

// ---------- Events ----------
document.addEventListener("click", e => {
  const r = route(); if (r.v !== "match" || FROZEN) return;
  const k = e.target.closest("[data-k]");
  if (k && !k.disabled) { enter(r.id, k.dataset.k); return; }
  const p = e.target.closest("[data-pick]");
  const cell = e.target.closest("td[data-f]");
  if (p && cell) {
    const f = +cell.dataset.f, cur = edits[r.id];
    if (!(cur && cur.key === p.dataset.pick && cur.f === f)) edits[r.id] = { key: p.dataset.pick, f, rolls: [] };
    render(true); return;
  }
  if (p) { delete edits[r.id]; active[r.id] = p.dataset.pick; render(true); return; }
  const c = e.target.closest("[data-clear]");
  if (c) {
    if (c.dataset.clear === "ask") confirmClear = r.id;
    else if (c.dataset.clear === "no") confirmClear = null;
    else { confirmClear = null; matches[r.id] = emptyMatch(); history[r.id] = []; active[r.id] = "a0"; save("match/" + r.id, matches[r.id]); }
    render();
  }
});
document.addEventListener("input", e => {
  const el = e.target.closest("[data-t]"); if (!el) return;
  const t = teams[+el.dataset.t];
  if (el.dataset.f === "name") t.name = el.value; else t.p[+el.dataset.f] = el.value;
  save("teams", { teams });
});
document.addEventListener("keydown", e => {
  const r = route(); if (r.v !== "match" || FROZEN || e.target.closest("input")) return;
  const k = /^[0-9]$/.test(e.key) ? e.key : e.key === "/" ? "/" : e.key.toLowerCase() === "x" ? "X" : e.key === "Backspace" ? "undo" : null;
  if (!k) return;
  const b = document.querySelector(`[data-k="${k}"]`);
  if (b && !b.disabled) { e.preventDefault(); enter(r.id, k); }
});
window.addEventListener("hashchange", () => { confirmClear = null; Object.keys(edits).forEach(k => delete edits[k]); window.scrollTo(0, 0); render(true); });

render();
connect();
</script>
</body>
</html>
