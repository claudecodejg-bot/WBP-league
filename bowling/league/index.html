<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Best Frame League Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: sticky nav, then one view at a time (standings / match scorecard with a keypad dock / team setup). */
:root {
  --paper: #f3f5fa;
  --card: #ffffff;
  --ink: #14213d;
  --muted: #5b6785;
  --line: #cfd7e8;
  --accent: #d62839;
  --accent-ink: #ffffff;
  --lane: #e9a72e;
  --won: rgba(233, 167, 46, .22);
  --key: #e7ebf4;
  --key-ink: #14213d;
  --good: #1f8a5b;
  --font-display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0c1322; --card: #151f35; --ink: #e8ecf6; --muted: #93a0bf; --line: #2b3858;
  --accent: #ff5468; --accent-ink: #1a0508; --lane: #f2c35b; --won: rgba(242, 195, 91, .18);
  --key: #22304f; --key-ink: #e8ecf6; --good: #4cc690; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0c1322; --card: #151f35; --ink: #e8ecf6; --muted: #93a0bf; --line: #2b3858;
  --accent: #ff5468; --accent-ink: #1a0508; --lane: #f2c35b; --won: rgba(242, 195, 91, .18);
  --key: #22304f; --key-ink: #e8ecf6; --good: #4cc690; color-scheme: dark }

* { box-sizing: border-box }
html { padding-top: env(safe-area-inset-top, 0px) }
body { margin: 0; background: var(--paper); color: var(--ink); font: 500 17px/1.4 var(--font-body); -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink) }
a { color: inherit }
button { font: inherit; color: inherit }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--lane); outline-offset: 2px }

.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); color: var(--paper);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.nav-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap }
.brand { font-family: var(--font-display); font-size: 22px; letter-spacing: .02em; text-decoration: none; display: flex; align-items: center; gap: 10px }
.brand .pin { width: 14px; height: 26px; border-radius: 7px 7px 5px 5px; background: var(--paper); position: relative }
.brand .pin::after { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 3px; background: var(--accent); box-shadow: 0 5px 0 var(--accent) }
.nav-links { display: flex; gap: 6px; margin-left: auto }
.nav-links a { text-decoration: none; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 16px; opacity: .8 }
.nav-links a.on { background: var(--paper); color: var(--ink); opacity: 1 }
@media (max-width: 480px) { .nav-in { flex-wrap: nowrap; gap: 8px } .brand { font-size: 18px; gap: 8px } .nav-links { gap: 2px } .nav-links a { padding: 6px 10px; font-size: 15px } }
@media (max-width: 400px) { .brand { font-size: 16px; white-space: nowrap } .brand .pin { display: none } .nav-links a { padding: 6px 8px; font-size: 14px } }
/* Stats: keep all columns on screen on a phone */
@media (max-width: 600px) {
  table.stand.stats { min-width: 0 }
  table.stand.stats td, table.stand.stats th { padding: 10px 4px }
  table.stand.stats td:first-child, table.stand.stats th:first-child, table.stand.stats td:last-child, table.stand.stats th:last-child { display: none }
  table.stand.stats td:nth-child(2), table.stand.stats th:nth-child(2) { padding-left: 12px }
  table.stand.stats th { font-size: 11px; letter-spacing: 0 }
  table.stand.stats td:nth-last-child(2), table.stand.stats th:nth-last-child(2) { padding-right: 12px }
  table.stand.stats td.num { font-size: 18px }
  table.stand.stats .tname { font-size: 15px }
  table.stand.stats .tplayers { font-size: 12px }
}

main { max-width: 1180px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.match-main { padding-bottom: 210px }
h1, h2 { text-wrap: balance; margin: 0 }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4vw, 38px); line-height: 1.1 }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700 }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 65ch }
.lede.past a { color: var(--accent); font-weight: 600 }
.note { margin: 12px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); color: var(--muted); font-size: 15px }
.note:empty { display: none }
.stack { display: flex; flex-direction: column; gap: 24px }

/* Standings */
.table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px }
table.frames { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums }
.frames th { text-align: right; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 8px; border-bottom: 1px solid var(--line); font-weight: 700 }
.frames td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--line); font-family: var(--font-num); font-size: 19px; font-weight: 600 }
.frames th.name, .frames td.name { text-align: left; font-family: var(--font-body) }
.frames td.name { font-size: 16px }
.frames td.name small { display: block; color: var(--muted); font-size: 12px; font-weight: 400 }
.frames tr.team td { font-weight: 800; border-top: 2px solid var(--line) }
.frames tr.team td.name { font-weight: 700 }
.frames tr.bowler td { color: var(--muted); font-weight: 500 }
.frames tr.bowler td.name { padding-left: 22px }
.frames tr:last-child td { border-bottom: 0 }
.frames tr.bowler td.cnt { color: var(--accent); font-weight: 700 }
.frames tr td.tot { color: var(--ink); font-weight: 800 }
.frames td.top { color: var(--accent) }
.frames .dash { color: var(--muted); font-weight: 400 }
@media (max-width: 600px) {
  .frames th { padding: 8px 3px; font-size: 11px; letter-spacing: 0 }
  .frames td { padding: 8px 3px; font-size: 16px }
  .frames th.name, .frames td.name { padding-left: 10px }
  .frames th:last-child, .frames td:last-child { padding-right: 10px }
  .frames td.name { font-size: 14px }
  .frames tr.bowler td.name { padding-left: 18px }
}
table.stand { width: 100%; border-collapse: collapse; min-width: 640px; font-variant-numeric: tabular-nums }
.stand th { text-align: left; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 700 }
.stand td { padding: 14px; border-bottom: 1px solid var(--line); vertical-align: middle }
.stand tr:last-child td { border-bottom: 0 }
.stand .num { text-align: right; font-family: var(--font-num); font-size: 24px; font-weight: 600 }
.stand th.num { font-family: var(--font-body); font-size: 13px }
.rank { font-family: var(--font-display); font-size: 22px; width: 44px; color: var(--muted) }
.stand tr.lead .rank { color: var(--accent) }
.tname { font-weight: 700; font-size: 19px }
.tplayers { color: var(--muted); font-size: 14px }
.rcell { display: flex; flex-direction: column; align-items: flex-end; gap: 2px }
.chip { font: 700 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted) }
.chip.w { background: var(--good); border-color: var(--good); color: var(--card) }
.chip.l { color: var(--muted) }
.chip.live { border-color: var(--accent); color: var(--accent); white-space: nowrap }
.rcell .vs { color: var(--muted); font-size: 12px; text-align: right }
.total { color: var(--accent) }
.dash { color: var(--muted); opacity: .6 }

.rounds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px }
@media (max-width: 820px) { .rounds { grid-template-columns: minmax(0, 1fr) } }
.round { display: flex; flex-direction: column; gap: 10px }
.mcard { display: block; text-decoration: none; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; transition: border-color .15s }
.mcard:hover { border-color: var(--accent) }
.mrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px }
.mrow + .mrow { margin-top: 4px }
.mrow .n { font-weight: 600; min-width: 0; overflow-wrap: anywhere }
.mrow .s { font-family: var(--font-num); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums }
.mrow.win .n, .mrow.win .s { color: var(--accent) }
.livef { color: var(--accent); font-weight: 700 }
.mfoot { margin-top: 8px; display: flex; justify-content: space-between; color: var(--muted); font-size: 14px }

/* Match view */
.mhead { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; justify-content: space-between }
.back { text-decoration: none; font-weight: 600; color: var(--muted) }
.versus { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; background: var(--ink); color: var(--paper); border-radius: 16px; padding: 16px 20px }
.versus .side { min-width: 0 }
.versus .side.b { text-align: right }
.versus .vn { font-weight: 700; font-size: 18px; overflow-wrap: anywhere }
.versus .vs { font-family: var(--font-display); font-size: clamp(40px, 7vw, 64px); line-height: 1; font-variant-numeric: tabular-nums }
.versus .side.lead .vs { color: var(--lane) }
.versus .mid { text-align: center; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; opacity: .75 }

.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
.sheet-h { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--line); gap: 10px }
.sheet-h .tn { font-weight: 700; font-size: 18px }
.sheet-h .tt { font-family: var(--font-num); font-weight: 700; font-size: 24px; color: var(--accent) }
.grid-wrap { overflow-x: auto }
table.card { border-collapse: collapse; width: 100%; min-width: 780px; table-layout: fixed; font-variant-numeric: tabular-nums }
.card th { font: 600 12px var(--font-body); color: var(--muted); padding: 6px 0; border-bottom: 1px solid var(--line); text-align: center }
.card th.who, .card td.who { width: 150px; text-align: left; padding-left: 14px }
.card th.tot, .card td.tot { width: 76px }
.card th.f10, .card td.f10 { width: 96px }
.card td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; text-align: center; height: 62px }
.card td:last-child { border-right: 0 }
.card tr.p { cursor: pointer }
.card tr.p.act td { background: color-mix(in srgb, var(--accent) 9%, transparent) }
.card tr.p.act td.who { box-shadow: inset 4px 0 0 var(--accent) }
.card td.who { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.card td.who small { display: block; font-weight: 500; font-size: 12px; color: var(--muted) }
.balls { display: flex; justify-content: flex-end; height: 28px }
.ball { width: 28px; height: 28px; display: grid; place-items: center; font: 700 18px var(--font-num); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line) }
.ball.x { color: var(--accent) }
.cum { font: 600 20px/32px var(--font-num) }
.card td.won { background: var(--won) }
.card tr.p.act td.won { background: var(--won) }
.card tr.best td { background: color-mix(in srgb, var(--ink) 5%, transparent); border-bottom: 0 }
.card tr.best td.who { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; color: var(--muted) }
.bv { font: 700 24px/1 var(--font-num); padding-top: 8px }
.bc { font: 600 13px/18px var(--font-num); color: var(--muted) }
.card td.tot .cum, .card tr.best td.tot .bv { font-size: 26px; color: var(--accent) }
/* Names stay pinned on the left while the frames scroll */
.card th.who, .card td.who { position: sticky; left: 0; z-index: 1; background: var(--card); box-shadow: 1px 0 0 var(--line), 6px 0 8px -6px rgba(0, 0, 0, .3) }
.card tr.p.act td.who { background: linear-gradient(color-mix(in srgb, var(--accent) 9%, transparent), color-mix(in srgb, var(--accent) 9%, transparent)), var(--card);
  box-shadow: inset 4px 0 0 var(--accent), 1px 0 0 var(--line), 6px 0 8px -6px rgba(0, 0, 0, .3) }
.card tr.best td.who { background: linear-gradient(color-mix(in srgb, var(--ink) 5%, transparent), color-mix(in srgb, var(--ink) 5%, transparent)), var(--card) }
@media (max-width: 600px) { .card th.who, .card td.who { width: 108px; padding-left: 10px } .card td.who { font-size: 15px } }
/* The box the next ball goes into */
.card td.cur { outline: 3px solid var(--accent); outline-offset: -3px }
.card td.fixing { outline-style: dashed; background: color-mix(in srgb, var(--lane) 25%, var(--card)) }
.card td.fixing .cum { font: 700 12px/32px var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--accent) }
.dock.fixing { border-top: 3px dashed var(--accent) }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 14px; align-items: center }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; background: var(--won); border: 1px solid var(--lane) }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line);
  box-shadow: 0 -8px 24px rgba(0,0,0,.08);
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.dock-in { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px }
.now { display: flex; gap: 8px 16px; align-items: baseline; flex-wrap: wrap; justify-content: space-between }
.now b { font-size: 20px }
.now span { color: var(--muted) }
.keys { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 8px }
@media (max-width: 760px) { .keys { grid-template-columns: repeat(7, minmax(0, 1fr)) } }
.key { height: 60px; border: 0; border-radius: 12px; background: var(--key); color: var(--key-ink); font: 700 26px var(--font-num); cursor: pointer; touch-action: manipulation }
.key:active:not(:disabled) { transform: translateY(1px); filter: brightness(.95) }
.key:disabled { opacity: .3; cursor: default }
.key.big { background: var(--accent); color: var(--accent-ink) }
.key.undo { font: 700 15px var(--font-body); background: transparent; border: 2px solid var(--line) }

.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.btn { border: 2px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 14px; font-weight: 600; cursor: pointer }
.btn.danger { border-color: var(--accent); color: var(--accent) }
.btn.solid { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }

/* Teams */
.teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
@media (max-width: 700px) { .teams { grid-template-columns: minmax(0, 1fr) } }
.tcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px }
.tcard label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700 }
.tcard input { width: 100%; font: 600 18px var(--font-body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink) }
.tcard .slot { font-family: var(--font-display); color: var(--accent); font-size: 18px }
.saved { color: var(--good); font-size: 14px; font-weight: 600 }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

/* ---- League night additions ---- */
.match-main { padding-bottom: 330px }
.rounds { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)) }
.flights { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px }
.flights h2, .tgroup h2 { margin-bottom: 8px }
table.stand.fl { min-width: 0 }
.stand.fl .chip { display: inline-block; margin-top: 4px; text-decoration: none }
@media (max-width: 600px) { .stand.fl td, .stand.fl th { padding: 10px 8px } .stand.fl .rank { width: 30px; font-size: 18px } .stand.fl .tname { font-size: 16px } .stand.fl td.num { font-size: 20px } }
.tag { font: 700 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px }
.sit { margin: 0; color: var(--muted); font-size: 14px }
.champ { background: var(--ink); color: var(--paper); border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 2px }
.champ span { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; opacity: .75 }
.champ b { font-family: var(--font-display); font-weight: 400; font-size: clamp(24px, 5vw, 34px); color: var(--lane); line-height: 1.15 }
.btn { text-decoration: none; display: inline-block; touch-action: manipulation }
.btn:disabled { opacity: .4; cursor: default }
.btn.big { padding: 12px 20px; font-size: 18px }
/* Score entry */
.dock-in { gap: 8px }
.chips { display: grid; grid-template-rows: repeat(2, auto); grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px }
@media (min-width: 760px) { .chips { grid-template-rows: auto } }
.who-chip { text-align: left; border: 2px solid var(--line); background: transparent; border-radius: 12px; padding: 5px 10px; display: flex; flex-direction: column; min-width: 0; cursor: pointer; touch-action: manipulation }
.who-chip b { font-size: 16px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.who-chip span { font: 600 14px/1.2 var(--font-num); color: var(--muted); letter-spacing: .02em }
.who-chip.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent) }
.who-chip.on span { color: var(--accent) }
.who-chip.done:not(.on) { opacity: .55 }
.pad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) minmax(0, 1.5fr); gap: 6px }
.pad .key { height: 54px }
.pad .key.big { grid-column: 6; grid-row: 1 / span 2; height: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 38px; line-height: 1 }
.pad .key.big small { font: 700 12px/1 var(--font-body); text-transform: uppercase; letter-spacing: .08em }
.dock-row { display: flex; gap: 8px; align-items: center; min-height: 40px }
.dock-row .hint { margin-left: auto; color: var(--muted); font-size: 14px; text-align: right; line-height: 1.2 }
.dock-row .hint b { color: var(--ink) }
.dock-row .say { font-size: 16px }
.dock .btn { padding: 7px 12px; white-space: nowrap }
.card td.pick { outline: 2px dashed var(--accent); outline-offset: -4px; cursor: pointer; background: color-mix(in srgb, var(--lane) 18%, var(--card)) }
/* Setup */
.setup-grid { display: flex; flex-wrap: wrap; gap: 16px 28px }
.field { display: flex; flex-direction: column; gap: 6px }
.field > span { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700 }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden }
.seg button { border: 0; background: transparent; padding: 9px 0; min-width: 42px; font: 700 19px var(--font-num); cursor: pointer; touch-action: manipulation }
.seg button + button { border-left: 1px solid var(--line) }
.seg button.on { background: var(--ink); color: var(--paper) }
input.txt { width: 100%; min-width: 0; border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 9px 10px; font: 600 17px var(--font-body) }
input.txt[type=date] { width: auto }
.tgroup { display: flex; flex-direction: column; gap: 8px }
.trow { display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1fr) auto; gap: 6px; align-items: center }
.trow .no { font-family: var(--font-display); color: var(--muted); font-size: 16px; text-align: center }
.mv { display: flex; gap: 4px }
.mv button { width: 34px; height: 42px; border: 2px solid var(--line); border-radius: 8px; background: transparent; cursor: pointer; font-size: 12px; padding: 0; touch-action: manipulation }
.mv button:disabled { opacity: .3 }
@media (max-width: 600px) { .versus { padding: 10px 14px; border-radius: 14px } .versus .vs { font-size: 34px } .versus .vn { font-size: 15px } .match-main .stack { gap: 14px } }
/* History */
.hlist { display: flex; flex-direction: column; gap: 10px }
.hrow { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px }
.hmain { flex: 1; min-width: 0; text-decoration: none }
.hask { display: flex; gap: 6px }
@media (max-width: 480px) { .nav-links a { padding: 6px 8px; font-size: 14px } .brand { font-size: 16px; white-space: nowrap } .brand .pin { display: none } }
@media (max-width: 380px) { .brand { font-size: 14px } .nav-links a { padding: 6px 6px; font-size: 13px } }

<script>
// Best Frame league night: up to 8 two-bowler teams, set up on the night.
//   6-8 teams: two flights, everyone plays their flight once, then flight winners play the
//              championship and the other places play consolation matches.
//   2-5 teams: one flight, everyone plays everyone once.
// Every night is kept in the shared table, so History can show old nights.

// ---------- Storage keys ----------
const SB = "https://htmrvfkaudpevmzgteyh.supabase.co/rest/v1/bowling_league";
const SB_KEY = "sb_publishable_9MZLbcTj078P71YXuvO4SA_qW4tF0KF";
const SB_HEAD = { apikey: SB_KEY, "Content-Type": "application/json" };
const LS = "best-frame-league-v1", LSD = "best-frame-league-draft-v1";

// ---------- State ----------
let index = { current: null };  // which night is "tonight"
let cfg = null;                 // the night on screen: { date, frames, teams, flights, finals }
let SCHED = [];                 // its matches, built from cfg
let NF = 6, LAST = 5;           // frames per game for that night
let loaded = null;              // id of the night on screen
let matches = {};               // match id -> { rolls: { a0, a1, b0, b1 } }
let synced = false;
const active = {};   // match id -> bowler key being entered
const undo = {};     // match id -> stack of bowler keys, for Undo
const edits = {};    // match id -> { key, f, rolls } while a bowled frame is being re-entered
const fixPick = {};  // match id -> true while choosing which frame to fix
let confirmAsk = null;
let statusNote = "Connecting to the scoreboard…";
let draft = null, allNights = null;

const ORDER = ["a0", "a1", "b0", "b1"];
const emptyMatch = () => ({ rolls: { a0: [], a1: [], b0: [], b1: [] } });
const clone = v => JSON.parse(JSON.stringify(v));
const M = id => matches[id] || (matches[id] = emptyMatch());
const sx = id => SCHED.find(s => s.id === id);
// Even rounds flip each team's partners, so the second bowler from the odd rounds leads off.
const flipped = id => { const x = sx(id); return !x.final && x.round % 2 === 0; };
const orderFor = id => flipped(id) ? ["a1", "a0", "b1", "b0"] : ORDER;

// ---------- Night shape ----------
function flightSizes(n) { return n >= 6 ? [Math.ceil(n / 2), Math.floor(n / 2)] : [n]; }
// Everyone plays everyone once. With an odd number, one team sits out each round.
function roundRobin(ids) {
  const t = ids.slice(); if (t.length % 2) t.push(null);
  const n = t.length, rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const ms = [];
    for (let i = 0; i < n / 2; i++) { const a = t[i], b = t[n - 1 - i]; if (a !== null && b !== null) ms.push([a, b]); }
    rounds.push(ms);
    t.splice(1, 0, t.pop());
  }
  return rounds;
}
function buildSchedule(c) {
  const out = [];
  c.flights.forEach((fl, fi) => {
    let n = 0;
    roundRobin(fl).forEach((ms, r) => ms.forEach(([a, b]) => out.push({ id: "AB"[fi] + (++n), flight: fi, round: r + 1, a, b })));
  });
  (c.finals || []).forEach(f => out.push({ id: f.id, final: true, label: f.label, round: 0, a: f.a, b: f.b }));
  return out;
}
function setCfg(c) { cfg = c; NF = c ? c.frames : 6; LAST = NF - 1; SCHED = c ? buildSchedule(c) : []; }
const roundCount = () => Math.max(0, ...SCHED.filter(x => !x.final).map(x => x.round));
function teamName(p, i) { const a = (p[0] || "").trim(), b = (p[1] || "").trim(); return a && b ? a + " / " + b : a || b || "Team " + (i + 1); }
function cleanCfg(d) {
  if (!d || !Array.isArray(d.teams) || d.teams.length < 2 || d.teams.length > 8) return null;
  const s = (v, f) => typeof v === "string" && v.trim() ? v.slice(0, 40) : f;
  const teams = d.teams.map((t, i) => {
    const p = [s(t && t.p && t.p[0], "Bowler 1"), s(t && t.p && t.p[1], "Bowler 2")];
    return { name: s(t && t.name, "Team " + (i + 1)), p };
  });
  const n = teams.length; let k = 0;
  const flights = flightSizes(n).map(z => [...Array(z)].map(() => k++));
  const ok = v => Number.isInteger(v) && v >= 0 && v < n;
  const finals = Array.isArray(d.finals) ? d.finals.filter(f => f && /^F[1-4]$/.test(f.id) && ok(f.a) && ok(f.b)).map(f => ({ id: f.id, label: s(f.label, "Final"), a: f.a, b: f.b })) : [];
  return { date: /^\d{4}-\d{2}-\d{2}$/.test(d.date) ? d.date : "", frames: [6, 8, 10].includes(d.frames) ? d.frames : 6, teams, flights, finals: finals.length ? finals : null };
}
const cleanRolls = a => Array.isArray(a) ? a.filter(v => Number.isInteger(v) && v >= 0 && v <= 10).slice(0, 21) : [];
function cleanMatch(d) { const r = (d && d.rolls) || {}; return { rolls: { a0: cleanRolls(r.a0), a1: cleanRolls(r.a1), b0: cleanRolls(r.b0), b1: cleanRolls(r.b1) } }; }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fmtDate(s, short) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); if (!m) return s || "League night";
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString("en-US", short ? { month: "short", day: "numeric", year: "numeric" } : { weekday: "long", month: "long", day: "numeric", year: "numeric" });
}

// ---------- Bowling scoring ----------
// NF frames per game; the last one plays like a normal 10th frame (up to 3 balls).
function parse(rolls) {
  const fr = []; let i = 0;
  for (let f = 0; f < NF; f++) {
    if (f < LAST) {
      if (rolls[i] === 10) { fr.push({ r: [10], s: i }); i += 1; }
      else { fr.push({ r: rolls.slice(i, i + 2), s: i }); i += 2; }
    } else fr.push({ r: rolls.slice(i, i + 3), s: i });
  }
  return fr;
}
function frameDone(f, r) {
  if (f < LAST) return r[0] === 10 || r.length === 2;
  return r.length === 3 || (r.length === 2 && r[0] + r[1] < 10);
}
function frameScore(rolls, fr, f) {
  const { r, s } = fr[f];
  if (f === LAST) return frameDone(LAST, r) ? r.reduce((a, b) => a + b, 0) : null;
  if (r[0] === 10) return rolls[s + 2] !== undefined ? 10 + rolls[s + 1] + rolls[s + 2] : null;
  if (r.length < 2) return null;
  if (r[0] + r[1] === 10) return rolls[s + 2] !== undefined ? 10 + rolls[s + 2] : null;
  return r[0] + r[1];
}
function game(rolls) {
  const fr = parse(rolls);
  const scores = fr.map((_, f) => frameScore(rolls, fr, f));
  let cum = [], run = 0, ok = true;
  scores.forEach(v => { if (v === null) ok = false; if (ok) { run += v; cum.push(run); } else cum.push(null); });
  return { fr, scores, cum, st: nextState(fr) };
}
// What the next ball can be: which frame, which ball, how many pins are standing.
function frameState(f, r) {
  if (frameDone(f, r)) return null;
  const b = r.length;
  if (b === 0) return { f, b, max: 10, fresh: true };
  if (f < LAST) return { f, b, max: 10 - r[0], fresh: false };
  if (b === 1) return r[0] === 10 ? { f, b, max: 10, fresh: true } : { f, b, max: 10 - r[0], fresh: false };
  if (r[0] === 10 && r[1] < 10) return { f, b, max: 10 - r[1], fresh: false };
  return { f, b, max: 10, fresh: true };
}
function nextState(fr) {
  for (let f = 0; f < NF; f++) { const st = frameState(f, fr[f].r); if (st) return st; }
  return { done: true, f: NF };
}
function marks(f, r) {
  const sym = v => v === 10 ? "X" : v === 0 ? "–" : String(v);
  if (f < LAST) {
    if (r[0] === 10) return ["", "X"];
    return [r[0] === undefined ? "" : sym(r[0]), r[1] === undefined ? "" : r[0] + r[1] === 10 ? "/" : sym(r[1])];
  }
  const out = ["", "", ""];
  if (r[0] !== undefined) out[0] = sym(r[0]);
  if (r[1] !== undefined) out[1] = r[0] === 10 ? sym(r[1]) : (r[0] + r[1] === 10 ? "/" : sym(r[1]));
  if (r[2] !== undefined) {
    const freshThird = (r[0] === 10 && r[1] === 10) || (r[0] !== 10 && r[0] + r[1] === 10);
    out[2] = freshThird ? sym(r[2]) : (r[1] + r[2] === 10 ? "/" : sym(r[2]));
  }
  return out;
}
// Best-frame team score: once both partners have finished a frame, the better of the two frames
// becomes the team's frame. A team strike or spare then takes the best bonus either partner
// produced with their own next balls (the next ball for a spare, the next two for a strike),
// so the frame waits until both partners have bowled those balls.
function frameRank(f, r) {
  if (f === LAST) return [r.reduce((a, b) => a + b, 0), r[0], r[1] || 0];
  if (r[0] === 10) return [3, 10, 0];
  if (r[0] + r[1] === 10) return [2, r[0], 0];
  return [1, r[0] + r[1], r[0]];
}
function cmpRank(x, y) { for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; }
function teamCard(m, side) {
  const rr = [m.rolls[side + "0"], m.rolls[side + "1"]];
  const g = rr.map(game);
  const best = [], cum = []; let run = 0, ok = true;
  for (let f = 0; f < NF; f++) {
    const fr0 = g[0].fr[f], fr1 = g[1].fr[f];
    if (!frameDone(f, fr0.r) || !frameDone(f, fr1.r)) { best.push(null); cum.push(null); ok = false; continue; }
    const c = cmpRank(frameRank(f, fr0.r), frameRank(f, fr1.r));
    const r = c >= 0 ? fr0.r : fr1.r, who = c === 0 ? "both" : c > 0 ? 0 : 1;
    const need = f === LAST ? 0 : r[0] === 10 ? 2 : r[0] + r[1] === 10 ? 1 : 0;
    let v = r.reduce((a, b) => a + b, 0);
    if (need) {
      const bonus = [0, 1].map(p => {
        const fr = g[p].fr[f], e = fr.s + fr.r.length, next = rr[p].slice(e, e + need);
        return next.length === need ? next[0] + (next[1] || 0) : null;
      });
      v = bonus.includes(null) ? null : 10 + Math.max(...bonus);
    }
    best.push({ v, who });
    if (v === null) ok = false;
    if (ok) { run += v; cum.push(run); } else cum.push(null);
  }
  return { g, best, cum, total: run, done: g[0].st.done && g[1].st.done };
}
function matchResult(id) {
  const m = M(id);
  const A = teamCard(m, "a"), B = teamCard(m, "b");
  const any = ORDER.some(k => m.rolls[k].length);
  const final = A.done && B.done;
  // The frame the match is on: the lowest frame any bowler still has to finish.
  const left = [...A.g, ...B.g].filter(g => !g.st.done).map(g => g.st.f + 1);
  const frame = left.length ? Math.min(...left) : NF;
  return { A, B, any, final, frame, winner: final ? (A.total > B.total ? "a" : B.total > A.total ? "b" : "tie") : null };
}

// ---------- Standings, finals, champion ----------
function standings(fi) {
  const rows = cfg.flights[fi].map(i => ({ i, t: cfg.teams[i], total: 0, w: 0, l: 0, tie: 0, live: null }));
  SCHED.filter(x => !x.final && x.flight === fi).forEach(x => {
    const res = matchResult(x.id);
    if (!res.any) return;
    [["a", x.a, res.A], ["b", x.b, res.B]].forEach(([side, ti, card]) => {
      const row = rows.find(r => r.i === ti);
      row.total += card.total;
      if (!res.final) row.live = { id: x.id, frame: res.frame };
      else if (res.winner === "tie") row.tie++; else if (res.winner === side) row.w++; else row.l++;
    });
  });
  return rows.sort((a, b) => b.w - a.w || a.l - b.l || b.total - a.total || a.i - b.i);
}
const flightsDone = () => SCHED.some(x => !x.final) && SCHED.filter(x => !x.final).every(x => matchResult(x.id).final);
const PLACE = ["Championship", "Consolation · 2nd place teams", "Consolation · 3rd place teams", "Consolation · 4th place teams"];
function makeFinals() {
  const A = standings(0), B = standings(1), out = [];
  for (let k = 0; k < Math.min(A.length, B.length); k++) out.push({ id: "F" + (k + 1), label: PLACE[k], a: A[k].i, b: B[k].i });
  return out;
}
function champion() {
  if (!cfg) return null;
  if (cfg.flights.length === 1) return flightsDone() ? standings(0)[0].t.name : null;
  const f = sx("F1"); if (!f) return null;
  const r = matchResult("F1");
  return r.final && r.winner !== "tie" ? cfg.teams[r.winner === "a" ? f.a : f.b].name : null;
}

// ---------- Storage: a shared Supabase table, with this device as a backup ----------
const pendingData = {}, timers = {}, writing = {};
let lastRev = "", online = null, pollTimer = null, pollSeq = 0;
function loadLocal() {
  try {
    const s = JSON.parse(localStorage.getItem(LS) || "null");
    if (s && s.index && s.loaded && s.loaded === s.index.current) {
      const c = cleanCfg(s.cfg);
      if (c) { index = { current: s.loaded }; loaded = s.loaded; setCfg(c); SCHED.forEach(x => { if (s.matches && s.matches[x.id]) matches[x.id] = cleanMatch(s.matches[x.id]); }); }
    }
  } catch (e) {}
}
function saveLocal() { if (loaded && loaded === index.current) try { localStorage.setItem(LS, JSON.stringify({ index, loaded, cfg, matches })); } catch (e) {} }
function save(night, key, data) {
  saveLocal();
  const p = night + "|" + key;
  pendingData[p] = clone(data);
  clearTimeout(timers[p]);
  timers[p] = setTimeout(() => { delete timers[p]; flush(p); }, 250);
}
async function flush(p) {
  if (writing[p] || !pendingData[p]) return;
  const data = pendingData[p]; delete pendingData[p];
  const [night, key] = p.split("|");
  writing[p] = true;
  let ok = false;
  try {
    const r = await fetch(SB + "?on_conflict=night,key", { method: "POST", headers: { ...SB_HEAD, Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify({ night, key, data, updated_at: new Date().toISOString() }) });
    ok = r.ok || r.status === 400;
  } catch (e) {}
  writing[p] = false;
  if (!ok) { if (!pendingData[p]) pendingData[p] = data; setOnline(false); setTimeout(() => flush(p), 3000); return; }
  setOnline(true);
  if (pendingData[p] && !timers[p]) flush(p);
}
const busy = p => !!(pendingData[p] || writing[p] || timers[p]);
function setNote(t) { statusNote = t; const n = document.getElementById("note"); if (n) n.textContent = t; }
function setOnline(v) {
  if (v === online) return;
  online = v;
  setNote(v ? "" : "No connection to the scoreboard. Scores are kept on this device and will send when the connection is back.");
}
const editing = () => !!(document.activeElement && document.activeElement.closest && document.activeElement.closest("[data-t],[data-d]"));
function resetUi() { [active, undo, edits, fixPick].forEach(o => Object.keys(o).forEach(k => delete o[k])); confirmAsk = null; }
const wanted = () => route().night || index.current;
function apply(rows, want) {
  const rev = want + "#" + rows.map(x => x.night + x.key + x.updated_at).sort().join("|");
  const first = !synced; synced = true;
  if (rev === lastRev && !first) return;
  lastRev = rev;
  let changed = first;
  const ix = rows.find(x => x.night === "index");
  if (!busy("index|index")) {
    const cur = ix && ix.data && typeof ix.data.current === "string" ? ix.data.current : null;
    if (cur !== index.current) { index = { current: cur }; changed = true; }
  }
  if (want !== loaded) { loaded = want; setCfg(null); matches = {}; resetUi(); changed = true; }
  if (want) {
    const c = rows.find(x => x.night === want && x.key === "config");
    if (!busy(want + "|config") && !editing()) {
      const nc = cleanCfg(c && c.data);
      if (JSON.stringify(nc) !== JSON.stringify(cfg)) { setCfg(nc); changed = true; }
    }
    SCHED.forEach(x => {
      if (busy(want + "|" + x.id)) return;
      const row = rows.find(y => y.night === want && y.key === x.id);
      const m = cleanMatch(row && row.data);
      if (JSON.stringify(m) !== JSON.stringify(M(x.id))) { matches[x.id] = m; changed = true; }
    });
  }
  if (changed) { saveLocal(); if (!editing()) { render(firstFocus); firstFocus = false; } }
}
async function poll() {
  clearTimeout(pollTimer);
  const seq = ++pollSeq, want = wanted();
  try {
    const r = await fetch(SB + "?" + (want ? "night=in.(index," + want + ")" : "night=eq.index") + "&select=night,key,data,updated_at", { cache: "no-store", headers: SB_HEAD });
    if (!r.ok) throw new Error(r.status);
    const rows = await r.json();
    if (seq !== pollSeq) return;
    setOnline(true);
    apply(rows, want);
  } catch (e) { if (seq !== pollSeq) return; setOnline(false); }
  pollTimer = setTimeout(poll, wanted() !== want ? 0 : document.hidden ? 10000 : 2000);
}
let firstFocus = true;
function connect() {
  if ("scrollRestoration" in window.history) window.history.scrollRestoration = "manual";
  if (!route().night) loadLocal();
  render(true); poll();
}

// ---------- Views ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function route() {
  let h = location.hash.replace(/^#/, ""), night = null;
  const p = /^past\/([a-z0-9-]{1,24})\/?(.*)$/.exec(h);
  if (p) { night = p[1]; h = p[2]; }
  const m = /^m\/([AB]\d{1,2}|F[1-4])$/.exec(h);
  if (m) return { night, v: "match", id: m[1] };
  if (!night && ["teams", "setup", "history"].includes(h)) return { night, v: h };
  if (h === "stats") return { night, v: "stats" };
  return { night, v: "home" };
}
const link = rest => "#" + (route().night ? "past/" + route().night + "/" : "") + rest;
const noteHtml = () => `<p class="note" id="note">${esc(statusNote)}</p>`;
function render(focus) {
  const r = route(), ro = !!r.night;
  const nav = ro
    ? [["home", link(""), "Results"], ["stats", link("stats"), "Stats"], ["history", "#history", "History"], ["x", "#", "Tonight"]]
    : [["home", "#", "Tonight"], ["stats", "#stats", "Stats"], ["teams", "#teams", "Teams"], ["history", "#history", "History"]];
  document.getElementById("navlinks").innerHTML = nav.map(([v, href, label]) => `<a href="${href}" class="${v === r.v || (v === "home" && r.v === "match") || (v === "teams" && r.v === "setup") ? "on" : ""}">${label}</a>`).join("");
  const prev = [...document.querySelectorAll(".grid-wrap")].map(w => w.scrollLeft);
  const app = document.getElementById("app");
  const isMatch = r.v === "match" && cfg && loaded === (r.night || index.current) && sx(r.id);
  app.className = isMatch && !ro ? "match-main" : "";
  if (wanted() !== loaded && !["setup", "history"].includes(r.v)) app.innerHTML = `<div class="stack"><div><h1>League night</h1><p class="lede">Loading…</p>${noteHtml()}</div></div>`;
  else if (isMatch) {
    app.innerHTML = matchView(r.id, ro);
    document.querySelectorAll(".grid-wrap").forEach((w, i) => { w.scrollLeft = prev[i] || 0; });
    if (focus) focusCurrent();
  }
  else if (r.v === "setup") app.innerHTML = setupView();
  else if (r.v === "history") app.innerHTML = historyView();
  else if (r.v === "teams") app.innerHTML = teamsView();
  else if (r.v === "stats") app.innerHTML = statsView(ro);
  else app.innerHTML = homeView(ro);
}
// Bring the box the next ball goes into to the middle of what's visible: sideways within
// the scorecard (right of the pinned names) and up/down between the top bar and the keypad.
function focusCurrent() {
  const cell = document.querySelector("td.cur");
  if (!cell) return;
  const behavior = matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
  const wrap = cell.closest(".grid-wrap"), who = wrap.querySelector("td.who").offsetWidth;
  const left = cell.offsetLeft + cell.offsetWidth / 2 - (who + (wrap.clientWidth - who) / 2);
  wrap.scrollTo({ left: Math.max(0, left), behavior });
  const row = cell.closest("tr").getBoundingClientRect();
  const top = document.querySelector(".nav").getBoundingClientRect().bottom + 8;
  const dock = document.querySelector(".dock");
  const bottom = (dock ? dock.getBoundingClientRect().top : innerHeight) - 8;
  if (row.top < top || row.bottom > bottom) window.scrollTo({ top: Math.max(0, scrollY + (row.top + row.bottom) / 2 - (top + bottom) / 2), behavior });
}

function formatLine(n) {
  const z = flightSizes(n);
  if (z.length === 1) return n === 2 ? "One match between the two teams." : `One flight of ${n}. Everyone plays everyone once${n % 2 ? ", with one team sitting out each round" : ""}. The best record wins the night.`;
  const extra = n === 8 ? "the other places play consolation matches" : n === 7 ? "the 2nd and 3rd place teams play consolation matches, and the last team in the flight of 4 sits out" : "the 2nd and 3rd place teams play consolation matches";
  return `Flights of ${z[0]} and ${z[1]}. Each team plays the others in its flight once, then the two flight winners play for the championship and ${extra}.`;
}
function matchCard(x) {
  const res = matchResult(x.id), T = cfg.teams;
  const st = res.final ? "Final" : res.any ? `<b class="livef">Live · Frame ${res.frame}</b>` : "Not started";
  const tag = x.final ? x.label : cfg.flights.length > 1 ? "Flight " + "AB"[x.flight] : "";
  return `<a class="mcard" href="${link("m/" + x.id)}">
    ${tag ? `<div class="tag">${esc(tag)}</div>` : ""}
    <div class="mrow ${res.winner === "a" ? "win" : ""}"><span class="n">${esc(T[x.a].name)}</span><span class="s">${res.any ? res.A.total : "–"}</span></div>
    <div class="mrow ${res.winner === "b" ? "win" : ""}"><span class="n">${esc(T[x.b].name)}</span><span class="s">${res.any ? res.B.total : "–"}</span></div>
    <div class="mfoot"><span>${st}</span><span>${res.any ? "Open" : "Start"} →</span></div></a>`;
}

// ---------- Stats ----------
// Strikes and spares one bowler made in a game. In the last frame every fresh rack counts,
// so X X X there is three strikes and 7 / X is a spare and a strike.
function markCount(rolls) {
  let x = 0, sp = 0;
  game(rolls).fr.forEach((fr, f) => {
    const r = fr.r;
    if (f < LAST) { if (r[0] === 10) x++; else if (r.length === 2 && r[0] + r[1] === 10) sp++; return; }
    let fresh = true, first = 0;
    (r[0] === 10 || r[0] + r[1] === 10 ? r : r.slice(0, 2)).forEach(v => {
      if (fresh) { if (v === 10) x++; else { fresh = false; first = v; } }
      else { if (first + v === 10) sp++; fresh = true; }
    });
  });
  return { x, sp };
}
function stats() {
  const R = roundCount(), cols = R + (SCHED.some(x => x.final) ? 1 : 0);
  const T = cfg.teams.map((t, i) => ({ i, name: t.name, sub: "", x: 0, sp: 0, pts: 0, games: 0, r: Array(cols).fill(null) }));
  const P = [];
  cfg.teams.forEach((t, i) => t.p.forEach((name, pi) => P.push({ ti: i, pi, name, sub: t.name, x: 0, sp: 0, pts: 0, games: 0, r: Array(cols).fill(null) })));
  SCHED.forEach(x => {
    const res = matchResult(x.id);
    if (!res.any) return;
    const col = x.final ? R : x.round - 1;
    [["a", x.a, res.A], ["b", x.b, res.B]].forEach(([side, ti, card]) => {
      T[ti].pts += card.total; T[ti].games++; T[ti].r[col] = card.total;
      [0, 1].forEach(pi => {
        const rolls = M(x.id).rolls[side + pi], mk = markCount(rolls), p = P.find(q => q.ti === ti && q.pi === pi);
        p.x += mk.x; p.sp += mk.sp; T[ti].x += mk.x; T[ti].sp += mk.sp;
        if (!rolls.length) return;
        const v = card.g[pi].cum.filter(c => c !== null).pop() ?? 0;
        p.pts += v; p.games++; p.r[col] = v;
      });
    });
  });
  T.forEach(t => { t.sub = t.games + " game" + (t.games === 1 ? "" : "s"); });
  const heads = [...Array(R)].map((_, k) => "Rd " + (k + 1)).concat(cols > R ? ["Final"] : []);
  return { T: T.sort((a, b) => b.pts - a.pts || a.i - b.i), P: P.sort((a, b) => b.pts - a.pts || b.x - a.x), heads };
}
function statsView(ro) {
  if (!cfg) return homeView(ro);
  const { T, P, heads } = stats();
  const avg = (n, g) => g ? Math.round(n / g) : "–";
  const hi = (rows, f) => Math.max(0, ...rows.map(f));
  const cell = (v, top, cls) => `<td class="${cls || ""} ${top && v > 0 ? "top" : ""}">${v === null ? `<span class="dash">—</span>` : v}</td>`;
  const totals = (rows, label) => {
    const tx = hi(rows, r => r.x), ts = hi(rows, r => r.sp), tp = hi(rows, r => r.pts);
    return `<div class="table-wrap"><table class="frames">
      <thead><tr><th class="name">${label}</th><th>Strikes</th><th>Spares</th><th>Points</th><th>Avg</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td class="name">${esc(r.name)}<small>${esc(r.sub)}</small></td>${cell(r.x, r.x === tx)}${cell(r.sp, r.sp === ts)}${cell(r.pts, r.pts === tp, "tot")}<td>${avg(r.pts, r.games)}</td></tr>`).join("")}</tbody></table></div>`;
  };
  const byRound = (rows, label) => {
    const tops = heads.map((_, k) => hi(rows, r => r.r[k] ?? 0)), tt = hi(rows, r => r.pts);
    return `<div class="table-wrap"><table class="frames">
      <thead><tr><th class="name">${label}</th>${heads.map(h => `<th>${h}</th>`).join("")}<th>Total</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td class="name">${esc(r.name)}<small>${esc(r.sub)}</small></td>${r.r.map((v, k) => cell(v, v === tops[k])).join("")}${cell(r.pts, r.pts === tt, "tot")}</tr>`).join("")}</tbody></table></div>`;
  };
  const groups = [...Array(roundCount())].map((_, k) => ["Round " + (k + 1), SCHED.filter(x => !x.final && x.round === k + 1)]);
  if (SCHED.some(x => x.final)) groups.push(["Finals", SCHED.filter(x => x.final)]);

    <div><h1>Stats</h1>
      <p class="lede"><b>${esc(fmtDate(cfg.date))}</b>. Strikes and spares are every mark each bowler threw, and a team's are its two bowlers' added together. Team points are best-frame totals; bowler points are their own game scores. The leader in each column is in red.</p>
      ${ro ? "" : noteHtml()}</div>
    <div><h2>Teams</h2>${totals(T, "Team")}</div>
    <div><h2>Bowlers</h2>${totals(P, "Bowler")}</div>
    <div><h2>Round by round</h2>${byRound(T, "Team")}</div>

    <div><h2>Frame scores</h2>
      <p class="lede">The team row is its best-frame score for each frame; a red bowler score is the frame that counted for the team.</p></div>
    ${groups.map(([title, ms]) => `<div>${frameTable(title, ms)}</div>`).join("")}

function frameTable(title, ms) {

  const body = ms.map(x => {
    const res = matchResult(x.id);
    return [["a", x.a, res.A], ["b", x.b, res.B]].map(([side, ti, card]) => {

      const sub = (x.final ? esc(x.label) + " · " : "") + (res.final ? (res.winner === side ? "Won" : res.winner === "tie" ? "Tie" : "Lost") + " vs " + opp : res.any ? "Live · Frame " + res.frame : "Not started");
      const team = `<tr class="team"><td class="name">${esc(t.name)}<small>${sub}</small></td>
        ${card.best.map(b => `<td>${v(b && b.v)}</td>`).join("")}<td class="tot">${res.any ? card.total : v(null)}</td></tr>`;
      const bowlers = [0, 1].map(pi => {
        const g = card.g[pi], last = g.cum.filter(c => c !== null).pop();

          ${g.scores.map((s, f) => { const b = card.best[f]; const cnt = b && b.v !== null && (b.who === pi || b.who === "both"); return `<td class="${cnt ? "cnt" : ""}">${v(s)}</td>`; }).join("")}
          <td class="tot">${last ?? v(null)}</td></tr>`;

    }).join("");
  }).join("");
  return `<div class="table-wrap"><table class="frames" style="min-width:${NF > 6 ? 300 + NF * 34 : 0}px"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

// ---------- Match scorecard and entry ----------

  const head = `<tr><th class="who">${esc(t.name)}</th>${[...Array(NF)].map((_, f) => `<th class="${f === LAST ? "f10" : ""}">${f + 1}</th>`).join("")}<th class="tot">Total</th></tr>`;
  const prow = pi => {
    const g = card.g[pi], key = side + pi;
    const last = g.cum.filter(v => v !== null).pop();
    return `<tr class="p ${act === key && !ro ? "act" : ""}" data-pick="${key}">
      <td class="who">${esc(t.p[pi])}<small>${g.st.done ? "Game complete" : g.fr.some(x => x.r.length) ? "Frame " + (g.st.f + 1) : ro ? "" : "Tap to bowl"}</small></td>
      ${g.fr.map((fr, f) => {
        const fixing = ed && ed.key === key && ed.f === f;
        const mk = marks(f, fixing ? ed.rolls : fr.r);

          <div class="cum">${fixing ? "fix" : g.cum[f] ?? ""}</div></td>`;
      }).join("")}
      <td class="tot"><div class="cum">${g.st.done ? g.cum[LAST] : (last ?? "")}</div></td></tr>`;

      <td class="tot"><div class="bv">${card.total}</div><div class="bc">${card.done ? "final" : ""}</div></td></tr>`;
  return `<section class="sheet"><div class="sheet-h"><span class="tn">${esc(t.name)}</span><span class="tt">${card.total}</span></div>
    <div class="grid-wrap"><table class="card" style="min-width:${230 + NF * 92}px"><thead>${head}</thead><tbody>${flipped(id) ? prow(1) + prow(0) : prow(0) + prow(1)}${brow}</tbody></table></div></section>`;
}
// Who is up next: the bowler furthest behind. Among those, someone part-way through a frame
// (already on the lane) comes first, then the bowling order.
function pickNext(id) {
  const m = M(id), ord = orderFor(id);
  const live = ord.map((k, i) => { const g = game(m.rolls[k]); return { k, i, f: g.st.f, done: g.st.done, mid: !g.st.done && g.fr[g.st.f].r.length > 0 }; }).filter(x => !x.done);
  if (!live.length) return active[id] || ord[0];
  live.sort((x, y) => x.f - y.f || y.mid - x.mid || x.i - y.i);
  return live[0].k;
}
function bowler(id, key) { const x = sx(id), t = cfg.teams[key[0] === "a" ? x.a : x.b]; return { p: t.p[+key[1]], t: t.name }; }
const ORD = ["1st", "2nd", "3rd"];

  return `<div class="dock ${ed ? "fixing" : ""}"><div class="dock-in">
    ${ed ? `<div class="dock-row"><b class="say">Fixing ${esc(who.p)} · frame ${ed.f + 1}</b><span class="hint">Enter the whole frame again</span></div>` : chips}
    <div class="pad">${big}${nums}</div>
    <div class="dock-row">
      ${ed ? `<button class="btn" data-k="undo">${ed.rolls.length ? "← Back" : "Cancel"}</button>`
           : `<button class="btn" data-k="undo" ${ORDER.some(k => m.rolls[k].length) ? "" : "disabled"}>↶ Undo</button>
              <button class="btn" data-act="fix" ${ORDER.some(k => m.rolls[k].length) ? "" : "disabled"}>Fix a frame</button>`}

function enter(id, k) {
  const m = M(id), ed = edits[id], night = loaded;
  if (ed) {
    if (k === "undo") { if (ed.rolls.length) ed.rolls.pop(); else delete edits[id]; render(true); return; }
    const st = frameState(ed.f, ed.rolls);
    const v = k === "X" ? 10 : k === "/" ? st.max : +k;
    if (v > st.max || (k === "X" && !st.fresh) || (k === "/" && st.fresh)) return;
    ed.rolls.push(v);
    if (!frameDone(ed.f, ed.rolls)) { render(true); return; }
    // Swap in the corrected frame; every other frame keeps its own balls.
    const frames = parse(m.rolls[ed.key]).map(x => x.r);
    frames[ed.f] = ed.rolls;
    m.rolls[ed.key] = frames.flat();
    undo[id] = [];
    delete edits[id];
    active[id] = pickNext(id);
    save(night, id, m); render(true);
    return;
  }
  if (k === "undo") {
    const hs = undo[id] || [];
    let key = hs.pop();
    if (!key || !m.rolls[key].length) key = m.rolls[active[id]].length ? active[id] : ORDER.find(o => m.rolls[o].length);
    if (!key) return;
    m.rolls[key].pop(); active[id] = key;
  } else {
    const key = active[id], st = game(m.rolls[key]).st;
    if (st.done) return;
    const v = k === "X" ? 10 : k === "/" ? st.max : +k;
    if (v > st.max || (k === "X" && !st.fresh) || (k === "/" && st.fresh)) return;
    m.rolls[key].push(v);
    (undo[id] = undo[id] || []).push(key);
    const after = game(m.rolls[key]).st;
    // Stay with this bowler until their frame is finished, then move to whoever is up.
    if (after.done || after.f !== st.f) active[id] = pickNext(id);
  }
  save(night, id, m); render(true);
}

// ---------- Setting up a night ----------
function getDraft() {
  if (!draft) { try { draft = JSON.parse(localStorage.getItem(LSD) || "null"); } catch (e) {} }
  if (!draft || !draft.touched || !Array.isArray(draft.teams)) {
    // Teams change every week, so the names start empty; the size and frames carry over.
    draft = { touched: false, date: today(), frames: cfg ? cfg.frames : 6, n: cfg ? cfg.teams.length : 8, teams: [] };
  }
  while (draft.teams.length < 8) draft.teams.push({ p: ["", ""] });
  return draft;
}

        <input class="txt" data-d="${i},0" value="${esc(t.p[0])}" placeholder="Bowler 1" list="names" maxlength="40" autocomplete="off" autocapitalize="words" aria-label="Team ${i + 1} bowler 1">
        <input class="txt" data-d="${i},1" value="${esc(t.p[1])}" placeholder="Bowler 2" list="names" maxlength="40" autocomplete="off" autocapitalize="words" aria-label="Team ${i + 1} bowler 2">
        <span class="mv"><button data-mv="${i},-1" ${i === 0 ? "disabled" : ""} aria-label="Move team ${i + 1} up">▲</button><button data-mv="${i},1" ${i === d.n - 1 ? "disabled" : ""} aria-label="Move team ${i + 1} down">▼</button></span></div>`;
    }).join("");
    return `<div class="tgroup"><h2>${sizes.length > 1 ? "Flight " + "AB"[fi] : "Teams"}</h2>${rows}</div>`;
  }).join("");
  const live = cfg && index.current && loaded === index.current && !champion();
  return `<div class="stack">
    <div><h1>Set up a league night</h1><p class="lede">Pick how many teams are here, type in tonight's pairs, and start. The page builds the flights and the schedule. Names from earlier nights come up as you type.</p>${noteHtml()}</div>
    <datalist id="names">${rosterHtml()}</datalist>
    <div class="setup-grid">
      <label class="field"><span>Date</span><input class="txt" type="date" data-d="date" value="${esc(d.date)}"></label>
      <div class="field"><span>Teams</span>${seg("n", [2, 3, 4, 5, 6, 7, 8], d.n)}</div>
      <div class="field"><span>Frames per game</span>${seg("frames", [6, 8, 10], d.frames)}</div>
    </div>
    <p class="lede" style="margin:0">${formatLine(d.n)}</p>
    <div class="tools"><button class="btn" data-act="shuffle">Shuffle the teams</button><span class="legend">${sizes.length > 1 ? "Use the arrows to move a team up or down, or between flights." : "Use the arrows to change the order."}</span></div>
    <div class="flights">${groups}</div>
    ${live ? `<p class="note">The night of ${esc(fmtDate(cfg.date))} is still in progress. Starting a new night keeps it in History, but Tonight will show the new one.</p>` : ""}
    <div class="tools"><button class="btn solid big" data-act="start">Start league night</button><a class="btn" href="#">Cancel</a></div>
  </div>`;
}
async function startNight() {
  const d = getDraft();
  const date = /^\d{4}-\d{2}-\d{2}$/.test(d.date) ? d.date : today();
  const c = cleanCfg({ date, frames: d.frames, teams: d.teams.slice(0, d.n).map((t, i) => ({ name: teamName(t.p, i), p: t.p })) });
  let taken = [];
  try { const r = await fetch(SB + "?key=eq.config&select=night", { cache: "no-store", headers: SB_HEAD }); if (r.ok) taken = (await r.json()).map(x => x.night); } catch (e) {}
  let id = date, k = 1;
  while (taken.includes(id) || id === loaded) id = date + "-" + (++k);
  pollSeq++;
  index = { current: id }; loaded = id; setCfg(c); matches = {}; resetUi(); synced = true;
  save(id, "config", c); save("index", "index", index);
  draft = null; try { localStorage.removeItem(LSD); } catch (e) {}
  location.hash = "#"; render(); poll();
}

// ---------- Teams (tonight) ----------
function teamsView() {
  if (!cfg) return `<div class="stack"><div><h1>Teams</h1><p class="lede">No league night is set up yet.</p>${noteHtml()}</div><div class="tools"><a class="btn solid big" href="#setup">Set up tonight</a></div></div>`;
  const finals = SCHED.filter(x => x.final), scored = finals.some(x => matchResult(x.id).any);
  let k = 0;
  const groups = cfg.flights.map((fl, fi) => `<div class="tgroup"><h2>${cfg.flights.length > 1 ? "Flight " + "AB"[fi] : "Teams"}</h2>${fl.map(i => `
    <div class="trow"><span class="no">${++k}</span>
      <input class="txt" data-t="${i}" data-f="0" value="${esc(cfg.teams[i].p[0])}" maxlength="40" autocomplete="off" autocapitalize="words" aria-label="Team ${k} bowler 1">
      <input class="txt" data-t="${i}" data-f="1" value="${esc(cfg.teams[i].p[1])}" maxlength="40" autocomplete="off" autocapitalize="words" aria-label="Team ${k} bowler 2"><span></span></div>`).join("")}</div>`).join("");
  const ask = (what, q, yes) => confirmAsk === what
    ? `<span>${q}</span><button class="btn danger" data-act="${yes}">Yes</button><button class="btn" data-act="no">No</button>` : "";
  return `<div class="stack">
    <div><h1>Teams</h1><p class="lede"><b>${esc(fmtDate(cfg.date))}</b>. Fix a name here and it changes on every device. The teams, flights and schedule stay as they were set up.</p>${noteHtml()}</div>
    <div class="flights">${groups}</div>
    <div><h2>Manage</h2>
      <div class="tools" style="margin-top:10px">
        <a class="btn" href="#setup">Start a new night</a>
        ${finals.length ? (ask("refinals", scored ? "Erase the finals scores and pair the finals again?" : "Pair the finals again from the flight standings?", "refinals-yes") || `<button class="btn" data-act="ask" data-what="refinals">Redo the finals pairings…</button>`) : ""}
        ${ask("delete:" + loaded, "Delete this whole night and its scores?", "delete-yes") || `<button class="btn danger" data-act="ask" data-what="delete:${loaded}">Delete this night…</button>`}
      </div></div>
  </div>`;
}

// ---------- History ----------
async function loadHistory() {
  try {
    const r = await fetch(SB + "?select=night,key,data", { cache: "no-store", headers: SB_HEAD });
    if (!r.ok) throw new Error(r.status);
    const by = {};
    (await r.json()).forEach(x => {
      if (x.night === "index") return;
      const n = by[x.night] = by[x.night] || { id: x.night, cfg: null, matches: {} };
      if (x.key === "config") n.cfg = cleanCfg(x.data); else n.matches[x.key] = cleanMatch(x.data);
    });
    allNights = Object.values(by).filter(n => n.cfg).sort((a, b) => a.id < b.id ? 1 : -1);
  } catch (e) { allNights = allNights || []; }
  if (route().v === "history") render();
}
// Work out one stored night's champion by looking at it as if it were on screen.
function summarize(n) {
  const keep = [cfg, matches];
  setCfg(n.cfg); matches = n.matches;
  try { return { champ: champion(), any: SCHED.some(x => matchResult(x.id).any) }; }
  finally { setCfg(keep[0]); matches = keep[1]; }
}
function historyView() {
  const list = allNights === null ? `<p class="lede">Loading…</p>` : !allNights.length ? `<p class="lede">No nights have been played yet.</p>` : allNights.map(n => {
    const s = summarize(n), cur = n.id === index.current;
    const what = `delete:${n.id}`;
    return `<div class="hrow"><a class="hmain" href="${cur ? "#" : "#past/" + n.id}">
        <div class="tname">${esc(fmtDate(n.cfg.date || n.id))}${cur ? ` <span class="chip live">Tonight</span>` : ""}</div>
        <div class="tplayers">${n.cfg.teams.length} teams · ${n.cfg.frames}-frame games · ${s.champ ? "Champions: <b>" + esc(s.champ) + "</b>" : s.any ? "Not finished" : "No scores"}</div></a>
      ${confirmAsk === what ? `<span class="hask"><button class="btn danger" data-act="delete-yes">Delete</button><button class="btn" data-act="no">Keep</button></span>`
        : `<button class="btn" data-act="ask" data-what="${what}" aria-label="Delete this night">Delete…</button>`}</div>`;
  }).join("");
  return `<div class="stack"><div><h1>History</h1><p class="lede">Every league night, newest first. Tap one to see its results and stats.</p>${noteHtml()}</div>
    <div class="hlist">${list}</div>
    <p class="lede past">The November 14, 2026 tournament is on the <a href="../">original scoreboard</a>.</p></div>`;
}
async function deleteNight(id) {
  try { await fetch(SB + "?night=eq." + id, { method: "DELETE", headers: SB_HEAD }); } catch (e) {}
  if (id === index.current) {
    index = { current: null }; save("index", "index", index);
    loaded = null; setCfg(null); matches = {}; resetUi();
    try { localStorage.removeItem(LS); } catch (e) {}
  }
  if (allNights) allNights = allNights.filter(n => n.id !== id);
  if (route().v === "teams") location.hash = "#";
  render(); loadHistory();
}

// ---------- Events ----------
document.addEventListener("click", e => {
  const r = route(), ro = !!r.night;
  const a = e.target.closest("[data-act]");
  if (a && !a.disabled) {
    const act = a.dataset.act, id = r.v === "match" ? r.id : null;
    if (act === "ask") confirmAsk = a.dataset.what;
    else if (act === "no") confirmAsk = null;
    else if (act === "delete-yes" && confirmAsk && confirmAsk.startsWith("delete:")) { const n = confirmAsk.slice(7); confirmAsk = null; deleteNight(n); return; }
    else if (ro) return;
    else if (act === "fix") { fixPick[id] = true; }
    else if (act === "fix-cancel") { delete fixPick[id]; }
    else if (act === "clear-yes") { confirmAsk = null; matches[id] = emptyMatch(); undo[id] = []; delete active[id]; save(loaded, id, matches[id]); }
    else if (act === "finals" && cfg && !cfg.finals && flightsDone()) { cfg.finals = makeFinals(); setCfg(cfg); save(loaded, "config", cfg); }
    else if (act === "refinals-yes") {
      confirmAsk = null;
      SCHED.filter(x => x.final).forEach(x => { matches[x.id] = emptyMatch(); save(loaded, x.id, matches[x.id]); });
      cfg.finals = flightsDone() ? makeFinals() : null; setCfg(cfg); save(loaded, "config", cfg);
    }
    else if (act === "shuffle") { const d = getDraft(), t = d.teams.slice(0, d.n); for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; } d.teams.splice(0, d.n, ...t); keepDraft(); }
    else if (act === "start") { a.disabled = true; startNight(); return; }
    render(act === "fix-cancel"); return;
  }
  if (r.v === "setup") {
    const s = e.target.closest("[data-seg]"), mv = e.target.closest("[data-mv]");
    if (s) { const d = getDraft(); d[s.dataset.seg] = +s.dataset.val; keepDraft(); render(); }
    else if (mv && !mv.disabled) { const d = getDraft(), [i, dir] = mv.dataset.mv.split(",").map(Number); [d.teams[i], d.teams[i + dir]] = [d.teams[i + dir], d.teams[i]]; keepDraft(); render(); }
    return;
  }
  if (r.v !== "match" || ro || !cfg || !sx(r.id)) return;
  const k = e.target.closest("[data-k]");
  if (k && !k.disabled) { enter(r.id, k.dataset.k); return; }
  const p = e.target.closest("[data-pick]");
  if (!p) return;
  if (fixPick[r.id]) {
    // Only here does tapping a frame open it for fixing.
    const cell = e.target.closest("td[data-f]");
    if (cell) { delete fixPick[r.id]; edits[r.id] = { key: p.dataset.pick, f: +cell.dataset.f, rolls: [] }; render(true); }
    return;
  }
  if (edits[r.id]) return;
  active[r.id] = p.dataset.pick; render(true);
});
document.addEventListener("input", e => {
  const d = e.target.closest("[data-d]");
  if (d) {
    const dr = getDraft();
    if (d.dataset.d === "date") dr.date = d.value; else { const [i, pi] = d.dataset.d.split(",").map(Number); dr.teams[i].p[pi] = d.value; }
    keepDraft(); return;
  }
  const el = e.target.closest("[data-t]"); if (!el || !cfg || route().night) return;
  const i = +el.dataset.t, t = cfg.teams[i];
  t.p[+el.dataset.f] = el.value; t.name = teamName(t.p, i);
  save(loaded, "config", cfg);
});
document.addEventListener("keydown", e => {
  const r = route(); if (r.v !== "match" || r.night || e.target.closest("input") || e.metaKey || e.ctrlKey) return;
  const k = /^[0-9]$/.test(e.key) ? e.key : e.key === "/" ? "/" : e.key.toLowerCase() === "x" ? "X" : e.key === "Backspace" ? "undo" : null;
  if (!k) return;
  const b = document.querySelector(`[data-k="${k}"]`);
  if (b && !b.disabled) { e.preventDefault(); enter(r.id, k); }
});
window.addEventListener("hashchange", () => {
  confirmAsk = null;
  Object.keys(edits).forEach(k => delete edits[k]); Object.keys(fixPick).forEach(k => delete fixPick[k]);
  window.scrollTo(0, 0);
  if (route().v === "history") loadHistory();
  if (route().v === "setup") loadRoster();
  if (wanted() !== loaded) poll();
  render(true);
});

if (route().v === "history") loadHistory();
if (route().v === "setup") loadRoster();
connect();
</script>
</body>
</html>
