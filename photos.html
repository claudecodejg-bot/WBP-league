<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photos — WBP League</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── Expand / Collapse All ─────────────────────────────────────────── */
    .photos-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }
    .btn-expand-all {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.4rem 0.9rem;
      border: 1.5px solid var(--accent);
      border-radius: 20px;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      letter-spacing: 0.3px;
    }
    .btn-expand-all:hover { background: var(--accent); color: #fff; }

    /* ── Accordion sections ────────────────────────────────────────────── */
    .photo-section {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
      overflow: hidden;
    }
    .photo-section > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      user-select: none;
    }
    .photo-section > summary::-webkit-details-marker { display: none; }
    .photo-section > summary:hover { background: var(--gray-100); }

    .section-label {
      font-size: 1rem;
      font-weight: 700;
      color: var(--green-dark);
      flex: 1;
    }
    .section-count {
      font-size: 0.75rem;
      font-weight: 700;
      background: var(--green-pale);
      color: var(--accent);
      padding: 0.2rem 0.55rem;
      border-radius: 20px;
      white-space: nowrap;
    }
    .section-chevron {
      font-size: 1rem;
      color: var(--gray-600);
      transition: transform 0.2s;
    }
    .photo-section[open] .section-chevron { transform: rotate(180deg); }

    .section-body {
      padding: 0 1.25rem 1.25rem;
    }

    /* ── Gallery grid (shared with golf page) ──────────────────────────── */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }
    .gallery-thumb-wrap {
      position: relative;
      cursor: zoom-in;
      border-radius: var(--radius);
      overflow: hidden;
      aspect-ratio: 4/3;
      background: var(--gray-200);
    }
    .gallery-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s;
    }
    .gallery-thumb-wrap:hover .gallery-thumb { transform: scale(1.05); }
    .gallery-thumb-wrap::after {
      content: '🔍';
      position: absolute;
      bottom: 6px;
      right: 8px;
      font-size: 1rem;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .gallery-thumb-wrap:hover::after { opacity: 1; }

    /* ── Lightbox ──────────────────────────────────────────────────────── */
    .lightbox-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      cursor: zoom-out;
    }
    .lightbox-overlay.open { display: flex; }
    .lightbox-img {
      max-width: 92vw;
      max-height: 84vh;
      border-radius: var(--radius);
      box-shadow: 0 8px 48px rgba(0,0,0,0.6);
      border: 3px solid #FFD700;
      object-fit: contain;
      cursor: default;
    }
    .lb-caption {
      margin-top: 0.75rem;
      color: rgba(255,255,255,0.85);
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      max-width: 80vw;
      cursor: default;
    }
    .lightbox-close {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      opacity: 0.8;
      z-index: 1002;
    }
    .lightbox-close:hover { opacity: 1; }
    .lb-nav-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      font-size: 2rem;
      width: 48px;
      height: 64px;
      cursor: pointer;
      border-radius: var(--radius);
      transition: background 0.15s;
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lb-nav-btn:hover { background: rgba(255,255,255,0.3); }
    .lb-nav-btn.lb-prev { left: 1rem; }
    .lb-nav-btn.lb-next { right: 1rem; }
    .lb-nav-btn.hidden { opacity: 0; pointer-events: none; }
    .lb-counter {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.55);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      z-index: 1001;
    }

    @media (max-width: 640px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      .lb-nav-btn { width: 36px; height: 48px; font-size: 1.4rem; }
      .section-label { font-size: 0.92rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand"><img src="wbp-logo.png" alt="WBP"><span>WBP</span> League</a>
  <ul class="nav-links">
    <li><a href="standings.html"    data-page="standings">Standings</a></li>
    <li><a href="results.html"      data-page="results">Results</a></li>
    <li><a href="player.html"       data-page="player">Players</a></li>
    <li><a href="matchups.html"     data-page="matchups">Matchups</a></li>
    <li><a href="availability.html" data-page="availability">Availability</a></li>
    <li><a href="suggestions.html"  data-page="suggestions">Suggestions</a></li>
    <li><a href="photos.html"       data-page="photos" class="active">Photos</a></li>
    <li><a href="golf.html"         data-page="golf">Golf</a></li>
  </ul>
  <button id="nav-hamburger" aria-label="Open menu" aria-expanded="false">&#9776;</button>
  <button id="nav-auth-btn">Sign In</button>
</nav>
<script>
  (function () {
    var btn = document.getElementById('nav-hamburger')
    btn.addEventListener('click', function () {
      var open = btn.closest('nav').classList.toggle('nav-open')
      btn.textContent = open ? '\u2715' : '\u2630'
      btn.setAttribute('aria-expanded', open)
    })
    document.querySelectorAll('.nav-links a').forEach(function (a) {
      a.addEventListener('click', function () {
        btn.closest('nav').classList.remove('nav-open')
        btn.textContent = '\u2630'
        btn.setAttribute('aria-expanded', 'false')
      })
    })
  })()
</script>

<main>
  <h1 class="page-title">📸 Photos</h1>
  <p class="page-subtitle">WBP League memories &mdash; championships, awards &amp; seasons</p>

  <!-- Toolbar -->
  <div class="photos-toolbar">
    <button class="btn-expand-all" id="btn-expand-all">Expand All</button>
  </div>

  <!-- Category sections rendered by JS -->
  <div id="photo-sections"></div>

</main>

<!-- Lightbox -->
<div class="lightbox-overlay" id="lightbox" role="dialog" aria-modal="true" aria-label="Full size photo">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
  <button class="lb-nav-btn lb-prev hidden" id="lb-prev" aria-label="Previous">&#8592;</button>
  <img src="" alt="" class="lightbox-img" id="lightbox-img">
  <div class="lb-caption" id="lb-caption"></div>
  <button class="lb-nav-btn lb-next hidden" id="lb-next" aria-label="Next">&#8594;</button>
  <div class="lb-counter" id="lb-counter"></div>
</div>

<footer>WBP League &copy; <span id="footer-year"></span></footer>

<script type="module">
  import { initNav }         from './js/auth.js'
  import { PHOTO_CATEGORIES } from './photos/photos-data.js'

  document.getElementById('footer-year').textContent = new Date().getFullYear()
  initNav('photos')

  // ── Render category sections ──────────────────────────────────────────
  const container = document.getElementById('photo-sections')

  PHOTO_CATEGORIES.forEach(cat => {
    const details = document.createElement('details')
    details.className = 'photo-section'
    details.dataset.catId = cat.id
    if (cat.open) details.setAttribute('open', '')

    const allFiles = cat.photos.map(p => p.file)

    const thumbsHtml = cat.photos.map((p, i) => `
      <div class="gallery-thumb-wrap"
           data-cat="${cat.id}"
           data-index="${i}"
           tabindex="0"
           role="button"
           aria-label="View photo ${i + 1} of ${cat.photos.length}">
        <img src="${p.file}" alt="${p.caption || cat.label + ' photo ' + (i + 1)}" class="gallery-thumb" loading="lazy">
      </div>`).join('')

    details.innerHTML = `
      <summary class="photo-section-header">
        <span class="section-label">${cat.label}</span>
        <span class="section-count">${cat.photos.length} photo${cat.photos.length !== 1 ? 's' : ''}</span>
        <span class="section-chevron">&#9660;</span>
      </summary>
      <div class="section-body">
        <div class="gallery-grid">${thumbsHtml}</div>
      </div>`

    container.appendChild(details)
  })

  // ── Expand / Collapse All ─────────────────────────────────────────────
  const expandBtn = document.getElementById('btn-expand-all')
  expandBtn.addEventListener('click', () => {
    const sections = document.querySelectorAll('.photo-section')
    const allOpen  = Array.from(sections).every(s => s.hasAttribute('open'))
    sections.forEach(s => allOpen ? s.removeAttribute('open') : s.setAttribute('open', ''))
    expandBtn.textContent = allOpen ? 'Expand All' : 'Collapse All'
  })

  // Keep button label in sync when individual sections are toggled
  document.addEventListener('toggle', () => {
    const sections = document.querySelectorAll('.photo-section')
    const allOpen  = Array.from(sections).every(s => s.hasAttribute('open'))
    const anyOpen  = Array.from(sections).some(s => s.hasAttribute('open'))
    expandBtn.textContent = allOpen ? 'Collapse All' : 'Expand All'
  }, true)

  // ── Lightbox ──────────────────────────────────────────────────────────
  const lightbox  = document.getElementById('lightbox')
  const lbImg     = document.getElementById('lightbox-img')
  const lbCaption = document.getElementById('lb-caption')
  const lbClose   = document.getElementById('lightbox-close')
  const lbPrev    = document.getElementById('lb-prev')
  const lbNext    = document.getElementById('lb-next')
  const lbCounter = document.getElementById('lb-counter')

  let lbPhotos = []
  let lbIndex  = 0

  function openLightbox(photos, index) {
    lbPhotos = photos
    lbIndex  = index
    showLbImage()
    lightbox.classList.add('open')
    document.body.style.overflow = 'hidden'
  }

  function showLbImage() {
    const p = lbPhotos[lbIndex]
    lbImg.src = p.file
    lbImg.alt = p.caption || 'Photo ' + (lbIndex + 1)
    lbCaption.textContent = p.caption || ''
    lbCaption.style.display = p.caption ? 'block' : 'none'
    lbPrev.classList.toggle('hidden', lbPhotos.length <= 1 || lbIndex === 0)
    lbNext.classList.toggle('hidden', lbPhotos.length <= 1 || lbIndex === lbPhotos.length - 1)
    lbCounter.textContent = lbPhotos.length > 1 ? (lbIndex + 1) + ' / ' + lbPhotos.length : ''
  }

  function closeLightbox() {
    lightbox.classList.remove('open')
    document.body.style.overflow = ''
    lbImg.src = ''
  }

  lbClose.addEventListener('click', closeLightbox)
  lbPrev.addEventListener('click',  e => { e.stopPropagation(); lbIndex--; showLbImage() })
  lbNext.addEventListener('click',  e => { e.stopPropagation(); lbIndex++; showLbImage() })
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox() })
  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return
    if (e.key === 'Escape')     closeLightbox()
    if (e.key === 'ArrowLeft'  && lbIndex > 0)                    { lbIndex--; showLbImage() }
    if (e.key === 'ArrowRight' && lbIndex < lbPhotos.length - 1)  { lbIndex++; showLbImage() }
  })

  // ── Wire up thumbnail clicks ──────────────────────────────────────────
  document.addEventListener('click', e => {
    const thumb = e.target.closest('.gallery-thumb-wrap')
    if (!thumb) return
    const catId  = thumb.dataset.cat
    const index  = parseInt(thumb.dataset.index, 10)
    const cat    = PHOTO_CATEGORIES.find(c => c.id === catId)
    if (cat) openLightbox(cat.photos, index)
  })
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return
    const thumb = e.target.closest('.gallery-thumb-wrap')
    if (thumb) thumb.click()
  })
</script>
</body>
</html>
