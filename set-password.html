<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Password — Paddle Tennis League</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="wbp-logo.png">
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="preconnect" href="https://htmrvfkaudpevmzgteyh.supabase.co" crossorigin>
  <script src="js/nav.js" defer></script>
</head>
<body>

<nav>
  <div class="nav-brand"><img src="wbp-logo.png" alt="WBP" ><span>WBP</span> League</div>
  <ul class="nav-links"></ul>
  <button id="nav-auth-btn" class="hidden"></button>
</nav>

<main>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <h1>🎾 WBP League</h1>
        <p>Set your password to activate your account</p>
      </div>

      <div id="set-password-alert" class="alert hidden"></div>

      <form id="set-password-form">
        <div class="form-group">
          <label for="password">New Password</label>
          <input type="password" id="password" placeholder="At least 8 characters" required minlength="8">
        </div>
        <div class="form-group">
          <label for="password-confirm">Confirm Password</label>
          <input type="password" id="password-confirm" placeholder="Repeat your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="set-btn">Set Password & Sign In</button>
      </form>
    </div>
  </div>
</main>

<footer>WBP League &copy; <span id="footer-year"></span></footer>

<script type="module">
  import { supabase } from './js/supabase-client.js'

  const alertEl = document.getElementById('set-password-alert')

  function showAlert(msg, type = 'error') {
    alertEl.textContent = msg
    alertEl.className = `alert alert-${type}`
    alertEl.classList.remove('hidden')
  }

  // Supabase v2 automatically processes the token from the URL hash/query
  // when the client initialises — we just need to wait for the session
  async function checkSession() {
    const { data: { session }, error } = await supabase.auth.getSession()
    if (error) {
      showAlert('Invalid or expired invite link. Please ask your admin to re-send your invite.')
    }
    // If session exists from the invite token, the form will handle the password update
  }

  checkSession()

  document.getElementById('set-password-form').addEventListener('submit', async (e) => {
    e.preventDefault()
    alertEl.classList.add('hidden')

    const password = document.getElementById('password').value
    const confirm  = document.getElementById('password-confirm').value

    if (password !== confirm) {
      showAlert('Passwords do not match.')
      return
    }
    if (password.length < 8) {
      showAlert('Password must be at least 8 characters.')
      return
    }

    const btn = document.getElementById('set-btn')
    btn.disabled = true
    btn.textContent = 'Saving…'

    const { error } = await supabase.auth.updateUser({ password })

    if (error) {
      showAlert('Could not set password. Your invite link may have expired — ask your admin to re-send it.')
      btn.disabled = false
      btn.textContent = 'Set Password & Sign In'
      return
    }

    // Mark password as changed in user metadata
    await supabase.auth.updateUser({ data: { needs_password_change: false } })

    showAlert('Password set! Taking you to the site…', 'success')
    setTimeout(() => { window.location.href = 'availability.html' }, 1500)
  })
</script>
</body>
</html>
