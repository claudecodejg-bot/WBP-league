<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results — Paddle Tennis League</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand"><img src="wbp-logo.png" alt="WBP"><span>WBP</span> League</a>
  <ul class="nav-links">
    <li><a href="standings.html" data-page="standings">Standings</a></li>
    <li><a href="results.html"   data-page="results">Results</a></li>
    <li><a href="player.html"    data-page="player">Players</a></li>
    <li><a href="matchups.html"  data-page="matchups">Matchups</a></li>
    <li><a href="availability.html" data-page="availability">Availability</a></li>
    <li><a href="suggestions.html"  data-page="suggestions">Suggestions</a></li>
    <li><a href="photos.html"       data-page="photos">Photos</a></li>
    <li><a href="golf.html?v=2"         data-page="golf">Golf</a></li>
  </ul>
  <button id="nav-hamburger" aria-label="Open menu" aria-expanded="false">&#9776;</button>
  <button id="nav-auth-btn">Sign In</button>
</nav>
<script>
  (function () {
    var btn = document.getElementById('nav-hamburger')
    btn.addEventListener('click', function () {
      var open = btn.closest('nav').classList.toggle('nav-open')
      btn.textContent = open ? '\u2715' : '\u2630'
      btn.setAttribute('aria-expanded', open)
    })
    document.querySelectorAll('.nav-links a').forEach(function (a) {
      a.addEventListener('click', function () {
        btn.closest('nav').classList.remove('nav-open')
        btn.textContent = '\u2630'
        btn.setAttribute('aria-expanded', 'false')
      })
    })
  })()
</script>

<main>
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.25rem;">
    <div>
      <h1 class="page-title" style="margin-bottom:0.15rem;">Match Results</h1>
      <p class="page-subtitle" style="margin:0;">All matches, grouped by week — most recent first.</p>
    </div>
    <button id="add-result-btn" class="btn btn-primary" style="display:none;">+ Add Result</button>
  </div>

  <div class="season-bar">
    <label for="season-select">Season:</label>
    <select id="season-select"></select>
  </div>

  <div id="results-container">
    <div class="loading-state">
      <div class="spinner"></div> Loading results…
    </div>
  </div>
</main>

<!-- Add Result Modal -->
<div id="result-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box" style="max-width:640px;">
    <div class="modal-header">
      <span class="modal-title">Add Match Result</span>
      <button id="result-modal-close" class="modal-close-btn">&times;</button>
    </div>
    <div class="modal-body">
      <div id="result-form-alert" class="alert hidden"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1rem;">
        <div class="form-group" style="margin:0;">
          <label for="r-week-label">Week Label</label>
          <input type="text" id="r-week-label" class="form-input" placeholder="e.g. Week 20">
        </div>
        <div class="form-group" style="margin:0;">
          <label for="r-played-on">Date Played</label>
          <input type="date" id="r-played-on" class="form-input">
        </div>
      </div>

      <div class="admin-grid">
        <!-- Team 1 -->
        <div class="team-block">
          <div class="team-block-title">Team 1</div>
          <div class="form-group">
            <label>Player 1</label>
            <select id="r-t1p1" class="form-input"><option value="">— select —</option></select>
          </div>
          <div class="form-group">
            <label>Player 2</label>
            <select id="r-t1p2" class="form-input"><option value="">— select —</option></select>
          </div>
          <div class="form-group">
            <label>Set Scores</label>
            <div class="set-scores-group">
              <div>
                <label style="font-size:0.75rem;color:var(--gray-600);">Set 1</label>
                <input type="number" id="r-t1s1" class="form-input" min="0" max="7" placeholder="0–7">
              </div>
              <div>
                <label style="font-size:0.75rem;color:var(--gray-600);">Set 2</label>
                <input type="number" id="r-t1s2" class="form-input" min="0" max="7" placeholder="0–7">
              </div>
              <div>
                <label style="font-size:0.75rem;color:var(--gray-600);">Set 3</label>
                <input type="number" id="r-t1s3" class="form-input" min="0" max="7" placeholder="opt.">
              </div>
            </div>
          </div>
        </div>

        <!-- Team 2 -->
        <div class="team-block">
          <div class="team-block-title">Team 2</div>
          <div class="form-group">
            <label>Player 1</label>
            <select id="r-t2p1" class="form-input"><option value="">— select —</option></select>
          </div>
          <div class="form-group">
            <label>Player 2</label>
            <select id="r-t2p2" class="form-input"><option value="">— select —</option></select>
          </div>
          <div class="form-group">
            <label>Set Scores</label>
            <div class="set-scores-group">
              <div>
                <label style="font-size:0.75rem;color:var(--gray-600);">Set 1</label>
                <input type="number" id="r-t2s1" class="form-input" min="0" max="7" placeholder="0–7">
              </div>
              <div>
                <label style="font-size:0.75rem;color:var(--gray-600);">Set 2</label>
                <input type="number" id="r-t2s2" class="form-input" min="0" max="7" placeholder="0–7">
              </div>
              <div>
                <label style="font-size:0.75rem;color:var(--gray-600);">Set 3</label>
                <input type="number" id="r-t2s3" class="form-input" min="0" max="7" placeholder="opt.">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="r-score-preview" class="alert alert-info hidden" style="margin-top:0.5rem;"></div>
    </div>
    <div class="modal-footer">
      <button id="result-modal-cancel" class="btn btn-secondary">Cancel</button>
      <button id="result-modal-save" class="btn btn-primary">Save Result</button>
    </div>
  </div>
</div>

<footer>WBP League &copy; <span id="footer-year"></span></footer>

<script type="module">
  import { initNav, getCurrentMember } from './js/auth.js'
  import { supabase } from './js/supabase-client.js'
  import { loadResults } from './js/results.js'
  import { matchScore, isWinner, fmt } from './js/scoring.js'

  document.getElementById('footer-year').textContent = new Date().getFullYear()
  initNav('results')

  const CURRENT_SEASON = '2025-26'
  const seasonSelect   = document.getElementById('season-select')
  let _activeSeason    = localStorage.getItem('activeSeason') || CURRENT_SEASON

  // ── Admin button ──────────────────────────────────────────
  getCurrentMember().then(member => {
    if (member?.is_admin) {
      const btn = document.getElementById('add-result-btn')
      btn.style.display = ''
      btn.addEventListener('click', openResultModal)
    }
  })

  // ── Modal logic ───────────────────────────────────────────
  const modal = document.getElementById('result-modal')

  document.getElementById('result-modal-close').addEventListener('click',  closeModal)
  document.getElementById('result-modal-cancel').addEventListener('click', closeModal)
  modal.addEventListener('click', e => { if (e.target === modal) closeModal() })

  function closeModal() { modal.style.display = 'none' }

  function getNum(id) {
    const val = document.getElementById(id)?.value
    if (val === '' || val == null) return null
    const n = parseInt(val, 10)
    return isNaN(n) ? null : n
  }

  function updatePreview() {
    const t1s1 = getNum('r-t1s1'), t1s2 = getNum('r-t1s2'), t1s3 = getNum('r-t1s3')
    const t2s1 = getNum('r-t2s1'), t2s2 = getNum('r-t2s2'), t2s3 = getNum('r-t2s3')
    const preview = document.getElementById('r-score-preview')
    if (t1s1 === null || t1s2 === null || t2s1 === null || t2s2 === null) {
      preview.classList.add('hidden')
      return
    }
    const t1score = matchScore(t1s1, t1s2, t1s3, t2s1, t2s2, t2s3)
    const t2score = matchScore(t2s1, t2s2, t2s3, t1s1, t1s2, t1s3)
    const t1won   = isWinner(t1s1, t1s2, t1s3, t2s1, t2s2, t2s3)
    preview.classList.remove('hidden')
    preview.innerHTML = `<strong>Preview:</strong> Team 1 → <strong>${fmt(t1score)}</strong> ${t1won ? '(WIN ✓)' : '(loss)'} &nbsp;|&nbsp; Team 2 → <strong>${fmt(t2score)}</strong> ${!t1won ? '(WIN ✓)' : '(loss)'}`
  }

  async function openResultModal() {
    // Reset form
    document.getElementById('result-form-alert').classList.add('hidden')
    document.getElementById('r-score-preview').classList.add('hidden')
    document.getElementById('r-played-on').value = new Date().toISOString().split('T')[0]
    document.getElementById('r-week-label').value = ''
    ;['r-t1s1','r-t1s2','r-t1s3','r-t2s1','r-t2s2','r-t2s3'].forEach(id => {
      document.getElementById(id).value = ''
    })

    // Load members into dropdowns
    const { data: members } = await supabase.from('members').select('id, full_name').order('full_name')
    if (members) {
      const opts = members.map(m => `<option value="${m.id}">${m.full_name}</option>`).join('')
      ;['r-t1p1','r-t1p2','r-t2p1','r-t2p2'].forEach(id => {
        document.getElementById(id).innerHTML = '<option value="">— select —</option>' + opts
      })
    }

    // Wire up score preview
    ;['r-t1s1','r-t1s2','r-t1s3','r-t2s1','r-t2s2','r-t2s3'].forEach(id => {
      document.getElementById(id).addEventListener('input', updatePreview)
    })

    modal.style.display = 'flex'
  }

  document.getElementById('result-modal-save').addEventListener('click', async () => {
    const alertEl   = document.getElementById('result-form-alert')
    const weekLabel = document.getElementById('r-week-label').value.trim()
    const playedOn  = document.getElementById('r-played-on').value
    const t1p1 = document.getElementById('r-t1p1').value
    const t1p2 = document.getElementById('r-t1p2').value
    const t2p1 = document.getElementById('r-t2p1').value
    const t2p2 = document.getElementById('r-t2p2').value
    const t1s1 = getNum('r-t1s1'), t1s2 = getNum('r-t1s2'), t1s3 = getNum('r-t1s3')
    const t2s1 = getNum('r-t2s1'), t2s2 = getNum('r-t2s2'), t2s3 = getNum('r-t2s3')

    const showError = msg => {
      alertEl.textContent = msg
      alertEl.className = 'alert alert-error'
      alertEl.classList.remove('hidden')
    }

    if (!weekLabel)  return showError('Please enter a week label.')
    if (!playedOn)   return showError('Please enter the date played.')
    if (!t1p1 || !t1p2) return showError('Please select both players for Team 1.')
    if (!t2p1 || !t2p2) return showError('Please select both players for Team 2.')
    if (new Set([t1p1, t1p2, t2p1, t2p2]).size !== 4)
      return showError('Each player can only appear once per match.')
    if (t1s1 === null || t1s2 === null || t2s1 === null || t2s2 === null)
      return showError('Please enter Set 1 and Set 2 scores for both teams.')

    const saveBtn = document.getElementById('result-modal-save')
    saveBtn.disabled    = true
    saveBtn.textContent = 'Saving…'

    const { error } = await supabase.from('matches').insert({
      week_label: weekLabel, played_on: playedOn, season: CURRENT_SEASON,
      team1_player1: t1p1, team1_player2: t1p2,
      team2_player1: t2p1, team2_player2: t2p2,
      team1_set1: t1s1, team1_set2: t1s2, team1_set3: t1s3,
      team2_set1: t2s1, team2_set2: t2s2, team2_set3: t2s3
    })

    saveBtn.disabled    = false
    saveBtn.textContent = 'Save Result'

    if (error) return showError('Error saving match: ' + error.message)

    closeModal()
    loadResults(_activeSeason)
  })

  // ── Season dropdown & results ─────────────────────────────
  async function populateSeasonDropdown() {
    const { data } = await supabase.from('matches').select('season')
    if (!data) return
    const seasons = [...new Set(data.map(m => m.season))].sort().reverse()
    const options = [seasons[0], 'all', ...seasons.slice(1)]
    seasonSelect.innerHTML = options.map(s => {
      if (s === 'all') return `<option value="all"${_activeSeason === 'all' ? ' selected' : ''}>Entire History</option>`
      return `<option value="${s}"${s === _activeSeason ? ' selected' : ''}>${s}${s === CURRENT_SEASON ? ' (Current)' : ''}</option>`
    }).join('')
    if (!seasons.includes(_activeSeason) && _activeSeason !== 'all') {
      _activeSeason = seasons[0] || CURRENT_SEASON
      seasonSelect.value = _activeSeason
    }
  }

  seasonSelect.addEventListener('change', () => {
    _activeSeason = seasonSelect.value
    localStorage.setItem('activeSeason', _activeSeason)
    loadResults(_activeSeason)
  })

  populateSeasonDropdown().then(() => loadResults(_activeSeason))
</script>
</body>
</html>
