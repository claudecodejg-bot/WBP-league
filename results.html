<footer>Weed Beach Paddle &mdash; the WBP League, Darien CT &middot; &copy; <span id="footer-year"></span></footer>

<script type="module">
  import { initNav, getCurrentMember } from './js/auth.js?v=3bf86c6c'
  import { supabase } from './js/supabase-client.js?v=2d21059e'
  import { CURRENT_SEASON, UNOFFICIAL_WEEKS } from './js/config.js?v=d0c3b471'
  import { loadResults, knownSeasons } from './js/results.js?v=4ffec798'
  import { matchScore, isWinner, fmt, winnerFirst } from './js/scoring.js?v=875c8034'
  initNav('results')

  const seasonSelect   = document.getElementById('season-select')
  let _activeSeason    = localStorage.getItem('activeSeason') || CURRENT_SEASON

  // ── Admin button ──────────────────────────────────────────
  getCurrentMember().then(member => {
    if (member?.is_admin) {
      const btn = document.getElementById('add-result-btn')
      btn.style.display = ''
      btn.addEventListener('click', openResultModal)

      const vb = document.getElementById('vinnys-btn')
      vb.style.display = ''
      vb.addEventListener('click', () => openVinnysModal())
    }
  })

  // ── Modal state ───────────────────────────────────────────
  let _schedule        = null   // scheduled_matches row
  let _courtIdx        = 0
  let _skipped         = []    // court numbers left unrecorded this pass
  let _members         = []     // current-season members only
  let _memberNameToId  = {}
  let _weekLabel       = ''
  let _playedOn        = ''

  const modal = document.getElementById('result-modal')
  document.getElementById('result-modal-close').addEventListener('click', closeModal)
  modal.addEventListener('click', e => { if (e.target === modal) closeModal() })
  function closeModal() { modal.style.display = 'none' }

  function setScreen(bodyHtml, footerHtml) {
    document.getElementById('result-modal-body').innerHTML   = bodyHtml
    document.getElementById('result-modal-footer').innerHTML = footerHtml
  }
  function setTitle(t) { document.getElementById('result-modal-title').textContent = t }

  function getNum(id) {
    const val = document.getElementById(id)?.value
    if (val === '' || val == null) return null
    const n = parseInt(val, 10)
    return isNaN(n) ? null : n
  }

  // The opening Mondays of the season are warm-ups played off the record.
  // Nothing in the database distinguishes them, so a result saved for one of
  // those dates would quietly count in the standings. Warn before that
  // happens; the admin can still override if they really mean to.
  function mondayOf(isoDate) {
    const d = new Date(isoDate + 'T00:00:00')
    const day = d.getDay()
    d.setDate(d.getDate() - day + (day === 0 ? -6 : 1))
    const pad = n => String(n).padStart(2, '0')
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`
  }

  function confirmIfWarmUpWeek(playedOn) {
    if (!playedOn || !UNOFFICIAL_WEEKS.includes(mondayOf(playedOn))) return true
    return confirm(
      'That date falls in a pre-season warm-up week, which is meant to stay ' +
      'off the record.\n\nSaving it will count the match in the standings. ' +
      'Add it anyway?'
    )
  }

  // Maps a Supabase insert error to a friendly message. The unique
  // constraint (matches_no_duplicates) raises Postgres code 23505.
  function friendlyInsertError(error) {
    if (error?.code === '23505' || /duplicate|matches_no_duplicates/i.test(error?.message || '')) {
      return 'This match looks like it was already entered — check the results list before re-adding.'
    }
    return 'Error saving: ' + (error?.message || 'please try again.')
  }

  // ── Open modal: fetch schedule + current-season members ───
  // A schedule is worth offering for about a week after its night: long
  // enough for a late entry, short enough to ignore a stale one.
  function recentCutoff() {
    const d = new Date()
    d.setDate(d.getDate() - 8)
    return d.toISOString().split('T')[0]
  }

  async function openResultModal() {
    modal.style.display = 'flex'
    setTitle('Add Match Result')
    setScreen('<div class="loading-state"><div class="spinner"></div> Loading schedule…</div>', '')

    const [membersRes, seasonMembersRes, schedRes, lastMatchRes] = await Promise.all([
      supabase.from('members').select('id, full_name').order('full_name'),
      supabase.from('member_seasons').select('member_id').eq('season', CURRENT_SEASON),
      // Only a recent schedule. Results are normally entered the morning
      // after, so yesterday must still count — but a leftover row from a
      // previous season must not drive the form, which is what happened
      // with a March row still sitting there in October.
      supabase.from('scheduled_matches').select('*')
        .gte('played_on', recentCutoff())
        .order('played_on', { ascending: false }).limit(1).maybeSingle(),
      supabase.from('matches').select('week_label').eq('season', CURRENT_SEASON).order('played_on', { ascending: false }).limit(1).maybeSingle()
    ])

    _schedule  = schedRes.data || null

    // Current-season members, plus anyone the scheduler put on a court. Subs
    // (guests or former members filling in) must be selectable here, or a
    // night played with a fill-in could be scheduled but never recorded.
    const activeIds   = new Set((seasonMembersRes.data || []).map(r => r.member_id))
    const allMembers  = membersRes.data || []
    const scheduled   = new Set(
      (_schedule?.courts || []).flatMap(c => [...(c.team1 || []), ...(c.team2 || [])])
    )

    _members = allMembers.filter(m => activeIds.has(m.id) || scheduled.has(m.full_name))
    _memberNameToId = Object.fromEntries(allMembers.map(m => [m.full_name, m.id]))
    _courtIdx  = 0
    _skipped   = []

    // Auto-suggest next week label by incrementing the last one
    const lastLabel = lastMatchRes.data?.week_label || ''
    const match = lastLabel.match(/\d+/)
    _weekLabel = match ? `Week ${parseInt(match[0], 10) + 1}` : ''

    if (_schedule?.courts?.length > 0) {
      renderSetupStep()
    } else {
      renderManualForm()
    }
  }

  // ── Step 1: confirm week label + date ─────────────────────
  function renderSetupStep() {
    setTitle('Add Match Result')
    const courts = _schedule.courts
    const summary = courts.map((c, i) => `
      <div style="padding:0.35rem 0;border-bottom:1px solid var(--gray-100);font-size:0.85rem;">
        <strong>Court ${i + 1}</strong>${c.location ? ' — ' + c.location : ''}
        <span style="color:var(--gray-500);margin:0 0.4rem;">·</span>
        ${c.team1.join(' & ')} <span style="color:var(--gray-400);">vs</span> ${c.team2.join(' & ')}
      </div>`).join('')

    setScreen(`
      <div id="setup-alert" class="alert hidden"></div>
      <div style="background:var(--gray-100);border-radius:var(--radius);padding:0.75rem 1rem;margin-bottom:1rem;">
        <div style="font-size:0.72rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:0.5rem;">
          Scheduled — ${courts.length} Court${courts.length > 1 ? 's' : ''}
        </div>
        ${summary}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
        <div class="form-group" style="margin:0;">
          <label for="s-week-label">Week Label</label>
          <input type="text" id="s-week-label" class="form-input" value="${_weekLabel}" placeholder="e.g. Week 20">
        </div>
        <div class="form-group" style="margin:0;">
          <label for="s-played-on">Date Played</label>
          <input type="date" id="s-played-on" class="form-input" value="${_schedule.played_on}">
        </div>
      </div>`,
    `<button id="setup-cancel" class="btn btn-secondary">Cancel</button>
     <button id="setup-start"  class="btn btn-primary">Start Court 1 →</button>`)

    document.getElementById('setup-cancel').addEventListener('click', closeModal)
    document.getElementById('setup-start').addEventListener('click', () => {
      const wl = document.getElementById('s-week-label').value.trim()
      if (!wl) {
        const a = document.getElementById('setup-alert')
        a.textContent = 'Please enter a week label (e.g. Week 20).'
        a.className = 'alert alert-error'
        a.classList.remove('hidden')
        return
      }
      _weekLabel = wl
      _playedOn  = document.getElementById('s-played-on').value
      renderCourtStep()
    })
  }

  // ── Step 2+: enter scores for each court ──────────────────
  function renderCourtStep() {
    const court  = _schedule.courts[_courtIdx]
    const total  = _schedule.courts.length
    const isLast = _courtIdx === total - 1
    const [p1, p2] = court.team1
    const [p3, p4] = court.team2
    const loc = court.location || 'Woodway CC'

    // Build player dropdowns — pre-selected from schedule, but changeable
    const memberOpts = _members.map(m =>
      `<option value="${m.id}">${m.full_name}</option>`).join('')

    function selectOpts(preselectedName) {
      return _members.map(m =>
        `<option value="${m.id}"${m.full_name === preselectedName ? ' selected' : ''}>${m.full_name}</option>`
      ).join('')
    }

    setTitle(`Court ${_courtIdx + 1} of ${total}`)
    setScreen(`
      <div id="court-alert" class="alert hidden"></div>
      <div style="background:var(--gray-100);border-radius:var(--radius);padding:0.6rem 1rem;margin-bottom:1rem;font-size:0.85rem;">
        <span style="font-weight:700;color:var(--accent);">${_weekLabel}</span>
        <span style="color:var(--gray-400);margin:0 0.35rem;">·</span>${loc}
      </div>

      <div class="court-entry">
        <div class="court-entry-team">
          <div class="team-block-title">Team 1</div>
          <div class="court-entry-players">
            <select id="c-t1p1" class="form-input"><option value="">— select —</option>${selectOpts(p1)}</select>
            <select id="c-t1p2" class="form-input"><option value="">— select —</option>${selectOpts(p2)}</select>
          </div>
        </div>

        <div class="court-entry-scores">
          <div class="ces-head"></div>
          <div class="ces-head">Set 1</div>
          <div class="ces-head">Set 2</div>
          <div class="ces-head">Set 3</div>

          <div class="ces-row-label">Team 1</div>
          <input type="number" id="c-t1s1" class="form-input ces-box" min="0" max="7" inputmode="numeric" placeholder="0–7">
          <input type="number" id="c-t1s2" class="form-input ces-box" min="0" max="7" inputmode="numeric" placeholder="0–7">
          <input type="number" id="c-t1s3" class="form-input ces-box" min="0" max="7" inputmode="numeric" placeholder="opt.">

          <div class="ces-row-label">Team 2</div>
          <input type="number" id="c-t2s1" class="form-input ces-box" min="0" max="7" inputmode="numeric" placeholder="0–7">
          <input type="number" id="c-t2s2" class="form-input ces-box" min="0" max="7" inputmode="numeric" placeholder="0–7">
          <input type="number" id="c-t2s3" class="form-input ces-box" min="0" max="7" inputmode="numeric" placeholder="opt.">
        </div>

        <div class="court-entry-team">
          <div class="team-block-title">Team 2</div>
          <div class="court-entry-players">
            <select id="c-t2p1" class="form-input"><option value="">— select —</option>${selectOpts(p3)}</select>
            <select id="c-t2p2" class="form-input"><option value="">— select —</option>${selectOpts(p4)}</select>
          </div>
        </div>
      </div>
      <div id="c-preview" class="alert alert-info hidden" style="margin-top:0.5rem;font-size:0.85rem;"></div>`,
    `<button id="court-skip" class="btn btn-secondary">Skip Court</button>
     <button id="court-save" class="btn btn-primary">${isLast ? 'Save & Finish ✓' : 'Save & Next Court →'}</button>`)

    ;['c-t1s1','c-t1s2','c-t1s3','c-t2s1','c-t2s2','c-t2s3'].forEach(id =>
      document.getElementById(id)?.addEventListener('input', updateCourtPreview))

    document.getElementById('court-skip').addEventListener('click', () => {
      _skipped.push(_courtIdx + 1)
      _courtIdx++
      advanceCourt()
    })
    document.getElementById('court-save').addEventListener('click', saveCourtResult)
  }

  function updateCourtPreview() {
    const t1s1 = getNum('c-t1s1'), t1s2 = getNum('c-t1s2'), t1s3 = getNum('c-t1s3')
    const t2s1 = getNum('c-t2s1'), t2s2 = getNum('c-t2s2'), t2s3 = getNum('c-t2s3')
    const preview = document.getElementById('c-preview')
    if (!preview || t1s1 === null || t1s2 === null || t2s1 === null || t2s2 === null) { preview?.classList.add('hidden'); return }
    const t1score = matchScore(t1s1, t1s2, t1s3, t2s1, t2s2, t2s3)
    const t2score = matchScore(t2s1, t2s2, t2s3, t1s1, t1s2, t1s3)
    const t1won   = isWinner(t1s1, t1s2, t1s3, t2s1, t2s2, t2s3)
    const t1p1name = _members.find(m => m.id === document.getElementById('c-t1p1').value)?.full_name || 'Team 1'
    const t2p1name = _members.find(m => m.id === document.getElementById('c-t2p1').value)?.full_name || 'Team 2'
    preview.classList.remove('hidden')
    // Mirror how the result will read once posted: winner first, scores
    // from their side. Avoids entering something that looks right here and
    // then appears reversed on the results page.
    const { decided, flip, sets } = winnerFirst({
      team1_set1: t1s1, team1_set2: t1s2, team1_set3: t1s3,
      team2_set1: t2s1, team2_set2: t2s2, team2_set3: t2s3
    })
    const setStr = sets.map(([a, b]) => `${a}\u2013${b}`).join(', ')
    const win  = flip ? { name: t2p1name, score: t2score } : { name: t1p1name, score: t1score }
    const lose = flip ? { name: t1p1name, score: t1score } : { name: t2p1name, score: t2score }
    preview.innerHTML = decided
      ? `<strong>${win.name}'s team win</strong> ${setStr} &nbsp;|&nbsp; ` +
        `${fmt(win.score)} to ${lose.name}'s ${fmt(lose.score)}`
      : `<strong>${t1p1name}'s team:</strong> ${fmt(t1score)} &nbsp;|&nbsp; ` +
        `<strong>${t2p1name}'s team:</strong> ${fmt(t2score)} &mdash; no winner yet`
  }

  async function saveCourtResult() {
    const alertEl = document.getElementById('court-alert')
    const t1p1 = document.getElementById('c-t1p1').value
    const t1p2 = document.getElementById('c-t1p2').value
    const t2p1 = document.getElementById('c-t2p1').value
    const t2p2 = document.getElementById('c-t2p2').value
    const t1s1 = getNum('c-t1s1'), t1s2 = getNum('c-t1s2'), t1s3 = getNum('c-t1s3')
    const t2s1 = getNum('c-t2s1'), t2s2 = getNum('c-t2s2'), t2s3 = getNum('c-t2s3')

    const showErr = msg => { alertEl.textContent = msg; alertEl.className = 'alert alert-error'; alertEl.classList.remove('hidden') }
    if (!t1p1 || !t1p2) return showErr('Please select both players for Team 1.')
    if (!t2p1 || !t2p2) return showErr('Please select both players for Team 2.')
    if (new Set([t1p1,t1p2,t2p1,t2p2]).size !== 4) return showErr('Each player can only appear once.')
    if (t1s1 === null || t1s2 === null || t2s1 === null || t2s2 === null) return showErr('Please enter Set 1 and Set 2 for both teams.')

    if (!confirmIfWarmUpWeek(_playedOn)) return

    const saveBtn = document.getElementById('court-save')
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…'

    const { error } = await supabase.from('matches').insert({
      week_label: _weekLabel, played_on: _playedOn, season: CURRENT_SEASON,
      team1_player1: t1p1, team1_player2: t1p2,
      team2_player1: t2p1, team2_player2: t2p2,
      team1_set1: t1s1, team1_set2: t1s2, team1_set3: t1s3,
      team2_set1: t2s1, team2_set2: t2s2, team2_set3: t2s3
    })

    saveBtn.disabled = false
    if (error) return showErr(friendlyInsertError(error))
    _courtIdx++
    advanceCourt()
  }

  function advanceCourt() {
    _courtIdx < _schedule.courts.length ? renderCourtStep() : renderDoneScreen()
  }

  function renderDoneScreen() {
    const pending = _skipped.length > 0

    setTitle(pending ? 'Saved So Far' : 'Results Saved')
    setScreen(pending
      ? `<div style="text-align:center;padding:1.25rem 0 0.5rem;">
           <div style="font-size:2.2rem;margin-bottom:0.5rem;">&#128221;</div>
           <div style="font-weight:700;font-size:1rem;">
             Court${_skipped.length > 1 ? 's' : ''} ${_skipped.join(' and ')} still to come
           </div>
           <div style="color:var(--gray-500);font-size:0.88rem;margin-top:0.35rem;line-height:1.5;">
             Everything else is saved. The schedule is kept, so you can reopen
             Add Result later and enter the rest &mdash; skip past the courts
             you have already done.
           </div>
         </div>`
      : `<div style="text-align:center;padding:1.5rem 0;">
           <div style="font-size:2.5rem;margin-bottom:0.75rem;">&#10003;</div>
           <div style="font-weight:700;font-size:1rem;">All courts entered</div>
           <div style="color:var(--gray-500);font-size:0.88rem;margin-top:0.25rem;">${_weekLabel}</div>
         </div>`,
    `<button id="done-close" class="btn btn-secondary">${pending ? 'Finish for now' : 'Done'}</button>
     <button id="done-vinnys" class="btn btn-primary">&#127867; Record Vinny&rsquo;s &rarr;</button>`)

    // Clearing the schedule is the same whichever button is pressed, so both
    // paths go through here first.
    async function finish() {
      // Only clear the schedule once every court is recorded — otherwise the
      // remaining pairings (and any subs named in them) would be lost, and the
      // home page would stop showing a night that is still outstanding.
      if (!pending && _schedule?.id) {
        await supabase.from('scheduled_matches').delete().eq('id', _schedule.id)
      }
      loadResults(_activeSeason, { refresh: true })
    }

    document.getElementById('done-close').addEventListener('click', async () => {
      await finish()
      closeModal()
    })

    // Straight on to who went out, with tonight already selected.
    document.getElementById('done-vinnys').addEventListener('click', async () => {
      const night = _playedOn
      await finish()
      openVinnysModal(night)
    })
  }

  // ── Vinny's Award ─────────────────────────────────────────
  // Who went out after the matches. Stored one row per member per night,
  // so saving a night is a clean replace: clear it, then insert the ticks.
  let _vinnysNights  = []   // [{ playedOn, label, playerIds:Set }]
  let _vinnysPeople  = []   // pickable members, name-sorted
  let _vinnysMarked  = {}   // playedOn -> Set(member_id) already saved

  async function openVinnysModal(preselectDate) {
    modal.style.display = 'flex'
    setTitle("Vinny's Award")
    setScreen('<div class="loading-state"><div class="spinner"></div> Loading…</div>', '')

    const [membersRes, seasonRes, matchesRes, vinnysRes] = await Promise.all([
      supabase.from('members').select('id, full_name').order('full_name'),
      supabase.from('member_seasons').select('member_id').eq('season', CURRENT_SEASON),
      supabase.from('matches')
        .select('played_on, week_label, team1_player1, team1_player2, team2_player1, team2_player2')
        .eq('season', CURRENT_SEASON).order('played_on', { ascending: false }),
      supabase.from('vinnys').select('played_on, member_id')
    ])

    if (membersRes.error || matchesRes.error) {
      setScreen('<div class="alert alert-error">Could not load. Check the connection and try again.</div>',
                '<button id="v-close" class="btn btn-primary" style="width:100%;">Close</button>')
      document.getElementById('v-close').addEventListener('click', closeModal)
      return
    }
    if (vinnysRes.error) {
      setScreen(`<div class="alert alert-error">
          The <code>vinnys</code> table isn't there yet &mdash; run
          <strong>setup-vinnys.sql</strong> in the Supabase SQL editor first.
        </div>`,
        '<button id="v-close" class="btn btn-primary" style="width:100%;">Close</button>')
      document.getElementById('v-close').addEventListener('click', closeModal)
      return
    }

    const allMembers = membersRes.data || []
    const activeIds  = new Set((seasonRes.data || []).map(r => r.member_id))
    const matches    = matchesRes.data || []

    // One entry per night that was actually played.
    const byNight = new Map()
    for (const m of matches) {
      if (!byNight.has(m.played_on)) {
        byNight.set(m.played_on, { playedOn: m.played_on, label: m.week_label || '', playerIds: new Set() })
      }
      const n = byNight.get(m.played_on)
      for (const id of [m.team1_player1, m.team1_player2, m.team2_player1, m.team2_player2]) {
        if (id) n.playerIds.add(id)
      }
    }
    _vinnysNights = [...byNight.values()]

    if (_vinnysNights.length === 0) {
      setScreen('<div class="alert alert-info">No match nights recorded this season yet. Enter a result first.</div>',
                '<button id="v-close" class="btn btn-primary" style="width:100%;">Close</button>')
      document.getElementById('v-close').addEventListener('click', closeModal)
      return
    }

    // Season members, plus any sub who played a night — a guest can go out too.
    const playedAny = new Set(_vinnysNights.flatMap(n => [...n.playerIds]))
    _vinnysPeople = allMembers
      .filter(m => activeIds.has(m.id) || playedAny.has(m.id))
      .filter(m => m.full_name !== 'Forfeit')

    _vinnysMarked = {}
    for (const r of (vinnysRes.data || [])) {
      ;(_vinnysMarked[r.played_on] ||= new Set()).add(r.member_id)
    }

    const start = _vinnysNights.find(n => n.playedOn === preselectDate) || _vinnysNights[0]
    renderVinnysStep(start.playedOn)
  }

  function renderVinnysStep(playedOn) {
    const night  = _vinnysNights.find(n => n.playedOn === playedOn) || _vinnysNights[0]
    const marked = _vinnysMarked[night.playedOn] || new Set()
    const saved  = marked.size > 0

    const nightOpts = _vinnysNights.map(n => {
      const d = new Date(n.playedOn + 'T12:00:00')
        .toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
      const tally = (_vinnysMarked[n.playedOn] || new Set()).size
      return `<option value="${n.playedOn}"${n.playedOn === night.playedOn ? ' selected' : ''}>${
        n.label ? n.label + ' — ' : ''}${d}${tally ? ` (${tally} out)` : ''}</option>`
    }).join('')

    // Players that night first — they are the likely answer — then the rest.
    const sortKey = m => (night.playerIds.has(m.id) ? 0 : 1)
    const people  = [..._vinnysPeople].sort((a, b) =>
      sortKey(a) - sortKey(b) || a.full_name.localeCompare(b.full_name))

    const rows = people.map(m => `
      <label class="vinnys-pick">
        <input type="checkbox" class="vinnys-check" value="${m.id}"${marked.has(m.id) ? ' checked' : ''}>
        <span class="vinnys-pick-name">${m.full_name}</span>
        ${night.playerIds.has(m.id) ? '<span class="vinnys-pick-tag">played</span>' : ''}
      </label>`).join('')

    setTitle("Vinny's Award")
    setScreen(`
      <div id="vinnys-alert" class="alert hidden"></div>
      <div class="form-group">
        <label for="v-night">Night</label>
        <select id="v-night" class="form-input">${nightOpts}</select>
      </div>
      <div class="vinnys-toolbar">
        <span class="vinnys-count"><strong id="v-count">${marked.size}</strong> going out</span>
        <span style="flex:1;"></span>
        <button type="button" id="v-all-played" class="btn-link">Everyone who played</button>
        <button type="button" id="v-none" class="btn-link">Clear</button>
      </div>
      <div class="vinnys-list">${rows}</div>`,
      `<button id="v-cancel" class="btn btn-secondary">Cancel</button>
       <button id="v-save"   class="btn btn-primary">${saved ? 'Update' : 'Save'} Vinny&rsquo;s</button>`)

    const list  = document.getElementById('vinnys-list-root') || document
    const boxes = () => [...document.querySelectorAll('.vinnys-check')]
    const sync  = () => {
      document.getElementById('v-count').textContent = boxes().filter(b => b.checked).length
    }
    boxes().forEach(b => b.addEventListener('change', sync))

    document.getElementById('v-all-played').addEventListener('click', () => {
      boxes().forEach(b => { if (night.playerIds.has(b.value)) b.checked = true })
      sync()
    })
    document.getElementById('v-none').addEventListener('click', () => {
      boxes().forEach(b => { b.checked = false })
      sync()
    })
    document.getElementById('v-night').addEventListener('change', e => renderVinnysStep(e.target.value))
    document.getElementById('v-cancel').addEventListener('click', closeModal)
    document.getElementById('v-save').addEventListener('click', () => saveVinnys(night.playedOn))
  }

  async function saveVinnys(playedOn) {
    const btn   = document.getElementById('v-save')
    const alert = document.getElementById('vinnys-alert')
    const ids   = [...document.querySelectorAll('.vinnys-check')].filter(b => b.checked).map(b => b.value)

    btn.disabled = true
    btn.textContent = 'Saving…'

    // Replace the night wholesale so unticking somebody actually removes them.
    const del = await supabase.from('vinnys').delete().eq('played_on', playedOn)
    let err = del.error
    if (!err && ids.length > 0) {
      const ins = await supabase.from('vinnys')
        .insert(ids.map(id => ({ played_on: playedOn, member_id: id })))
      err = ins.error
    }

    btn.disabled = false
    btn.textContent = 'Save Vinny’s'

    if (err) {
      alert.className = 'alert alert-error'
      alert.textContent = 'Could not save: ' + err.message
      return
    }

    _vinnysMarked[playedOn] = new Set(ids)
    alert.className = 'alert alert-success'
    alert.textContent = ids.length === 0
      ? 'Night cleared — nobody recorded.'
      : `Saved — ${ids.length} out at Vinny’s.`
  }

  // ── Manual form (no schedule found) ──────────────────────
  function renderManualForm() {
    setTitle('Add Match Result')
    const opts = _members.map(m => `<option value="${m.id}">${m.full_name}</option>`).join('')
    setScreen(`
      <div class="alert alert-info" style="margin-bottom:1rem;font-size:0.83rem;">No upcoming schedule found — enter manually.</div>
      <div id="manual-alert" class="alert hidden"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1rem;">
        <div class="form-group" style="margin:0;"><label for="m-week-label">Week Label</label>
          <input type="text" id="m-week-label" class="form-input" value="${_weekLabel}" placeholder="e.g. Week 20"></div>
        <div class="form-group" style="margin:0;"><label for="m-played-on">Date Played</label>
          <input type="date" id="m-played-on" class="form-input" value="${new Date().toISOString().split('T')[0]}"></div>
      </div>
      <div class="admin-grid">
        <div class="team-block">
          <div class="team-block-title">Team 1</div>
          <div class="form-group"><label>Player 1</label><select id="m-t1p1" class="form-input"><option value="">— select —</option>${opts}</select></div>
          <div class="form-group"><label>Player 2</label><select id="m-t1p2" class="form-input"><option value="">— select —</option>${opts}</select></div>
          <div class="form-group"><label>Set Scores</label>
            <div class="set-scores-group">
              <div><label style="font-size:0.75rem;color:var(--gray-600);">Set 1</label><input type="number" id="m-t1s1" class="form-input" min="0" max="7" placeholder="0–7"></div>
              <div><label style="font-size:0.75rem;color:var(--gray-600);">Set 2</label><input type="number" id="m-t1s2" class="form-input" min="0" max="7" placeholder="0–7"></div>
              <div><label style="font-size:0.75rem;color:var(--gray-600);">Set 3</label><input type="number" id="m-t1s3" class="form-input" min="0" max="7" placeholder="opt."></div>
            </div>
          </div>
        </div>
        <div class="team-block">
          <div class="team-block-title">Team 2</div>
          <div class="form-group"><label>Player 1</label><select id="m-t2p1" class="form-input"><option value="">— select —</option>${opts}</select></div>
          <div class="form-group"><label>Player 2</label><select id="m-t2p2" class="form-input"><option value="">— select —</option>${opts}</select></div>
          <div class="form-group"><label>Set Scores</label>
            <div class="set-scores-group">
              <div><label style="font-size:0.75rem;color:var(--gray-600);">Set 1</label><input type="number" id="m-t2s1" class="form-input" min="0" max="7" placeholder="0–7"></div>
              <div><label style="font-size:0.75rem;color:var(--gray-600);">Set 2</label><input type="number" id="m-t2s2" class="form-input" min="0" max="7" placeholder="0–7"></div>
              <div><label style="font-size:0.75rem;color:var(--gray-600);">Set 3</label><input type="number" id="m-t2s3" class="form-input" min="0" max="7" placeholder="opt."></div>
            </div>
          </div>
        </div>
      </div>
      <div id="m-preview" class="alert alert-info hidden" style="margin-top:0.5rem;font-size:0.85rem;"></div>`,
    `<button id="manual-cancel" class="btn btn-secondary">Cancel</button>
     <button id="manual-save"   class="btn btn-primary">Save Result</button>`)

    ;['m-t1s1','m-t1s2','m-t1s3','m-t2s1','m-t2s2','m-t2s3'].forEach(id =>
      document.getElementById(id)?.addEventListener('input', () => {
        const t1s1=getNum('m-t1s1'),t1s2=getNum('m-t1s2'),t1s3=getNum('m-t1s3')
        const t2s1=getNum('m-t2s1'),t2s2=getNum('m-t2s2'),t2s3=getNum('m-t2s3')
        const p = document.getElementById('m-preview')
        if (t1s1===null||t1s2===null||t2s1===null||t2s2===null){p.classList.add('hidden');return}
        const t1won = isWinner(t1s1,t1s2,t1s3,t2s1,t2s2,t2s3)
        p.classList.remove('hidden')
        p.innerHTML=`<strong>Team 1:</strong> ${fmt(matchScore(t1s1,t1s2,t1s3,t2s1,t2s2,t2s3))} ${t1won?'✓ WIN':'loss'} &nbsp;|&nbsp; <strong>Team 2:</strong> ${fmt(matchScore(t2s1,t2s2,t2s3,t1s1,t1s2,t1s3))} ${!t1won?'✓ WIN':'loss'}`
      }))

    document.getElementById('manual-cancel').addEventListener('click', closeModal)
    document.getElementById('manual-save').addEventListener('click', async () => {
      const alertEl = document.getElementById('manual-alert')
      const wl = document.getElementById('m-week-label').value.trim()
      const po = document.getElementById('m-played-on').value
      const t1p1=document.getElementById('m-t1p1').value, t1p2=document.getElementById('m-t1p2').value
      const t2p1=document.getElementById('m-t2p1').value, t2p2=document.getElementById('m-t2p2').value
      const t1s1=getNum('m-t1s1'),t1s2=getNum('m-t1s2'),t1s3=getNum('m-t1s3')
      const t2s1=getNum('m-t2s1'),t2s2=getNum('m-t2s2'),t2s3=getNum('m-t2s3')
      const showErr = msg => { alertEl.textContent=msg; alertEl.className='alert alert-error'; alertEl.classList.remove('hidden') }
      if (!wl) return showErr('Please enter a week label.')
      if (!po) return showErr('Please enter the date.')
      if (!t1p1||!t1p2) return showErr('Please select both players for Team 1.')
      if (!t2p1||!t2p2) return showErr('Please select both players for Team 2.')
      if (new Set([t1p1,t1p2,t2p1,t2p2]).size!==4) return showErr('Each player can only appear once.')
      if (t1s1===null||t1s2===null||t2s1===null||t2s2===null) return showErr('Please enter Set 1 and Set 2 for both teams.')
      if (!confirmIfWarmUpWeek(po)) return

      const btn = document.getElementById('manual-save')
      btn.disabled=true; btn.textContent='Saving…'
      const { error } = await supabase.from('matches').insert({
        week_label:wl, played_on:po, season:CURRENT_SEASON,
        team1_player1:t1p1, team1_player2:t1p2, team2_player1:t2p1, team2_player2:t2p2,
        team1_set1:t1s1, team1_set2:t1s2, team1_set3:t1s3, team2_set1:t2s1, team2_set2:t2s2, team2_set3:t2s3
      })
      btn.disabled=false; btn.textContent='Save Result'
      if (error) return showErr(friendlyInsertError(error))
      closeModal(); loadResults(_activeSeason, { refresh: true })
    })
  }

  // ── Season dropdown (derived from the matches cached by loadResults) ─
  function populateSeasonDropdown() {
    const seasons = knownSeasons()
    if (seasons.length === 0) return
    const options = [seasons[0], 'all', ...seasons.slice(1)]
    seasonSelect.innerHTML = options.map(s => {
      if (s === 'all') return `<option value="all"${_activeSeason === 'all' ? ' selected' : ''}>Entire History</option>`
      return `<option value="${s}"${s === _activeSeason ? ' selected' : ''}>${s}${s === CURRENT_SEASON ? ' (Current)' : ''}</option>`
    }).join('')
    if (!seasons.includes(_activeSeason) && _activeSeason !== 'all') {
      _activeSeason = seasons[0] || CURRENT_SEASON
      seasonSelect.value = _activeSeason
    }
  }

  seasonSelect.addEventListener('change', () => {
    _activeSeason = seasonSelect.value
    localStorage.setItem('activeSeason', _activeSeason)
    loadResults(_activeSeason)
  })

  async function init() {
    const requested = _activeSeason
    await loadResults(_activeSeason)
    populateSeasonDropdown()
    // If the saved season no longer exists, populateSeasonDropdown fell back
    // to the newest one — re-render from cache (instant, no refetch).
    if (_activeSeason !== requested) loadResults(_activeSeason)
  }
  init()
</script>
</body>
</html>
