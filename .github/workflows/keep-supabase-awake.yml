name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Snapshot database to backups/
        continue-on-error: true
        run: python3 scripts/backup-data.py

      - name: Commit the snapshot if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain backups/)" ]; then
            git add backups/
            git commit -m "chore: data snapshot $(date -u +%Y-%m-%d)"
            git push
            echo "Snapshot committed."
          else
            echo "No data changes since the last snapshot."
            last=$(git log -1 --format=%ct)
            days=$(( ($(date +%s) - last) / 86400 ))
            echo "Last commit was $days day(s) ago."
            if [ "$days" -ge 50 ]; then
              git commit --allow-empty -m "chore: keep scheduled workflows active"
              git push
            fi
          fi

      - name: Ping the database
        run: |
          curl -sf --max-time 20 \
            -H "apikey: sb_publishable_9MZLbcTj078P71YXuvO4SA_qW4tF0KF" \
            "https://htmrvfkaudpevmzgteyh.supabase.co/rest/v1/members?select=id&limit=1" \
            -o /dev/null
          echo "Database responded — still awake."
