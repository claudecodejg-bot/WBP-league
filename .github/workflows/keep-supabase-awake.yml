# Keeps the league's free-tier Supabase project from auto-pausing.
#
# Free projects pause after ~7 days with no API activity, and a paused
# project's hostname stops resolving entirely — which is what takes the
# Standings / Players / Results tabs offline until someone clicks
# "Restore project" in the Supabase dashboard.
#
# This runs on GitHub's servers, so it works whether or not any computer
# is switched on. If the ping fails, the run goes red and GitHub emails
# the repo owner — that email is the early warning that the database is
# paused or unreachable.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 */3 * *'   # every 3 days, 09:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # GitHub disables scheduled workflows after 60 days without repo
      # activity — exactly the quiet off-season this workflow exists for.
      # An empty commit every ~50 quiet days keeps the schedule running.
      # This runs BEFORE the ping so it still happens even when the
      # database is down and the ping step fails.
      - name: Keep this schedule enabled during quiet stretches
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "Last commit was $days day(s) ago."
          if [ "$days" -ge 50 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflows active"
            git push
          fi

      # Runs last so a failure here doesn't skip the step above.
      # The key is the same public publishable key already shipped in the
      # site's JavaScript — it is not a secret.
      - name: Ping the database
        run: |
          curl -sf --max-time 20 \
            -H "apikey: sb_publishable_9MZLbcTj078P71YXuvO4SA_qW4tF0KF" \
            "https://htmrvfkaudpevmzgteyh.supabase.co/rest/v1/members?select=id&limit=1" \
            -o /dev/null
          echo "Database responded — still awake."
