<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — WBP League</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ---- Calendar page ---- */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .cal-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--green-dark);
    }
    .cal-nav-btn {
      background: var(--white);
      border: 1px solid var(--gray-400);
      border-radius: var(--radius);
      width: 36px;
      height: 36px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray-800);
      transition: background 0.15s, border-color 0.15s;
    }
    .cal-nav-btn:hover { background: var(--gray-100); border-color: var(--accent); }

    /* Grid */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .cal-day-header {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gray-600);
      padding: 0.4rem 0;
    }
    .cal-cell {
      min-height: 72px;
      background: var(--white);
      border-radius: var(--radius);
      padding: 0.4rem 0.45rem;
      cursor: default;
      border: 2px solid transparent;
      transition: border-color 0.15s, box-shadow 0.15s;
      position: relative;
    }
    .cal-cell.other-month {
      background: transparent;
      border-color: transparent;
    }
    .cal-cell.other-month .cal-date-num { color: var(--gray-400); }
    .cal-cell.has-content {
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .cal-cell.has-content:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-lg);
    }
    .cal-cell.is-today {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(244,132,95,0.25);
    }
    .cal-cell.is-selected {
      border-color: var(--green-dark);
      box-shadow: var(--shadow-lg);
    }

    .cal-date-num {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gray-800);
      line-height: 1;
      margin-bottom: 0.3rem;
    }
    .cal-cell.is-today .cal-date-num {
      background: var(--accent);
      color: var(--white);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    /* Match dot / pill inside cell */
    .cal-match-pill {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      background: var(--green-pale);
      border-radius: 4px;
      padding: 0.15rem 0.3rem;
      margin-bottom: 0.2rem;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--green-dark);
      line-height: 1.2;
      overflow: hidden;
    }
    .cal-match-pill.win  { background: #d4edda; color: #155724; }
    .cal-match-pill.loss { background: #f8d7da; color: #721c24; }
    .cal-match-pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .win  .cal-match-pill-dot { background: #2b7a3d; }
    .loss .cal-match-pill-dot { background: #dc3545; }
    .cal-match-pill-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Upcoming pill */
    .cal-upcoming-pill {
      background: var(--accent);
      color: var(--white);
      border-radius: 4px;
      padding: 0.15rem 0.3rem;
      font-size: 0.62rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.2rem;
    }

    /* More indicator */
    .cal-more {
      font-size: 0.62rem;
      color: var(--gray-600);
      font-weight: 600;
      margin-top: 0.1rem;
    }

    /* Detail panel */
    .cal-detail-panel {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 1.25rem 1.5rem;
      margin-top: 1rem;
      border-left: 4px solid var(--accent);
      animation: slideDown 0.18s ease;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cal-detail-date {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gray-600);
      margin-bottom: 0.85rem;
    }

    /* Compact match card inside panel */
    .cal-match-card {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--gray-200);
    }
    .cal-match-card:last-child { border-bottom: none; }
    .cal-match-team { font-size: 0.9rem; font-weight: 700; line-height: 1.3; }
    .cal-match-team.right { text-align: right; }
    .cal-match-team.won  { color: var(--green-dark); }
    .cal-match-team.lost { color: var(--gray-600); }
    .cal-match-sets {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gray-800);
      white-space: nowrap;
    }
    .cal-match-week {
      font-size: 0.72rem;
      color: var(--gray-600);
      margin-bottom: 0.5rem;
    }

    /* Upcoming detail */
    .cal-upcoming-detail {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: linear-gradient(135deg, var(--accent) 0%, var(--green-light) 100%);
      border-radius: var(--radius);
      color: var(--white);
    }
    .cal-upcoming-detail-icon { font-size: 1.75rem; }
    .cal-upcoming-detail-info { flex: 1; }
    .cal-upcoming-detail-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.85;
      margin-bottom: 0.2rem;
    }
    .cal-upcoming-detail-teams {
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.3;
    }
    .cal-upcoming-detail-meta {
      font-size: 0.8rem;
      opacity: 0.85;
      margin-top: 0.2rem;
    }

    /* Legend */
    .cal-legend {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
      font-size: 0.78rem;
      color: var(--gray-600);
    }
    .cal-legend-item { display: flex; align-items: center; gap: 0.35rem; }
    .cal-legend-dot {
      width: 10px; height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    @media (max-width: 640px) {
      .cal-cell { min-height: 52px; padding: 0.25rem; }
      .cal-match-pill { display: none; }
      .cal-cell.has-content::after {
        content: '';
        display: block;
        width: 6px; height: 6px;
        background: var(--accent);
        border-radius: 50%;
        margin: 0 auto;
      }
      .cal-cell.is-today::after { background: var(--white); }
      .cal-upcoming-pill { font-size: 0.55rem; padding: 0.1rem 0.2rem; }
      .cal-match-card { grid-template-columns: 1fr; text-align: left; }
      .cal-match-team.right { text-align: left; }
      .cal-match-sets { text-align: left; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand"><img src="wbp-logo.png" alt="WBP"><span>WBP</span> League</a>
  <ul class="nav-links">
    <li><a href="standings.html"    data-page="standings">Standings</a></li>
    <li><a href="results.html"      data-page="results">Results</a></li>
    <li><a href="player.html"       data-page="player">Players</a></li>
    <li><a href="matchups.html"     data-page="matchups">Matchups</a></li>
    <li><a href="availability.html" data-page="availability">Availability</a></li>
    <li><a href="calendar.html"     data-page="calendar" class="active">Calendar</a></li>
    <li><a href="golf.html"         data-page="golf">Golf</a></li>
  </ul>
  <button id="nav-hamburger" aria-label="Open menu" aria-expanded="false">&#9776;</button>
  <button id="nav-auth-btn">Sign In</button>
</nav>
<script>
  (function () {
    var btn = document.getElementById('nav-hamburger')
    btn.addEventListener('click', function () {
      var open = btn.closest('nav').classList.toggle('nav-open')
      btn.textContent = open ? '\u2715' : '\u2630'
      btn.setAttribute('aria-expanded', open)
    })
    document.querySelectorAll('.nav-links a').forEach(function (a) {
      a.addEventListener('click', function () {
        btn.closest('nav').classList.remove('nav-open')
        btn.textContent = '\u2630'
        btn.setAttribute('aria-expanded', 'false')
      })
    })
  })()
</script>

<main>
  <h1 class="page-title">Season Calendar</h1>
  <p class="page-subtitle">Match results by date. Click any highlighted day for details.</p>

  <!-- Calendar header -->
  <div class="cal-header">
    <button class="cal-nav-btn" id="cal-prev" aria-label="Previous month">&#8592;</button>
    <div class="cal-title" id="cal-month-label">…</div>
    <button class="cal-nav-btn" id="cal-next" aria-label="Next month">&#8594;</button>
  </div>

  <!-- Day-of-week headers -->
  <div class="cal-grid" id="cal-dow-row">
    <div class="cal-day-header">Sun</div>
    <div class="cal-day-header">Mon</div>
    <div class="cal-day-header">Tue</div>
    <div class="cal-day-header">Wed</div>
    <div class="cal-day-header">Thu</div>
    <div class="cal-day-header">Fri</div>
    <div class="cal-day-header">Sat</div>
  </div>

  <!-- Calendar grid (filled by JS) -->
  <div class="cal-grid" id="cal-grid" style="margin-top:4px;"></div>

  <!-- Detail panel (appears on click) -->
  <div id="cal-detail" style="display:none;"></div>

  <!-- Legend -->
  <div class="cal-legend">
    <div class="cal-legend-item">
      <div class="cal-legend-dot" style="background:#d4edda;border:1px solid #2b7a3d;"></div> Win
    </div>
    <div class="cal-legend-item">
      <div class="cal-legend-dot" style="background:#f8d7da;border:1px solid #dc3545;"></div> Loss
    </div>
    <div class="cal-legend-item">
      <div class="cal-legend-dot" style="background:var(--accent);"></div> Upcoming
    </div>
    <div class="cal-legend-item">
      <div class="cal-legend-dot" style="background:var(--white);border:2px solid var(--accent);"></div> Today
    </div>
  </div>
</main>

<footer>WBP League &copy; <span id="footer-year"></span></footer>

<script type="module">
  import { initNav } from './js/auth.js'
  import { supabase } from './js/supabase-client.js'
  import { isWinner } from './js/scoring.js'

  document.getElementById('footer-year').textContent = new Date().getFullYear()
  initNav('calendar')

  // ── Upcoming match (hardcoded until stored in DB) ──────────────────────
  const UPCOMING = {
    date: '2026-03-02',   // today
    time: '7:00 PM',
    court: 'Court 1 — Woodway',
    teams: 'Grills & Napolitano vs Jonson & McGurren'
  }

  // ── State ──────────────────────────────────────────────────────────────
  const today = new Date()
  today.setHours(0, 0, 0, 0)
  let viewYear  = today.getFullYear()
  let viewMonth = today.getMonth()   // 0-indexed
  let selectedKey = null             // 'YYYY-MM-DD' of selected cell

  let matchesByDate = {}   // keyed by 'YYYY-MM-DD'
  let memberMap     = {}

  // ── Load data ──────────────────────────────────────────────────────────
  const [membersRes, matchesRes] = await Promise.all([
    supabase.from('members').select('id, full_name'),
    supabase.from('matches').select('*').order('played_on', { ascending: true })
  ])

  if (!membersRes.error) {
    memberMap = Object.fromEntries(membersRes.data.map(m => [m.id, m.full_name]))
  }

  if (!matchesRes.error) {
    for (const m of matchesRes.data) {
      const key = m.played_on   // already 'YYYY-MM-DD'
      if (!matchesByDate[key]) matchesByDate[key] = []
      matchesByDate[key].push(m)
    }
  }

  // ── Render calendar ────────────────────────────────────────────────────
  function renderCalendar() {
    const label   = new Date(viewYear, viewMonth, 1)
      .toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
    document.getElementById('cal-month-label').textContent = label

    const grid    = document.getElementById('cal-grid')
    grid.innerHTML = ''

    const firstDay = new Date(viewYear, viewMonth, 1).getDay()  // 0=Sun
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate()
    const daysInPrev  = new Date(viewYear, viewMonth, 0).getDate()

    const todayKey    = toKey(today)
    const upcomingKey = UPCOMING.date

    // Fill leading blanks from previous month
    for (let i = 0; i < firstDay; i++) {
      const day = daysInPrev - firstDay + 1 + i
      grid.appendChild(makeCell(viewYear, viewMonth - 1, day, true, todayKey, upcomingKey))
    }

    // Current month days
    for (let d = 1; d <= daysInMonth; d++) {
      grid.appendChild(makeCell(viewYear, viewMonth, d, false, todayKey, upcomingKey))
    }

    // Fill trailing blanks from next month
    const total = firstDay + daysInMonth
    const trailing = total % 7 === 0 ? 0 : 7 - (total % 7)
    for (let d = 1; d <= trailing; d++) {
      grid.appendChild(makeCell(viewYear, viewMonth + 1, d, true, todayKey, upcomingKey))
    }

    // Re-apply selection highlight
    if (selectedKey) {
      const sel = grid.querySelector(`[data-key="${selectedKey}"]`)
      if (sel) sel.classList.add('is-selected')
    }
  }

  function makeCell(year, month, day, otherMonth, todayKey, upcomingKey) {
    // Normalize month/year for overflow
    const d    = new Date(year, month, day)
    const key  = toKey(d)
    const matches  = matchesByDate[key] || []
    const isToday  = key === todayKey
    const isUpcoming = key === upcomingKey

    const cell = document.createElement('div')
    cell.className = 'cal-cell' + (otherMonth ? ' other-month' : '')
    cell.dataset.key = key
    if (isToday) cell.classList.add('is-today')

    // Date number
    const numEl = document.createElement('div')
    numEl.className = 'cal-date-num'
    numEl.textContent = day
    cell.appendChild(numEl)

    let hasContent = false

    // Upcoming match pill
    if (isUpcoming && !otherMonth) {
      hasContent = true
      const up = document.createElement('div')
      up.className = 'cal-upcoming-pill'
      up.textContent = '🎾 Upcoming'
      cell.appendChild(up)
    }

    // Past match pills (show up to 2, then "+n more")
    if (matches.length > 0 && !otherMonth) {
      hasContent = true
      const toShow = matches.slice(0, 2)
      for (const m of toShow) {
        const t1won = isWinner(m.team1_set1, m.team1_set2, m.team1_set3,
                               m.team2_set1, m.team2_set2, m.team2_set3)
        const pill = document.createElement('div')
        pill.className = 'cal-match-pill ' + (t1won ? 'win' : 'loss')
        const dot  = document.createElement('span')
        dot.className = 'cal-match-pill-dot'
        const txt  = document.createElement('span')
        txt.className = 'cal-match-pill-text'
        txt.textContent = m.week_label || '—'
        pill.appendChild(dot)
        pill.appendChild(txt)
        cell.appendChild(pill)
      }
      if (matches.length > 2) {
        const more = document.createElement('div')
        more.className = 'cal-more'
        more.textContent = `+${matches.length - 2} more`
        cell.appendChild(more)
      }
    }

    if (hasContent) {
      cell.classList.add('has-content')
      cell.addEventListener('click', () => onCellClick(key, d, matches, isUpcoming))
    }

    return cell
  }

  // ── Cell click → detail panel ──────────────────────────────────────────
  function onCellClick(key, date, matches, isUpcoming) {
    const panel = document.getElementById('cal-detail')

    // Deselect previous
    document.querySelectorAll('.cal-cell.is-selected')
      .forEach(el => el.classList.remove('is-selected'))

    // Toggle off if same cell clicked again
    if (selectedKey === key) {
      selectedKey = null
      panel.style.display = 'none'
      return
    }
    selectedKey = key
    document.querySelector(`[data-key="${key}"]`)?.classList.add('is-selected')

    const dateStr = date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })

    let html = `<div class="cal-detail-panel">
      <div class="cal-detail-date">📅 ${dateStr}</div>`

    // Upcoming section
    if (isUpcoming) {
      html += `
        <div class="cal-upcoming-detail">
          <div class="cal-upcoming-detail-icon">🎾</div>
          <div class="cal-upcoming-detail-info">
            <div class="cal-upcoming-detail-label">Upcoming Match</div>
            <div class="cal-upcoming-detail-teams">${UPCOMING.teams}</div>
            <div class="cal-upcoming-detail-meta">${UPCOMING.court} &nbsp;·&nbsp; ${UPCOMING.time}</div>
          </div>
        </div>`
      if (matches.length > 0) html += '<div style="margin-top:1rem;"></div>'
    }

    // Past matches
    for (const m of matches) {
      const t1won = isWinner(m.team1_set1, m.team1_set2, m.team1_set3,
                             m.team2_set1, m.team2_set2, m.team2_set3)
      const t2won = !t1won

      const t1names = [
        memberMap[m.team1_player1] || '?',
        memberMap[m.team1_player2] || '?'
      ].join(' & ')
      const t2names = [
        memberMap[m.team2_player1] || '?',
        memberMap[m.team2_player2] || '?'
      ].join(' & ')

      const sets = []
      if (m.team1_set1 != null) sets.push(`${m.team1_set1}–${m.team2_set1}`)
      if (m.team1_set2 != null) sets.push(`${m.team1_set2}–${m.team2_set2}`)
      if (m.team1_set3 != null) sets.push(`${m.team1_set3}–${m.team2_set3}`)

      html += `
        <div class="cal-match-week">${m.week_label}</div>
        <div class="cal-match-card">
          <div class="cal-match-team ${t1won ? 'won' : 'lost'}">
            ${t1won ? '🏆 ' : ''}${t1names}
          </div>
          <div class="cal-match-sets">${sets.join(', ')}</div>
          <div class="cal-match-team right ${t2won ? 'won' : 'lost'}">
            ${t2won ? '🏆 ' : ''}${t2names}
          </div>
        </div>`
    }

    html += '</div>'
    panel.innerHTML  = html
    panel.style.display = 'block'
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
  }

  // ── Month navigation ───────────────────────────────────────────────────
  document.getElementById('cal-prev').addEventListener('click', () => {
    viewMonth--
    if (viewMonth < 0) { viewMonth = 11; viewYear-- }
    selectedKey = null
    document.getElementById('cal-detail').style.display = 'none'
    renderCalendar()
  })
  document.getElementById('cal-next').addEventListener('click', () => {
    viewMonth++
    if (viewMonth > 11) { viewMonth = 0; viewYear++ }
    selectedKey = null
    document.getElementById('cal-detail').style.display = 'none'
    renderCalendar()
  })

  // ── Helpers ────────────────────────────────────────────────────────────
  function toKey(d) {
    const y  = d.getFullYear()
    const mo = String(d.getMonth() + 1).padStart(2, '0')
    const dy = String(d.getDate()).padStart(2, '0')
    return `${y}-${mo}-${dy}`
  }

  // ── Initial render ─────────────────────────────────────────────────────
  renderCalendar()

  // Auto-open today's detail if it has content
  const todayKey = toKey(today)
  const todayMatches = matchesByDate[todayKey] || []
  const todayIsUpcoming = todayKey === UPCOMING.date
  if (todayMatches.length > 0 || todayIsUpcoming) {
    onCellClick(todayKey, today, todayMatches, todayIsUpcoming)
  }
</script>
</body>
</html>
