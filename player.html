<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Stats — Paddle Tennis League</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand"><img src="wbp-logo.png" alt="WBP"><span>WBP</span> League</a>
  <ul class="nav-links">
    <li><a href="championship.html" data-page="championship">Championship</a></li>
    <li><a href="standings.html" data-page="standings">Standings</a></li>
    <li><a href="results.html"   data-page="results">Results</a></li>
    <li><a href="player.html"    data-page="player">Players</a></li>
    <li><a href="matchups.html"  data-page="matchups">Matchups</a></li>
    <li><a href="availability.html" data-page="availability">Availability</a></li>
    <li><a href="suggestions.html"  data-page="suggestions">Suggestions</a></li>
    <li><a href="photos.html"       data-page="photos">Photos</a></li>
    <li><a href="golf.html?v=2"         data-page="golf">Golf</a></li>
  </ul>
  <button id="nav-hamburger" aria-label="Open menu" aria-expanded="false">&#9776;</button>
  <button id="nav-auth-btn">Sign In</button>
</nav>
<script>
  (function () {
    var btn = document.getElementById('nav-hamburger')
    btn.addEventListener('click', function () {
      var open = btn.closest('nav').classList.toggle('nav-open')
      btn.textContent = open ? '\u2715' : '\u2630'
      btn.setAttribute('aria-expanded', open)
    })
    document.querySelectorAll('.nav-links a').forEach(function (a) {
      a.addEventListener('click', function () {
        btn.closest('nav').classList.remove('nav-open')
        btn.textContent = '\u2630'
        btn.setAttribute('aria-expanded', 'false')
      })
    })
  })()
</script>

<main>
  <h1 class="page-title">Player Stats</h1>
  <p class="page-subtitle">Select a player to see their summary and match history.</p>

  <div class="season-bar">
    <label for="season-select">Season:</label>
    <select id="season-select"></select>
  </div>

  <div class="card">
    <div class="form-group" style="margin-bottom:0;">
      <label for="player-select">Select Player</label>
      <select id="player-select">
        <option value="">— Choose a player —</option>
      </select>
    </div>
  </div>

  <div id="player-container"></div>
</main>

<footer>WBP League &copy; <span id="footer-year"></span></footer>

<script type="module">
  import { initNav } from './js/auth.js'
  import { supabase } from './js/supabase-client.js'
  import { computeMemberStats, computeCurrentSeasonStats, isWinner, matchScore, seasonAverage, fmt } from './js/scoring.js'

  document.getElementById('footer-year').textContent = new Date().getFullYear()
  initNav('player')

  const CURRENT_SEASON = '2025-26'
  const seasonSelect   = document.getElementById('season-select')
  let _activeSeason    = localStorage.getItem('activeSeason') || CURRENT_SEASON

  let allMembers       = []
  let allMatches       = []
  let allMatchesData   = []   // full unfiltered match list (all seasons)
  let allMemberSeasons = []   // [{ member_id, season }] — from member_seasons table

  // ── Season dropdown ─────────────────────────────────────────────────────
  async function populateSeasonDropdown() {
    const { data } = await supabase.from('matches').select('season')
    if (!data) return
    const seasons = [...new Set(data.map(m => m.season))].sort().reverse()
    const options = [seasons[0], 'all', ...seasons.slice(1)]
    seasonSelect.innerHTML = options.map(s => {
      if (s === 'all') return `<option value="all"${_activeSeason === 'all' ? ' selected' : ''}>Entire History</option>`
      return `<option value="${s}"${s === _activeSeason ? ' selected' : ''}>${s}${s === CURRENT_SEASON ? ' (Current)' : ''}</option>`
    }).join('')
    if (!seasons.includes(_activeSeason) && _activeSeason !== 'all') {
      _activeSeason = seasons[0] || CURRENT_SEASON
      seasonSelect.value = _activeSeason
    }
  }

  seasonSelect.addEventListener('change', () => {
    _activeSeason = seasonSelect.value
    localStorage.setItem('activeSeason', _activeSeason)
    document.getElementById('player-container').innerHTML = ''
    loadSeasonData()
  })

  // ── Load season-filtered matches + rebuild player dropdown ───────────────
  async function loadSeasonData() {
    const matchesRes = await supabase.from('matches').select('*').order('played_on', { ascending: false })

    if (matchesRes.error) {
      document.getElementById('player-container').innerHTML =
        '<div class="alert alert-error">Failed to load data. Please try again.</div>'
      return
    }

    allMatchesData = matchesRes.data
    allMatches = _activeSeason === 'all'
      ? allMatchesData
      : allMatchesData.filter(m => m.season === _activeSeason)

    // Determine which season to use as the membership reference:
    //   - specific season → that season's member_seasons rows
    //   - "Entire History" → current season (25-26) as reference
    const refSeason = _activeSeason === 'all' ? CURRENT_SEASON : _activeSeason
    const activeMemberIds = new Set(
      allMemberSeasons.filter(ms => ms.season === refSeason).map(ms => ms.member_id)
    )
    const everMemberIds = new Set(allMemberSeasons.map(ms => ms.member_id))

    function playedInMatches(m) {
      return allMatches.some(
        mx => mx.team1_player1 === m.id || mx.team1_player2 === m.id ||
              mx.team2_player1 === m.id || mx.team2_player2 === m.id
      )
    }

    // Rebuild player dropdown — only players who appear in match data this season
    const select = document.getElementById('player-select')
    const prevVal = select.value
    select.innerHTML = '<option value="">— Choose a player —</option>'

    const activeMembers = allMembers.filter(m =>
      !m.is_guest && activeMemberIds.has(m.id) && playedInMatches(m))
    const formerMembers = allMembers.filter(m =>
      !m.is_guest && !activeMemberIds.has(m.id) && everMemberIds.has(m.id) && playedInMatches(m))
    const guests = allMembers.filter(m =>
      m.is_guest && playedInMatches(m))

    const addGroup = (label, list) => {
      if (list.length === 0) return
      const grp = document.createElement('optgroup')
      grp.label = label
      list.forEach(m => {
        const opt = document.createElement('option')
        opt.value = m.id
        opt.textContent = m.full_name
        grp.appendChild(opt)
      })
      select.appendChild(grp)
    }

    addGroup('Members', activeMembers)
    addGroup('Former Members', formerMembers)
    addGroup('Guests', guests)

    // Restore previously selected player if still present this season
    if (prevVal && [...select.options].some(o => o.value === prevVal)) {
      select.value = prevVal
      showPlayer(prevVal)
    } else {
      // Check URL param (e.g. player.html?id=UUID)
      const preselect = new URLSearchParams(window.location.search).get('id')
      if (preselect && [...select.options].some(o => o.value === preselect)) {
        select.value = preselect
        showPlayer(preselect)
      } else {
        document.getElementById('player-container').innerHTML = ''
      }
    }
  }

  // ── Init ────────────────────────────────────────────────────────────────
  async function init() {
    const [membersRes, seasonsRes] = await Promise.all([
      supabase.from('members').select('id, full_name, is_guest').order('full_name'),
      supabase.from('member_seasons').select('member_id, season')
    ])

    if (membersRes.error) {
      document.getElementById('player-container').innerHTML =
        '<div class="alert alert-error">Failed to load data. Please try again.</div>'
      return
    }

    allMembers       = membersRes.data
    allMemberSeasons = seasonsRes.data || []

    const select = document.getElementById('player-select')
    select.addEventListener('change', () => {
      if (select.value) showPlayer(select.value)
      else document.getElementById('player-container').innerHTML = ''
    })

    await populateSeasonDropdown()
    await loadSeasonData()
  }

  // ── Streak ──────────────────────────────────────────────────────────────
  function calcStreak(playerMatches, memberId) {
    const sorted = [...playerMatches].sort((a, b) => a.played_on.localeCompare(b.played_on))
    if (sorted.length === 0) return null
    const results = sorted.map(m => {
      const onTeam1 = m.team1_player1 === memberId || m.team1_player2 === memberId
      const won = onTeam1
        ? isWinner(m.team1_set1, m.team1_set2, m.team1_set3, m.team2_set1, m.team2_set2, m.team2_set3)
        : isWinner(m.team2_set1, m.team2_set2, m.team2_set3, m.team1_set1, m.team1_set2, m.team1_set3)
      return won ? 'W' : 'L'
    })
    const last = results[results.length - 1]
    let count = 0
    for (let i = results.length - 1; i >= 0; i--) {
      if (results[i] === last) count++
      else break
    }
    return { type: last, count }
  }

  // ── Sparkline ───────────────────────────────────────────────────────────
  function buildSparkline(pts, label) {
    if (pts.length < 2) return ''
    const rawMin = Math.min(...pts), rawMax = Math.max(...pts)
    const yMin = Math.floor(rawMin / 2) * 2
    const yMax = Math.ceil(rawMax / 2) * 2
    const range = yMax - yMin || 2

    const W = 700, H = 100, padL = 38, padR = 12, padT = 12, padB = 12
    const plotW = W - padL - padR
    const plotH = H - padT - padB

    const gridValues = []
    for (let v = yMin; v <= yMax; v += 2) gridValues.push(v)
    const gridLines = gridValues.map(v => {
      const y = (padT + (1 - (v - yMin) / range) * plotH).toFixed(1)
      return `
        <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#e9ecef" stroke-width="1"/>
        <text x="${padL - 5}" y="${y}" text-anchor="end" font-size="10" fill="#6c757d" dominant-baseline="middle">${v}</text>`
    }).join('')

    const coords = pts.map((s, i) => ({
      x: (padL + (i / (pts.length - 1)) * plotW).toFixed(1),
      y: (padT + (1 - (s - yMin) / range) * plotH).toFixed(1)
    }))

    const polyline = coords.map(c => `${c.x},${c.y}`).join(' ')
    const circles  = coords.map(c => `<circle cx="${c.x}" cy="${c.y}" r="4" fill="var(--accent)" stroke="white" stroke-width="1.5"/>`).join('')

    return `
      <div class="sparkline-wrap">
        <div class="sparkline-label">${label}</div>
        <svg width="100%" viewBox="0 0 ${W} ${H}" class="sparkline-svg" preserveAspectRatio="none">
          ${gridLines}
          <polyline points="${polyline}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
          ${circles}
        </svg>
      </div>`
  }

  // ── Counter animations ──────────────────────────────────────────────────
  function animateCounters() {
    document.querySelectorAll('#player-container .stat-value[data-target]').forEach(el => {
      const target = parseFloat(el.dataset.target)
      const isDecimal = el.dataset.decimal === 'true'
      const duration = 700
      const start = performance.now()
      function step(now) {
        const progress = Math.min((now - start) / duration, 1)
        const eased = 1 - Math.pow(1 - progress, 3)
        const value = target * eased
        el.textContent = isDecimal ? value.toFixed(2) : Math.round(value)
        if (progress < 1) requestAnimationFrame(step)
      }
      requestAnimationFrame(step)
    })
  }

  // ── Show player ─────────────────────────────────────────────────────────
  function showPlayer(memberId) {
    const container  = document.getElementById('player-container')
    const memberMap  = Object.fromEntries(allMembers.map(m => [m.id, m.full_name]))
    const priorMatches = allMatchesData.filter(m => m.season !== CURRENT_SEASON)
    const stats = _activeSeason === CURRENT_SEASON
      ? computeCurrentSeasonStats(memberId, allMatches, priorMatches)
      : computeMemberStats(memberId, allMatches)
    const avgLabel   = _activeSeason === 'all' ? 'Overall Avg' : 'Season Avg'

    const playerMatches = allMatches.filter(m =>
      m.team1_player1 === memberId || m.team1_player2 === memberId ||
      m.team2_player1 === memberId || m.team2_player2 === memberId
    )

    const streak = calcStreak(playerMatches, memberId)
    const streakBadge = streak && streak.type === 'W' && streak.count >= 2
      ? `<span class="streak-badge streak-win">🔥 ${streak.count}W</span>`
      : ''

    // Stats summary card
    let html = `
      <div class="card">
        <div class="player-stats-grid">
          <div class="stat-box">
            <div class="stat-value" data-target="${stats.matchesPlayed}">0</div>
            <div class="stat-label">Played</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" data-target="${stats.wins}">0</div>
            <div class="stat-label">Won</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" data-target="${stats.losses}">0</div>
            <div class="stat-label">Lost</div>
          </div>
          <div class="stat-box stat-box-highlight">
            <div class="stat-value" data-target="${stats.seasonAvg}" data-decimal="true">0.00</div>
            <div class="stat-label">${avgLabel}</div>
          </div>
        </div>
        ${streakBadge ? `<div class="streak-row">Current streak: ${streakBadge}</div>` : ''}
        ${(() => {
          const chronological = [...stats.matchScores].reverse()
          const avgPts = chronological.map((_, i) => seasonAverage(chronological.slice(0, i + 1)))
          const chartLabel = _activeSeason === 'all' ? 'Career Average' : 'Season Average'
          return buildSparkline(avgPts, chartLabel) + buildSparkline(chronological, 'Match Scores')
        })()}
      </div>
    `

    // Match history
    if (playerMatches.length === 0) {
      html += '<p style="color:var(--gray-600);text-align:center;padding:2rem;">No matches found.</p>'
      container.innerHTML = html
      animateCounters()
      return
    }

    // Group by week — include season prefix when viewing Entire History
    const weeks = {}
    for (const m of playerMatches) {
      const key = _activeSeason === 'all'
        ? `${m.season} — ${m.week_label}`
        : m.week_label
      if (!weeks[key]) weeks[key] = []
      weeks[key].push(m)
    }

    html += '<div class="card"><div class="card-title">Match History</div>'

    for (const [weekLabel, weekMatches] of Object.entries(weeks)) {
      html += `<div class="week-section"><div class="week-label">${weekLabel}</div>`

      for (const m of weekMatches) {
        const onTeam1 = m.team1_player1 === memberId || m.team1_player2 === memberId

        const myPartnerId = onTeam1
          ? (m.team1_player1 === memberId ? m.team1_player2 : m.team1_player1)
          : (m.team2_player1 === memberId ? m.team2_player2 : m.team2_player1)
        const opp1Id = onTeam1 ? m.team2_player1 : m.team1_player1
        const opp2Id = onTeam1 ? m.team2_player2 : m.team1_player2

        const partner   = memberMap[myPartnerId] ?? '—'
        const opponents = [memberMap[opp1Id], memberMap[opp2Id]].filter(Boolean).join(' & ')

        const won = onTeam1
          ? isWinner(m.team1_set1, m.team1_set2, m.team1_set3, m.team2_set1, m.team2_set2, m.team2_set3)
          : isWinner(m.team2_set1, m.team2_set2, m.team2_set3, m.team1_set1, m.team1_set2, m.team1_set3)

        const score = onTeam1
          ? matchScore(m.team1_set1, m.team1_set2, m.team1_set3, m.team2_set1, m.team2_set2, m.team2_set3)
          : matchScore(m.team2_set1, m.team2_set2, m.team2_set3, m.team1_set1, m.team1_set2, m.team1_set3)

        const [ms1, ms2, ms3, os1, os2, os3] = onTeam1
          ? [m.team1_set1, m.team1_set2, m.team1_set3, m.team2_set1, m.team2_set2, m.team2_set3]
          : [m.team2_set1, m.team2_set2, m.team2_set3, m.team1_set1, m.team1_set2, m.team1_set3]

        const sets = []
        if (ms1 !== null && os1 !== null) sets.push(`${ms1}–${os1}`)
        if (ms2 !== null && os2 !== null) sets.push(`${ms2}–${os2}`)
        if (ms3 !== null && os3 !== null) sets.push(`${ms3}–${os3}`)
        const setStr = sets.join(', ')

        html += `
          <div class="player-match-row ${won ? 'pmr-won' : 'pmr-lost'}">
            <div class="pmr-result ${won ? 'result-win' : 'result-loss'}">${won ? 'W' : 'L'}</div>
            <div class="pmr-detail">
              <div class="pmr-teams">with <strong>${partner}</strong> vs <strong>${opponents}</strong></div>
              <div class="pmr-sets">${setStr}</div>
            </div>
            <div class="pmr-score">${fmt(score)}</div>
          </div>
        `
      }

      html += '</div>'
    }

    html += '</div>'
    container.innerHTML = html
    animateCounters()
  }

  init()
</script>
</body>
</html>
