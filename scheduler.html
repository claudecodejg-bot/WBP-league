<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Scheduler — WBP League</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="wbp-logo.png">
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="preconnect" href="https://htmrvfkaudpevmzgteyh.supabase.co" crossorigin>
  <script src="js/nav.js" defer></script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WBP League">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="js/install.js" defer></script>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand"><img src="wbp-logo.png" alt="WBP"><span>WBP</span> League</a>
  <ul class="nav-links">
    <li><a href="championship.html" data-page="championship">Championship</a></li>
    <li><a href="standings.html"    data-page="standings">Standings</a></li>
    <li><a href="results.html"      data-page="results">Results</a></li>
    <li><a href="player.html"       data-page="player">Players</a></li>
    <li><a href="matchups.html"     data-page="matchups">Matchups</a></li>
    <li><a href="availability.html" data-page="availability">Availability</a></li>
    <li><a href="scheduler.html"    data-page="scheduler">Scheduler</a></li>
  </ul>
  <button id="nav-hamburger" aria-label="Open menu" aria-expanded="false">&#9776;</button>
  <button id="nav-auth-btn">Sign In</button>
</nav>

<main>
  <h1 class="page-title">Match Scheduler</h1>
  <p class="page-subtitle">Generate optimal court pairings from availability &amp; match history.</p>

  <div style="max-width:760px;margin:0 auto;padding:0 1rem 3rem;">

    <div class="scheduler-controls card">
      <div class="scheduler-week-row">
        <label for="week-select" class="scheduler-label">Match Night</label>
        <select id="week-select" class="form-input scheduler-select"></select>
      </div>
      <button id="generate-btn" class="btn btn-primary scheduler-generate-btn">Generate Pairings</button>
    </div>

    <div id="scheduler-results"></div>

  </div>
</main>

<!-- Schedule Details Modal -->
<div id="schedule-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Schedule Details</span>
      <button id="modal-close" class="modal-close-btn">&times;</button>
    </div>
    <div class="modal-body">
      <p class="modal-subtitle">Set the location and time for each court.</p>
      <div id="modal-courts"></div>
    </div>
    <div class="modal-footer">
      <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
      <button id="modal-save" class="btn btn-primary">Save Schedule</button>
    </div>
  </div>
</div>

<footer>WBP League &copy; <span id="footer-year"></span></footer>

<script type="module">
  import { requireLogin, getCurrentMember, initNav } from './js/auth.js'
  import { generateSchedule, getUpcomingWeeks, formatWeekLabel } from './js/scheduler.js'
  import { supabase } from './js/supabase-client.js'

  ;(async () => {
    initNav('scheduler')

    const session = await requireLogin()
    if (!session) return

    const member = await getCurrentMember()
    if (!member || !member.is_admin) {
      window.location.href = 'standings.html'
      return
    }

    // Populate week selector
    const weeks  = getUpcomingWeeks()
    const select = document.getElementById('week-select')

    if (weeks.length === 0) {
      select.innerHTML = '<option>Season complete — no upcoming weeks</option>'
      document.getElementById('generate-btn').disabled = true
    } else {
      weeks.forEach(week => {
        const opt       = document.createElement('option')
        opt.value       = week.toISOString().split('T')[0]
        opt.textContent = formatWeekLabel(week)
        select.appendChild(opt)
      })
    }

    document.getElementById('generate-btn').addEventListener('click', async () => {
      const btn        = document.getElementById('generate-btn')
      const resultsDiv = document.getElementById('scheduler-results')

      btn.disabled    = true
      btn.textContent = 'Generating…'
      resultsDiv.innerHTML = `
        <div class="scheduler-loading">
          <div class="loading-spinner"></div>
          <p>Analyzing match history &amp; computing pairings…</p>
        </div>`

      try {
        const weekStart = new Date(select.value + 'T12:00:00')
        const result    = await generateSchedule(weekStart)

        if (result.error) {
          resultsDiv.innerHTML = `<div class="alert alert-error">${result.error}</div>`
          return
        }

        renderResults(result, resultsDiv)
      } catch (e) {
        resultsDiv.innerHTML = `<div class="alert alert-error">Error: ${e.message}</div>`
      } finally {
        btn.disabled    = false
        btn.textContent = 'Generate Pairings'
      }
    })
  })()

  // ── Stored result for "Select" button ────────────────────
  let currentResult  = null
  let pendingOptIdx  = null

  function selectOption(idx) {
    const { options, idToName } = currentResult
    const opt = options[idx]
    pendingOptIdx = idx

    // Build modal court rows
    const courtsDiv = document.getElementById('modal-courts')
    courtsDiv.innerHTML = opt.courts.map(([[a, b], [c, d]], ci) => {
      const nameA = idToName[a], nameB = idToName[b]
      const nameC = idToName[c], nameD = idToName[d]
      return `
        <div class="modal-court-row">
          <div class="modal-court-label">Court ${ci + 1}</div>
          <div class="modal-court-matchup">${nameA} &amp; ${nameB} vs ${nameC} &amp; ${nameD}</div>
          <div class="modal-court-fields">
            <div class="modal-field">
              <label>Location</label>
              <input type="text" class="form-input court-location" data-court="${ci}" value="Woodway CC" placeholder="e.g. Woodway CC">
            </div>
            <div class="modal-field">
              <label>Time</label>
              <input type="text" class="form-input court-time" data-court="${ci}" value="7:00 PM" placeholder="e.g. 7:00 PM">
            </div>
          </div>
        </div>`
    }).join('')

    document.getElementById('schedule-modal').style.display = 'flex'
  }

  async function saveSchedule() {
    const { weekStart, options, idToName } = currentResult
    const opt = options[pendingOptIdx]

    const locationInputs = document.querySelectorAll('.court-location')
    const timeInputs     = document.querySelectorAll('.court-time')

    const courts = opt.courts.map(([[a, b], [c, d]], ci) => ({
      team1:    [idToName[a], idToName[b]],
      team2:    [idToName[c], idToName[d]],
      location: locationInputs[ci].value.trim() || 'Woodway CC',
      time:     timeInputs[ci].value.trim()     || '7:00 PM'
    }))

    const playedOn  = new Date(weekStart).toISOString().split('T')[0]
    const weekLabel = new Date(weekStart).toLocaleDateString('en-US',
      { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })

    const saveBtn = document.getElementById('modal-save')
    saveBtn.disabled    = true
    saveBtn.textContent = 'Saving…'

    const { error } = await supabase
      .from('scheduled_matches')
      .upsert({ week_label: weekLabel, played_on: playedOn, courts }, { onConflict: 'played_on' })

    saveBtn.disabled    = false
    saveBtn.textContent = 'Save Schedule'

    if (error) {
      alert('Error saving schedule: ' + error.message)
      return
    }

    document.getElementById('schedule-modal').style.display = 'none'

    // Update buttons to reflect saved state
    const selIdx = pendingOptIdx
    document.querySelectorAll('.select-option-btn').forEach((b, i) => {
      b.disabled    = true
      b.textContent = i === selIdx ? '✓ Scheduled' : 'Select This Option'
      if (i === selIdx) b.classList.add('btn-success')
    })
  }

  // Modal wiring (runs once)
  document.getElementById('modal-close').addEventListener('click',  () => { document.getElementById('schedule-modal').style.display = 'none' })
  document.getElementById('modal-cancel').addEventListener('click', () => { document.getElementById('schedule-modal').style.display = 'none' })
  document.getElementById('modal-save').addEventListener('click', saveSchedule)
  document.getElementById('schedule-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('schedule-modal')) document.getElementById('schedule-modal').style.display = 'none'
  })

  // ── Helpers ──────────────────────────────────────────────

  const matGet = (m, a, b) => (m[a] && m[a][b]) || 0
  const recGet = (m, a, b) => (m[a] && m[a][b]) || { wins: 0, losses: 0 }

  function fmtScore(val) {
    return val != null ? Number(val).toFixed(2) : 'N/A'
  }

  function diffClass(diff) {
    if (diff < 0.75)  return 'court-diff-low'
    if (diff < 1.75)  return 'court-diff-mid'
    return 'court-diff-high'
  }

  // ── Main render ──────────────────────────────────────────

  function renderResults(result, container) {
    currentResult = result
    const {
      weekStart, available, playing, sittingOut, tiebreakUsed,
      outings, options, idToName, scores, partnerCount, oppCount, partnerRecord
    } = result

    const label = new Date(weekStart).toLocaleDateString('en-US',
      { weekday: 'long', month: 'long', day: 'numeric' })

    let html = `<h2 class="scheduler-results-title">${label}</h2>`

    // Summary bar
    html += `
      <div class="sched-summary">
        <div class="sched-stat"><span class="sched-stat-val">${available.length}</span><span class="sched-stat-lbl">Available</span></div>
        <div class="sched-stat"><span class="sched-stat-val">${Math.floor(playing.length / 4)}</span><span class="sched-stat-lbl">Courts</span></div>
        <div class="sched-stat"><span class="sched-stat-val">${playing.length}</span><span class="sched-stat-lbl">Playing</span></div>
        ${sittingOut.length > 0 ? `<div class="sched-stat sched-stat-out"><span class="sched-stat-val">${sittingOut.length}</span><span class="sched-stat-lbl">Sitting Out</span></div>` : ''}
      </div>`

    // Sitting out
    if (sittingOut.length > 0) {
      html += `<div class="sitout-card card">`
      html += `<div class="sitout-header">Sitting Out This Week</div>`
      html += `<div class="sitout-players">`
      sittingOut.forEach(p => {
        const o = outings[p.id] || 0
        html += `<div class="sitout-player">
          <span class="sitout-name">${p.name}</span>
          <span class="sitout-outings">${o} outing${o !== 1 ? 's' : ''} this season</span>
        </div>`
      })
      html += `</div>`
      if (tiebreakUsed) {
        html += `<div class="tiebreak-note">Tiebreaker applied — random draw among players with equal outings</div>`
      }
      html += `</div>`
    }

    // Pairing options
    if (options.length === 0) {
      html += `<div class="alert alert-error">Could not generate valid pairings. Try again.</div>`
    } else {
      const labels = ['Best Overall', 'Option 2', 'Option 3']
      options.forEach((opt, i) => {
        const isTop = i === 0
        html += `
          <div class="pairing-option card ${isTop ? 'pairing-top' : ''}">
            <div class="pairing-option-label">${isTop ? '&#9733; ' : ''}${labels[i]}</div>
            <div class="courts-list">`

        opt.courts.forEach(([[a, b], [c, d]], ci) => {
          const nameA = idToName[a], nameB = idToName[b]
          const nameC = idToName[c], nameD = idToName[d]

          const sA = scores[a] ?? null, sB = scores[b] ?? null
          const sC = scores[c] ?? null, sD = scores[d] ?? null

          const t1Total = (sA ?? 5) + (sB ?? 5)
          const t2Total = (sC ?? 5) + (sD ?? 5)
          const diff    = Math.abs(t1Total - t2Total)

          const pct1 = matGet(partnerCount, a, b)
          const pct2 = matGet(partnerCount, c, d)
          const rec1 = recGet(partnerRecord, a, b)
          const rec2 = recGet(partnerRecord, c, d)

          const oAC = matGet(oppCount, a, c)
          const oAD = matGet(oppCount, a, d)
          const oBC = matGet(oppCount, b, c)
          const oBD = matGet(oppCount, b, d)

          html += `
            <div class="court-card">
              <div class="court-card-header">
                <span class="court-card-num">Court ${ci + 1}</span>
                <span class="court-diff ${diffClass(diff)}">Diff: ${diff.toFixed(2)}</span>
              </div>

              <div class="court-teams">
                <div class="court-team">
                  <div class="court-team-player">
                    <span class="ctp-name">${nameA}</span>
                    <span class="ctp-score">${fmtScore(sA)}</span>
                  </div>
                  <div class="court-team-player">
                    <span class="ctp-name">${nameB}</span>
                    <span class="ctp-score">${fmtScore(sB)}</span>
                  </div>
                  <div class="court-team-divider"></div>
                  <div class="court-team-total">
                    <span>Team total</span><span>${t1Total.toFixed(2)}</span>
                  </div>
                  <div class="court-team-record">Together this season: ${pct1}×</div>
                  <div class="court-team-record">
                    ${rec1.wins + rec1.losses === 0
                      ? 'No all-time history'
                      : `All-time: ${rec1.wins + rec1.losses}× &nbsp;&#8226;&nbsp; ${rec1.wins}-${rec1.losses}`}
                  </div>
                </div>

                <div class="court-vs-col">vs</div>

                <div class="court-team">
                  <div class="court-team-player">
                    <span class="ctp-name">${nameC}</span>
                    <span class="ctp-score">${fmtScore(sC)}</span>
                  </div>
                  <div class="court-team-player">
                    <span class="ctp-name">${nameD}</span>
                    <span class="ctp-score">${fmtScore(sD)}</span>
                  </div>
                  <div class="court-team-divider"></div>
                  <div class="court-team-total">
                    <span>Team total</span><span>${t2Total.toFixed(2)}</span>
                  </div>
                  <div class="court-team-record">Together this season: ${pct2}×</div>
                  <div class="court-team-record">
                    ${rec2.wins + rec2.losses === 0
                      ? 'No all-time history'
                      : `All-time: ${rec2.wins + rec2.losses}× &nbsp;&#8226;&nbsp; ${rec2.wins}-${rec2.losses}`}
                  </div>
                </div>
              </div>

              <div class="court-matchup-history">
                <span class="cmh-label">vs history:</span>
                <span class="cmh-pair">${nameA} &amp; ${nameC}: ${oAC}×</span>
                <span class="cmh-pair">${nameA} &amp; ${nameD}: ${oAD}×</span>
                <span class="cmh-pair">${nameB} &amp; ${nameC}: ${oBC}×</span>
                <span class="cmh-pair">${nameB} &amp; ${nameD}: ${oBD}×</span>
              </div>
            </div>`
        })

        html += `
          <div class="pairing-select-row">
            <button class="btn btn-primary select-option-btn" data-opt-idx="${i}">Select This Option</button>
          </div>`

        html += `</div></div>`
      })
    }

    container.innerHTML = html

    container.querySelectorAll('.select-option-btn').forEach(btn => {
      btn.addEventListener('click', () => selectOption(parseInt(btn.dataset.optIdx)))
    })
  }
</script>
</body>
</html>
